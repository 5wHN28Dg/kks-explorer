# None of them is in the APK's runtime classpath (the lockfiles list them under the plugins' classpath, lint's and
# aapt2's mirror walkdownDetachedTools, and the test configurations). Their metadata names no SPDX license, so each
# one is named here from its POM (or its parent POM, or the license file in its jar), at the version checked. The
# entries that Walkdown's own build has too (android/osv-scanner.toml, checked on 2026-10-07) are the same; those for
# checker-qual 2.5.8 and hamcrest 1.3 were checked on 2026-10-27. Only licenses on license-allowlist.txt are named.
#
# The last 12 entries leave build tools out of the license check (the user's decision, 2026-10-27, decision 0070):
# their license is not on the allowlist, which is for shipped code, and none of them reaches the APK
# (tests/test_plant_android_deps.py checks that none is in an APK runtime classpath). Licenses only: no vulnerability
# is ignored here.

