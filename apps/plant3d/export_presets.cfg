; Walkdown Plant's exports (decision 0054): build.sh runs them. Android: io.github.walkdown.plant, arm64-v8a only,
; no network permission; release signing comes from the environment (GODOT_ANDROID_KEYSTORE_RELEASE_PATH / _USER /
; _PASSWORD, from the plant's own key: build.sh), never from this file. Shaders are baked at export when the editor
; runs with a rendering device (build.sh release, under tools/plant3d/bench/offscreen.sh): Mobile for Android,
; Forward+ (Vulkan) for Linux and Windows. "Android unsigned" is the release build without a key, for CI's check.
[preset.0]

name="Android"
platform="Android"
runnable=false
export_filter="all_resources"
include_filter="built/*"
exclude_filter="*.sh,*.md,*.log,tests/*,sim/tests/*,builder/*,results/*,phone/*,flatpak/*,addons/*,android/*"
export_path="export/walkdown-plant.apk"

[preset.0.options]

shader_baker/enabled=true
gradle_build/use_gradle_build=true
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
keystore/debug=""
keystore/debug_user=""
keystore/debug_password=""
keystore/release=""
keystore/release_user=""
keystore/release_password=""
package/unique_name="io.github.walkdown.plant"
package/name="Walkdown Plant"
package/signed=true
version/code=1
version/name="0.1.0"
screen/immersive_mode=true
screen/support_small=true
screen/support_normal=true
screen/support_large=true
screen/support_xlarge=true
permissions/internet=false

