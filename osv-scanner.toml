# osv-scanner reads this file when it scans the repository (the policy's dependency and license checks).

# PyMuPDF's package metadata states its license only as free text ("Dual Licensed - GNU AFFERO GPL 3.0 or Artifex
# Commercial License"), which osv-scanner reports as "non-standard". This names the license we use it under:
# AGPL-3.0, as its COPYING file and https://pymupdf.readthedocs.io/en/latest/about.html#license-and-copyright say.
# The override changes only this package's license field; vulnerability matching is unaffected.
[[PackageOverrides]]
name = "pymupdf"
ecosystem = "PyPI"
license.override = ["AGPL-3.0-only"]
reason = "PyMuPDF is dual-licensed AGPL-3.0 / Artifex commercial; its metadata has no SPDX expression"
