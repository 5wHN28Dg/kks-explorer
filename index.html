<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plant P&amp;ID / Walkdown</title>
<link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#243440"><link rel="icon" href="/icon.svg"><link rel="apple-touch-icon" href="/icon-192.png">
<style>
:root{
  --chrome:#1c2730; --chrome2:#243440; --chrome3:#2f4352; --line:#3a5061;
  --ink:#e9eef2; --muted:#94a6b4; --accent:#ff7a1a; --review:#f2b705; --ok:#4f9cff; --bad:#ff5a5a;
  --mono: ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, monospace;
  --sans: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--chrome);color:var(--ink);font:14px/1.45 var(--sans)}
button,input,select,textarea{font:inherit;color:inherit}
#app{display:flex;flex-direction:column;height:100%}
header{display:flex;gap:8px;align-items:center;padding:8px 10px;padding-top:calc(8px + env(safe-area-inset-top,0px));background:var(--chrome2);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-weight:650;letter-spacing:.2px;margin-right:4px;white-space:nowrap}
.brand small{color:var(--muted);font-weight:400}
.search{position:relative;flex:1 1 260px;min-width:180px}
.search input{width:100%;padding:8px 10px;border-radius:6px;border:1px solid var(--line);background:var(--chrome);font-family:var(--mono)}
#results{position:absolute;top:100%;left:0;right:0;z-index:50;background:var(--chrome2);border:1px solid var(--line);border-radius:6px;max-height:60vh;overflow:auto;display:none;margin-top:4px}
.res{padding:7px 10px;cursor:pointer;border-bottom:1px solid var(--chrome3)}
.res:hover,.res.on{background:var(--chrome3)}
.res .k{font-family:var(--mono);color:var(--ink)}
.res .m{color:var(--muted);font-size:12px}
select,.btn{padding:7px 10px;border-radius:6px;border:1px solid var(--line);background:var(--chrome);cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.on{border-color:var(--accent);color:var(--accent)}
.sync{font-size:12.5px;color:var(--muted);white-space:nowrap}
a.btn{text-decoration:none;color:inherit;white-space:nowrap}
.pend{padding:4px 0}.pend img{display:block;max-width:140px;margin-top:4px;border-radius:4px}
.badge{font-size:11.5px;padding:1px 7px;border-radius:8px;background:var(--chrome3);white-space:nowrap}.badge.conflict{color:var(--bad)}.badge.queued{color:var(--review)}
.count{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--review);color:#1c2730;font-size:12px;font-weight:700;text-align:center;margin-left:4px}
main{position:relative;flex:1;min-height:0;overflow:hidden}
#viewer{position:absolute;inset:0;overflow:hidden;background:#5d6b75;touch-action:none;cursor:grab}
#viewer.drag{cursor:grabbing}
#stage,#stage2{position:absolute;left:0;top:0;transform-origin:0 0}
#sharp{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none;display:none}
#sheetimg{display:block;background:#fff;user-select:none;-webkit-user-drag:none}
.hs{position:absolute;border-radius:3px;cursor:pointer;background:rgba(79,156,255,.07);outline:1px solid rgba(79,156,255,.0)}
.hs:hover{background:rgba(79,156,255,.18);outline:2px solid var(--ok)}
.hs.review{outline:2px dashed var(--review);background:rgba(242,183,5,.12)}
.hs.sel{outline:4px solid var(--accent);background:rgba(255,122,26,.18)}
.hs.hl{background:rgba(255,122,26,.35);outline:3px solid var(--accent)}
.hs.floor{background:rgba(79,156,255,.35);outline:3px solid var(--ok)}
.hs.dim{opacity:.15}
.hs.pendmark{outline:2px dashed var(--accent);background:rgba(255,122,26,.10);pointer-events:none}
.vsym{position:absolute;pointer-events:none;border-radius:2px;outline:3px dashed #b0189f;background:rgba(176,24,159,.14)}
body.darkdwg .vsym{outline-color:#f07be0;background:rgba(240,123,224,.18)}
/* tags coloured by their photos (the same colours on every client): both green, the equipment only amber, the tag plate
   only blue, none red */
body.cover #layer .hs:not(.pendmark){outline:2px solid var(--pc);background:color-mix(in srgb,var(--pc) 28%,transparent)}
.p-both{--pc:#2ea043} .p-equipment{--pc:#e69600} .p-plate{--pc:#1e78e6} .p-none{--pc:#dc2828}
#coverlegend{display:none;position:absolute;left:8px;bottom:8px;z-index:5;background:var(--panel,#1c2730);color:inherit;padding:4px 8px;border-radius:6px;font-size:12px}
body.cover #coverlegend{display:block}
#coverlegend i{display:inline-block;width:10px;height:10px;margin:0 4px 0 8px;vertical-align:-1px;background:var(--pc)}
/* tags are buttons: out of the tab order except while selecting tags */
button.hs{border:0;padding:0;margin:0;font:inherit;color:inherit;-webkit-appearance:none;appearance:none}
/* selected for "… for all": a yellow ring in a black one, whatever colouring is on */
body #layer .hs.picked:not(.pendmark){outline:3px solid #ffd400;outline-offset:1px;box-shadow:0 0 0 6px rgba(0,0,0,.85)}
#layer .hs:focus-visible{outline:3px solid #fff;outline-offset:3px}
#viewer.selecting{cursor:crosshair}
#selbox{position:absolute;outline:2px dashed #1e78e6;background:rgba(30,120,230,.15);pointer-events:none}
#pickbar{position:absolute;left:8px;right:66px;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:22;display:none;gap:6px;align-items:center;flex-wrap:wrap;background:var(--chrome2);border:1px solid var(--line);border-radius:8px;padding:6px 8px;box-shadow:0 4px 18px rgba(0,0,0,.35)}
#pickbar.open{display:flex}
body.picking #toast{bottom:84px}
#pickCount{font-weight:650;margin-right:4px;white-space:nowrap}
#pickbar .hint{flex:1;min-width:0;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
dialog.multi{background:var(--chrome2);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:14px 16px;width:min(460px,94vw);max-height:86vh}
dialog.multi::backdrop{background:rgba(0,0,0,.6)}
dialog.multi h2{font-size:16px;margin:0 0 4px}
dialog.multi ul{list-style:none;padding:0;margin:8px 0;max-height:52vh;overflow:auto}
dialog.multi li label{display:flex;gap:8px;align-items:baseline;padding:5px 2px;border-bottom:1px solid var(--chrome3);cursor:pointer}
dialog.multi .btns{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
#markbox{position:absolute;outline:2px dashed var(--accent);background:rgba(255,122,26,.18);pointer-events:none}
#viewer.marking,#viewer.marking .hs{cursor:crosshair}
.zoom button.on{border-color:var(--accent);color:var(--accent)}
/* dark drawings (dark.js, the same as the desktop apps): the sheet's paper #121212, around it a lighter grey; tag colours
   raised toward white (dark.js lightenForDark, 0.35) so each keeps 3:1 against the dark paper */
body.darkdwg #viewer{background:#3d3d42;--ok:#8dbfff;--review:#f7d05c;--accent:#ffa96a}
body.darkdwg #sheetimg{background:#121212}
body.darkdwg :is(.hs,.sw).p-both{--pc:#77c185} body.darkdwg :is(.hs,.sw).p-equipment{--pc:#efbb59} body.darkdwg :is(.hs,.sw).p-plate{--pc:#6da7ef} body.darkdwg :is(.hs,.sw).p-none{--pc:#e87373}
body.hide-review .hs.review{display:none}
.zoom{position:absolute;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;z-index:5}
.zoom button{width:42px;height:42px;border-radius:21px;border:1px solid var(--line);background:var(--chrome2);font-size:19px;cursor:pointer}
#banner{position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:30;background:var(--accent);color:#1c2730;font-weight:600;padding:8px 12px;border-radius:6px;display:none;gap:10px;align-items:center;max-width:92%}
#banner button{background:#1c2730;color:var(--ink);border:0;border-radius:4px;padding:4px 10px;cursor:pointer}
#toast{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);background:var(--chrome3);padding:8px 14px;border-radius:6px;display:none;z-index:40}
/* side drawers + equipment panel */
.drawer{position:absolute;top:0;bottom:0;left:0;width:390px;max-width:100%;background:var(--chrome2);border-right:1px solid var(--line);z-index:20;display:none;flex-direction:column}
.drawer.open{display:flex}
.drawer .head{display:flex;gap:8px;align-items:center;padding:10px;border-bottom:1px solid var(--line)}
.drawer .head h2{font-size:15px;margin:0;flex:1}
.drawer .body{overflow:auto;flex:1;padding:6px 10px 20px}
.x{background:none;border:0;font-size:20px;cursor:pointer;color:var(--muted);padding:0 4px}
#panel{position:absolute;top:12px;right:12px;width:410px;max-height:calc(100% - 24px);overflow:auto;background:var(--chrome2);border:1px solid var(--line);border-radius:10px;z-index:25;display:none;box-shadow:0 8px 30px rgba(0,0,0,.35)}
#panel.open{display:block}
.grip{display:none}
.phead{position:sticky;top:0;background:var(--chrome2);padding:12px 14px 8px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:flex-start;z-index:2}
.kks{font-family:var(--mono);font-size:21px;font-weight:600;letter-spacing:.5px;word-break:break-all}
.kks .sfx{color:var(--accent)}
.sub{color:var(--muted);font-size:13px}
.sec{padding:10px 14px;border-bottom:1px solid var(--chrome3)}
.sec h3{font-size:13px;margin:0 0 6px;color:var(--muted);font-weight:600}
dl{display:grid;grid-template-columns:118px 1fr;gap:3px 10px;margin:0}
dt{color:var(--muted)} dd{margin:0}
.mono{font-family:var(--mono)}
.chip{display:inline-block;padding:2px 8px;margin:2px 4px 2px 0;border-radius:12px;background:var(--chrome3);cursor:pointer;font-size:12.5px}
.chip:hover{background:var(--line)}
.chip.mono{font-family:var(--mono)}
.field{display:flex;flex-direction:column;gap:3px;margin-bottom:8px}
.field label{font-size:12px;color:var(--muted)}
.field input,.field textarea,.cf input{padding:7px 8px;border-radius:5px;border:1px solid var(--line);background:var(--chrome);width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cf{display:grid;grid-template-columns:1fr 1.4fr 28px;gap:6px;margin-bottom:6px}
.primary{background:var(--accent);color:#1c2730;border:0;border-radius:6px;padding:8px 14px;font-weight:650;cursor:pointer}
.ghost{background:none;border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer}
.warn{border-left:3px solid var(--review);padding:6px 10px;background:rgba(242,183,5,.08);margin:6px 0;border-radius:0 4px 4px 0}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.photos figure{margin:0;position:relative}
.photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:5px;cursor:zoom-in}
.photos button{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.6);border:0;border-radius:3px;cursor:pointer;font-size:12px}
.crop{height:64px;border:1px solid var(--line);border-radius:4px;background-color:#fff;background-repeat:no-repeat;margin-bottom:6px}
.proc{padding:8px 6px;border-bottom:1px solid var(--chrome3);cursor:pointer}
.proc:hover{background:var(--chrome3)}
.proc .id{font-family:var(--mono);color:var(--muted);font-size:12px;margin-right:6px}
.proc .path{color:var(--muted);font-size:12px}
.chapter{margin:14px 0 4px;color:var(--accent);font-size:13px;font-weight:600}
.step{padding:8px 0;border-bottom:1px solid var(--chrome3)}
.step .n{font-family:var(--mono);color:var(--accent);margin-right:6px}
#sysBody details{margin-left:12px} #sysBody>details{margin-left:0}
#sysBody summary{padding:5px 2px;cursor:pointer;border-radius:4px} #sysBody summary:hover{background:var(--chrome3)}
#sysBody summary .c{color:var(--muted)}
#sysBody .lvl-blk>summary{color:var(--accent);font-weight:600} #sysBody .lvl-sys>summary{font-weight:600}
.sysrow{display:flex;gap:8px;align-items:baseline;width:100%;text-align:left;padding:6px 4px 6px 16px;border:0;border-bottom:1px solid var(--chrome3);background:none;color:inherit;font:inherit;cursor:pointer}
.sysrow:hover,.sysrow:focus-visible{background:var(--chrome3)}
.sysrow .mono{flex:none} .sysrow .d{flex:1;min-width:0;color:var(--muted);font-size:12.5px}
.sysdot{flex:none;width:9px;height:9px;border-radius:50%;background:var(--pc);align-self:center}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
.revitem{padding:8px 0;border-bottom:1px solid var(--chrome3);cursor:pointer}
@media (max-width:720px){
  .brand small{display:none}
  header{gap:6px}
  #panel{top:auto;bottom:0;left:0;right:0;width:auto;max-height:72%;border-radius:14px 14px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
  .grip{display:block;width:44px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 0}
  .drawer{width:100%}
}
.app .app-hide{display:none}
.lk{display:flex;gap:6px;align-items:flex-start}.lk>input,.lk>textarea{flex:1;min-width:0}
.lock input[readonly],.lock textarea[readonly]{background:transparent;border-color:transparent;padding-left:0;resize:none}
.pen{flex:none;width:34px;height:34px;border-radius:6px;border:1px solid var(--line);background:none;color:var(--muted);cursor:pointer;font-size:15px}
.pen:hover{color:var(--accent);border-color:var(--accent)} .editing .pen{display:none}
</style>
</head>
<body>
<div id="app">
<header>
  <div class="brand">Walkdown <small id="plantName"></small></div>
  <div class="search"><input id="q" placeholder="KKS, e.g. 11LAB70AA501, LBA, CP101, or a location…" autocomplete="off" spellcheck="false" role="combobox" aria-label="Search equipment by KKS code or description" aria-autocomplete="list" aria-expanded="false" aria-controls="results"><div id="results" role="listbox" aria-label="Search results"></div></div>
  <button class="btn" id="sysBtn" title="Every KKS code on the drawings, by block and system" aria-controls="sysDrawer" aria-expanded="false">Systems</button>
  <select id="sheetSel" title="Drawing"></select>
  <select id="floorSel" title="Show equipment on a floor"><option value="">All floors</option></select>
  <button class="btn" id="procBtn">Procedures</button>
  <button class="btn" id="revBtn">Review<span class="count" id="revCount">0</span></button>
  <button class="btn" id="notesBtn">Sheet notes</button>
  <span class="sync" id="syncStatus"></span>
  <a class="btn app-hide" href="learning.html" title="The three plant courses">Learning</a>
  <a class="btn" id="manageBtn" href="admin.html" title="Your account, approvals, users, history"><span id="who">Account</span><span class="count" id="queueCount" style="display:none"></span></a>
</header>
<main>
  <div id="viewer"><div id="stage"><img id="sheetimg" alt="P&amp;ID sheet" draggable="false"></div><canvas id="sharp"></canvas><div id="stage2"><div id="layer"></div></div></div>
  <div class="zoom"><button id="zin" title="Zoom in">+</button><button id="zout" title="Zoom out">−</button><button id="zfit" title="Fit sheet">⤢</button><button id="zmark" title="Mark a tag the app missed">✎</button><button id="zcover" title="Colour tags by photos" aria-pressed="false">📷</button><button id="zdark" title="Dark drawings" aria-label="Dark drawings" aria-pressed="false">◐</button><button id="zpick" title="Select tags: one photo, place or note for several" aria-label="Select tags" aria-pressed="false">☑</button></div>
  <div id="pickbar" role="region" aria-label="Selected tags"><span id="pickCount" aria-live="polite">0 selected</span>
    <button type="button" class="ghost" id="pickList">List</button><span class="hint">Click tags or drag a box</span>
    <button type="button" class="ghost" id="pickPhoto">Photo for all…</button><button type="button" class="ghost" id="pickPlace">Place for all…</button>
    <button type="button" class="ghost" id="pickNote">Note for all…</button><button type="button" class="primary" id="pickDone">Done</button></div>
  <div id="coverlegend" role="note">Photos:<i class="sw p-both"></i>both<i class="sw p-equipment"></i>equipment only<i class="sw p-plate"></i>tag plate only<i class="sw p-none"></i>none</div>
  <div id="banner"><span id="bannerText"></span><button id="bannerDone">Done</button></div>
  <div id="toast"></div>
  <aside class="drawer" id="procDrawer"><div class="head"><h2>Operation manual procedures</h2><button class="x" data-close="procDrawer">×</button></div>
    <div style="padding:8px 10px 0"><input id="procQ" placeholder="Filter procedures…" style="width:100%;padding:7px 8px;border-radius:5px;border:1px solid var(--line);background:var(--chrome)"></div>
    <div class="body" id="procBody"></div></aside>
  <aside class="drawer" id="sysDrawer" aria-labelledby="sysTitle"><div class="head"><h2 id="sysTitle">Equipment by system</h2><button class="x" data-close="sysDrawer" aria-label="Close equipment by system">×</button></div>
    <div style="padding:8px 10px 0"><input id="sysQ" type="search" aria-label="Filter equipment by system" aria-describedby="sysCount" placeholder="Filter: code, system, LAB70, valve, description…" autocomplete="off" spellcheck="false" style="width:100%;padding:7px 8px;border-radius:5px;border:1px solid var(--line);background:var(--chrome)">
    <div class="sub" id="sysCount" aria-live="polite" style="margin-top:4px"></div></div>
    <div class="body" id="sysBody"></div></aside>
  <aside class="drawer" id="revDrawer"><div class="head"><h2>Needs review</h2><button class="x" data-close="revDrawer">×</button></div>
    <div style="padding:8px 10px 0" class="sub">Tags the reader wasn't sure about. Check against the drawing, then confirm or mark “not a tag”. <label style="display:block;margin-top:6px"><input type="checkbox" id="hideRev"> Hide unreviewed tags on drawings</label></div>
    <div class="body" id="revBody"></div></aside>
  <aside class="drawer" id="notesDrawer"><div class="head"><h2>Markups on this sheet</h2><button class="x" data-close="notesDrawer">×</button></div><div class="body" id="notesBody"></div></aside>
  <aside id="panel"><div class="grip"></div><div id="panelBody"></div></aside>
</main>
</div>

<script src="common.js"></script>
<script src="systems.js"></script>
<script src="index.js"></script>
</body>
</html>
