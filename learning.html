<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Learning — Walkdown</title>
<link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#243440"><link rel="icon" href="/icon.svg">
<style>
:root{--chrome:#1c2730;--chrome2:#243440;--line:#3a5061;--ink:#e9eef2;--muted:#94a6b4;--accent:#ff7a1a;--ok:#4f9cff;
  --sans:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--chrome);color:var(--ink);font:14px/1.45 var(--sans)}
header{display:flex;gap:8px;align-items:center;padding:8px 10px;padding-top:calc(8px + env(safe-area-inset-top,0px));background:var(--chrome2);border-bottom:1px solid var(--line)}
.brand{font-weight:650;margin-right:auto}
.btn{padding:7px 10px;border-radius:6px;border:1px solid var(--line);background:var(--chrome);cursor:pointer;text-decoration:none;color:inherit}
main{padding:12px;max-width:760px;margin:0 auto}
a.course{display:block;background:var(--chrome2);border:1px solid var(--line);border-radius:8px;padding:14px;margin:10px 0;color:inherit;text-decoration:none}
a.course:hover{border-color:var(--accent)}
a.course h2{margin:0 0 4px;font-size:17px}
.sub{color:var(--muted);font-size:12.5px}
.bar{height:6px;border-radius:3px;background:var(--line);margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.app header{display:none}
</style>
</head>
<body>
<header><a class="btn" href="/">← Drawings</a><div class="brand">Learning</div><span class="sub" id="syncStatus"></span></header>
<main id="main"><p class="sub">Loading…</p></main>
<script src="common.js"></script>
<script src="learning.js"></script>
</body>
</html>
