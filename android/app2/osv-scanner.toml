# osv-scanner reads this file for the lockfiles in this directory (it does not look in parent directories).
#
# The Android build's tools (Gradle plugins, lint, the test platform), from the Gradle lockfiles. None of them is in
# the app's runtime classpath (the lockfiles list them under classpath, androidLintTool and
# unified-test-platform-gradle-work-action only), so none ships in the APK. Their metadata names no SPDX license, so
# each one is named here from its POM (or its parent POM, or the license file in its jar), checked on 2026-10-07.
# Those whose license is not on license-allowlist.txt (not AGPL-compatible: the allowlist is for shipped code) are
# left out of the license check, with their license in the reason. Pinned to the checked version: a new version gets
# checked again before an entry moves.

