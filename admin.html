<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Manage — KKS Explorer</title>
<link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#243440"><link rel="icon" href="/icon.svg">
<style>
:root{
  --chrome:#1c2730; --chrome2:#243440; --chrome3:#2f4352; --line:#3a5061;
  --ink:#e9eef2; --muted:#94a6b4; --accent:#ff7a1a; --review:#f2b705; --ok:#4f9cff; --bad:#ff5a5a;
  --mono: ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, monospace;
  --sans: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--chrome);color:var(--ink);font:14px/1.45 var(--sans)}
button,input,select,textarea{font:inherit;color:inherit}
header{display:flex;gap:8px;align-items:center;padding:8px 10px;padding-top:calc(8px + env(safe-area-inset-top,0px));background:var(--chrome2);border-bottom:1px solid var(--line);flex-wrap:wrap;position:sticky;top:0;z-index:5}
.brand{font-weight:650;margin-right:auto}
.btn,select{padding:7px 10px;border-radius:6px;border:1px solid var(--line);background:var(--chrome);cursor:pointer;text-decoration:none;color:inherit}
.btn:hover{border-color:var(--muted)} .btn.on{border-color:var(--accent);color:var(--accent)}
.sync{font-size:12.5px;color:var(--muted);white-space:nowrap}
nav{display:flex;gap:6px;flex-wrap:wrap;padding:10px;border-bottom:1px solid var(--line)}
main{padding:10px 12px 40px;max-width:1100px;margin:0 auto}
.count{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--review);color:#1c2730;font-size:12px;font-weight:700;text-align:center;margin-left:4px}
.card{background:var(--chrome2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:8px 0}
.card h3{margin:0 0 6px;font-size:14px;font-family:var(--mono)}
.sub{color:var(--muted);font-size:12.5px}
.mono{font-family:var(--mono)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.primary{background:var(--accent);color:#1c2730;border:0;border-radius:6px;padding:7px 12px;font-weight:650;cursor:pointer}
.ghost{background:none;border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer}
.danger{background:none;border:1px solid var(--bad);color:var(--bad);border-radius:6px;padding:6px 10px;cursor:pointer}
.warn{border-left:3px solid var(--review);padding:6px 10px;background:rgba(242,183,5,.08);margin:6px 0;border-radius:0 4px 4px 0}
.bad{border-left-color:var(--bad);background:rgba(255,90,90,.08)}
table{border-collapse:collapse;width:100%}
td,th{padding:5px 8px;border-bottom:1px solid var(--chrome3);text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12.5px}
.badge{font-size:11.5px;padding:1px 7px;border-radius:8px;background:var(--chrome3);white-space:nowrap}
.badge.conflict,.badge.rejected{color:var(--bad)} .badge.pending{color:var(--review)} .badge.approved{color:var(--ok)}
.photos{display:flex;gap:10px;flex-wrap:wrap}
.photos figure{margin:0;width:220px;background:var(--chrome);border:1px solid var(--line);border-radius:6px;padding:6px}
.photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:4px;cursor:zoom-in}
input,select,textarea{padding:7px 8px;border-radius:5px;border:1px solid var(--line);background:var(--chrome)}
form.inline{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.del{color:var(--bad)} .add{color:var(--ok)}
.linkbox{font-family:var(--mono);font-size:12.5px;word-break:break-all;background:var(--chrome);padding:6px 8px;border-radius:5px;border:1px solid var(--line);margin:6px 0}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--chrome3);padding:8px 14px;border-radius:6px;display:none;z-index:40;max-width:92%}
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:100}
#lightbox img{max-width:96%;max-height:92%}
.peer .server-only{display:none}
.app header{display:none}
</style>
</head>
<body>
<header>
  <a class="btn" href="/">← Drawings</a>
  <div class="brand">Manage</div>
  <span class="sync" id="syncStatus"></span>
  <span id="who" class="sub"></span>
  <button class="btn server-only" onclick="K.logout()">Log out</button>
</header>
<nav id="tabs"></nav>
<main id="main"></main>
<div id="toast"></div>
<div id="lightbox" onclick="this.style.display='none'"><img id="lbimg" alt=""></div>
<script src="common.js"></script>
<script src="qrcodegen.js"></script>
<script>
const $=s=>document.querySelector(s), esc=K.esc;
let ME=null, tab=null, SHEETS=[];
const isAdmin=()=>['admin','manager'].includes(ME.user.role), isManager=()=>ME.user.role==='manager';
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',3500)}
const when=ts=>ts?new Date(ts*1000).toLocaleString():'';
const lightbox=src=>{$('#lbimg').src=src;$('#lightbox').style.display='flex'};
async function act(fn,ok){ try{ const r=await fn(); if(ok) toast(ok); await show(tab); return r }catch(e){ toast(K.isNetErr(e)?'Offline: this needs the server.':e.message); return null } }

const TABS=[['queue','Approvals',isAdmin],['mine','My submissions',()=>true],['users','Users',isAdmin],['devices','Devices',()=>true],['drawings','Drawings',()=>isAdmin()&&!K.cfg?.app],['history','History',isAdmin],['account','Account',()=>true]];
async function init(){
  ME=await K.start(); K.toast=toast;
  $('#who').textContent=`${ME.user.full_name||ME.user.username} · ${ME.user.role}`;
  const t=location.hash.slice(1); show(TABS.some(x=>x[0]===t&&x[2]())?t:isAdmin()?'queue':'mine');
}
async function show(t){
  tab=t; history.replaceState(null,'','#'+t);
  $('#tabs').innerHTML=TABS.filter(x=>x[2]()).map(([id,label])=>`<button class="btn${id===t?' on':''}" onclick="show('${id}')">${label}${id==='queue'?'<span class="count" id="qn" style="display:none"></span>':''}${id==='account'&&ME.transfer_offer?'<span class="count">!</span>':''}</button>`).join('');
  if(!K.online&&t!=='account'){ $('#main').innerHTML='<div class="warn">You are offline. Approvals, users and history need the server. Changes you make on the drawings are queued and sent when you reconnect.</div>'; return }
  try{ await VIEWS[t]() }catch(e){ if(e.status===401) return location.reload(); $('#main').innerHTML=`<div class="warn bad">${esc(K.isNetErr(e)?'Cannot reach the server.':e.message)}</div>` }
}
K.onChange(why=>{ if(why==='synced') show(tab) });
addEventListener('hashchange',()=>{ const t=location.hash.slice(1); if(ME&&t!==tab&&TABS.some(x=>x[0]===t&&x[2]())) show(t) });

// ---------- rendering a submission ----------
const val=v=>v==null||v===''?'<span class="sub">(empty)</span>':Array.isArray(v)?esc(v.map(c=>c.k+': '+c.v).join('; ')||'(none)'):typeof v==='object'?`<span class="mono">${esc(JSON.stringify(v))}</span>`:esc(v);
function detail(s){
  const p=s.payload;
  if(s.kind==='equipment'){
    const live=(s.live?.[0]?.value)||{}, cf=new Set((s.conflicts||[]).map(c=>c.field));
    return `<table><tr><th>Field</th><th>Now</th><th>Proposed</th>${cf.size?'<th>Submitter saw</th>':''}</tr>${Object.entries(p.changes).map(([f,v])=>
      `<tr${cf.has(f)?' style="background:rgba(255,90,90,.08)"':''}><td>${esc(f)}</td><td>${val(live[f])}</td><td>${val(v)}</td>${cf.size?`<td>${cf.has(f)?val(p.base[f]):''}</td>`:''}</tr>`).join('')}</table>`;
  }
  if(s.kind==='tag_add'){
    const sh=SHEETS.find(x=>x.id===p.sheet), b=p.bbox;
    let crop='';
    if(sh){ const w=b[2]-b[0]+40, h=b[3]-b[1]+40, sc=Math.min(420/w,160/h);
      crop=`<div style="width:${Math.round(w*sc)}px;height:${Math.round(h*sc)}px;background:#fff url('${esc(sh.file)}') no-repeat;background-size:${sh.w*sc}px auto;background-position:${-(b[0]-20)*sc}px ${-(b[1]-20)*sc}px;border:1px solid var(--line);border-radius:4px;margin:6px 0"></div>` }
    return `<div>${esc(K.describe(s.kind,p))} <a href="/?sheet=${encodeURIComponent(p.sheet)}" class="sub">open sheet</a></div>${crop}
      ${p.note?`<div class="sub">Note: ${esc(p.note)}</div>`:''}
      <div class="row" style="margin-top:4px"><span class="sub">Code as it should be saved:</span>
      <input id="ek-${s.id}" class="mono" value="${esc((p.kks||'')+(p.suffix||''))}" placeholder="KKS, empty = review queue" style="width:190px">
      <input id="ei-${s.id}" class="mono" value="${esc(p.isa||'')}" placeholder="letters" style="width:80px"></div>`;
  }
  if(s.kind==='tag_remove') return `<div class="del">${esc(K.describe(s.kind,p))}</div>`;
  if(s.kind==='review') return `<div>${esc(K.describe(s.kind,p))}</div>${s.live?`<div class="sub">Now: ${val(s.live[0].value)}</div>`:''}`;
  if(s.kind==='photo_delete') return `<div class="del">Delete this photo</div>${s.live?.[0]?.value?`<div class="photos"><figure><img src="photos/${esc(s.live[0].value.file)}" onclick="lightbox(this.src)" alt=""></figure></div>`:'<div class="sub">(already gone)</div>'}`;
  return `<div class="${s.kind==='link'&&p.on===false?'del':'add'}">${esc(K.describe(s.kind,p))}</div>`;
}
const who=s=>s.by_name&&s.by_name!==s.by?`${esc(s.by_name)} <span class="mono">(${esc(s.by)})</span>`:esc(s.by);  // full name + username
const badge=s=>{ const st=s.conflicts?.length?'conflict':s.status; return `<span class="badge ${st}">${st}</span>` };

// ---------- views ----------
const VIEWS={
  async queue(){
    if(!SHEETS.length) SHEETS=await K.api('/data/sheets.json').catch(()=>[]);
    const subs=(await K.api('/api/submissions?status=open')).submissions.reverse();
    const qn=$('#qn'); if(qn){qn.textContent=subs.length; qn.style.display=subs.length?'':'none'}
    if(!subs.length){ $('#main').innerHTML='<p class="sub">Nothing waiting for approval.</p>'; return }
    const groups={}; for(const s of subs)(groups[s.target]??=[]).push(s);
    let h='<p class="sub">Oldest first. Approving applies the change and records it in History, where it can be reverted.</p>';
    for(const [target,L] of Object.entries(groups)){
      if(L[0].kind==='photo'){
        const kks=L[0].payload.kks;
        h+=`<div class="card"><h3>Photo proposals · ${esc(kks)}</h3>${L.length>1?'<div class="sub">Several photos proposed. “Use this one” approves it and rejects the others. Votes are only a hint.</div>':''}
          <div class="photos">${L.map(s=>`<figure><img src="photos/${esc(s.payload.file)}" onclick="lightbox(this.src)" alt="">
          <div class="sub">${who(s)} · ${when(s.created)} · ${s.votes} vote${s.votes===1?'':'s'}</div>${s.payload.caption?`<div>${esc(s.payload.caption)}</div>`:''}
          <div class="row" style="margin-top:6px">${L.length>1?`<button class="primary" onclick="decide(${s.id},'pick')">Use this one</button><button class="ghost" onclick="decide(${s.id},'approve')">Add</button>`:`<button class="primary" onclick="decide(${s.id},'approve')">Approve</button>`}
          <button class="danger" onclick="decide(${s.id},'reject')">Reject</button></div></figure>`).join('')}</div></div>`;
        continue;
      }
      h+=`<div class="card"><h3>${esc(target)}</h3>${L.map(s=>`<div style="margin:8px 0;padding-top:6px;border-top:1px solid var(--chrome3)">
        <div class="row">${badge(s)}<span class="sub">#${s.id} · ${who(s)} · ${when(s.created)}</span></div>
        ${s.conflicts?.length?`<div class="warn bad">Conflict: ${s.kind==='equipment'?'highlighted field(s) changed after this was submitted':'this changed after it was submitted'}. Approving overwrites the current value.</div>`:''}
        ${detail(s)}
        <div class="row" style="margin-top:6px">${s.conflicts?.length?`<button class="primary" onclick="decide(${s.id},'approve',true)">Overwrite with proposal</button>`:`<button class="primary" onclick="decide(${s.id},'approve')">Approve</button>`}
        <button class="danger" onclick="decide(${s.id},'reject')">Reject</button></div></div>`).join('')}</div>`;
    }
    $('#main').innerHTML=h;
  },
  async mine(){
    const all=(await K.api('/api/submissions?status=all&limit=300')).submissions;
    const mine=all.filter(s=>s.mine), vote=all.filter(s=>!s.mine&&s.kind==='photo'&&['pending','conflict'].includes(s.status));
    let h='';
    if(K.outbox.length) h+=`<div class="card"><h3>Queued on this device (${K.outbox.length})</h3><div class="sub">Sent automatically when the server is reachable.</div>${K.outbox.map(i=>`<div>${esc(K.describe(i.kind,i.payload))}</div>`).join('')}</div>`;
    if(vote.length) h+=`<div class="card"><h3>Photo proposals from others</h3><div class="sub">Vote for the photo that shows the equipment best. An admin makes the final choice.</div><div class="photos">${vote.map(s=>`<figure><img src="photos/${esc(s.payload.file)}" onclick="lightbox(this.src)" alt=""><div class="sub">${esc(s.payload.kks)} · ${esc(s.by)} · ${s.votes} vote${s.votes===1?'':'s'}</div><button class="${s.voted?'primary':'ghost'}" onclick="vote(${s.id})">${s.voted?'Voted ✓':'Vote'}</button></figure>`).join('')}</div></div>`;
    h+=`<table><tr><th>#</th><th>Status</th><th>Change</th><th>Sent</th><th>Decision</th><th></th></tr>${mine.map(s=>`<tr><td class="sub">${s.id}</td><td>${badge(s)}</td><td>${esc(K.describe(s.kind,s.payload))}</td><td class="sub">${when(s.created)}</td>
      <td class="sub">${s.status==='conflict'?'waiting for an admin (clashes with a newer change)':esc(s.note&&!s.note.startsWith('[')?s.note:'')}</td><td>${['pending','conflict'].includes(s.status)?`<button class="ghost" onclick="withdraw(${s.id})">Withdraw</button>`:''}</td></tr>`).join('')}</table>`;
    $('#main').innerHTML=h||'<p class="sub">No submissions yet.</p>';
    if(!mine.length) $('#main').insertAdjacentHTML('beforeend','<p class="sub">You haven\'t submitted anything yet.</p>');
  },
  async users(){
    const U=(await K.api('/api/users')).users;
    const canEdit=u=>u.role==='user'||(u.role==='admin'&&isManager());
    $('#main').innerHTML=`<div class="card server-only"><h3>Add an account</h3>
      <form class="inline" onsubmit="event.preventDefault();createUser(this)"><input name="full_name" placeholder="Full name" required maxlength="80" style="min-width:200px">
      <input name="position" placeholder="Position (optional)" maxlength="80"><input name="username" placeholder="username" required maxlength="40">
      <select name="role"><option value="user">user</option>${isManager()?'<option value="admin">admin</option>':''}</select><button class="primary">Create and get link</button></form>
      <div class="sub">There is no email: you get a one-time link (valid 7 days) to give the person. They set their own password with it.</div><div id="newlink"></div></div>
      <table><tr><th>Name</th><th>Username</th><th>Role</th><th>Status</th><th></th></tr>${U.map(u=>`<tr><td>${u.full_name?esc(u.full_name):'<span class="del">no name yet</span>'}${u.position?`<div class="sub">${esc(u.position)}</div>`:''}</td>
      <td class="mono">${esc(u.username)}${u.id===ME.user.id?' <span class="sub">(you)</span>':''}</td>
      <td>${u.role}</td><td>${u.no_account?(u.active?`own device${u.devices===1?'':'s'} <span class="sub">(${u.devices})</span>`:'<span class="del">all devices removed</span>'):u.active?(u.has_password?'active':'<span class="sub">link not used yet</span>'):'<span class="del">deactivated</span>'}</td>
      <td class="row">${u.no_account?(canEdit(u)?`${u.active?`<button class="ghost" onclick="confirm('Remove all devices of ${esc(u.username)}? They stop syncing.')&&setPerson('${u.person}',{active:false})">Remove devices</button>`:''}
        ${isManager()?`<button class="ghost" onclick="setPerson('${u.person}',{role:'${u.role==='admin'?'user':'admin'}'})">${u.role==='admin'?'Make user':'Make admin'}</button>`:''}`:''):canEdit(u)&&u.id!==ME.user.id?`<button class="ghost" onclick="setUser(${u.id},{active:${!u.active}})">${u.active?'Deactivate':'Activate'}</button>
        ${isManager()?`<button class="ghost" onclick="setUser(${u.id},{role:'${u.role==='admin'?'user':'admin'}'})">${u.role==='admin'?'Make user':'Make admin'}</button>`:''}
        <button class="ghost" onclick="resetLink(${u.id},'${esc(u.username)}')">Password link</button>`:''}
        ${canEdit(u)&&u.id!==ME.user.id&&!u.no_account?`<button class="ghost" onclick="editDetails(${u.id},'${esc(u.full_name).replace(/'/g,'&#39;')}','${esc(u.position).replace(/'/g,'&#39;')}')">Edit details</button>`:''}</td></tr>`).join('')}</table>
      <p class="sub">Deactivating signs the person out everywhere and stops syncing. Plant data already saved on their device for offline use stays there until they next connect (at most ${ME.offline_days} days of offline access).</p>`;
  },
  async devices(){
    const D=await K.api('/api/devices'), S=D.sync, ago=t=>t?`${Math.max(0,Math.round((Date.now()/1000-t)/60))} min ago`:'';
    const devRow=(d,mine)=>`<tr><td>${esc(d.label||'device')}${d.this_computer?' <span class="sub">(this one)</span>':''}${mine?'':`<div class="sub">${esc(d.username)}</div>`}</td>
      <td class="mono sub">${esc(d.device.slice(0,12))}…</td><td>${d.revoked?'<span class="del">removed</span>':'active'}</td>
      <td>${!d.revoked&&!d.this_computer?`<button class="ghost" onclick="confirm('Remove this device? It stops syncing; what it already holds stays on it.')&&act(()=>K.api('/api/devices/revoke',{device:'${d.device}'}),'Device removed')">Remove</button>`:''}</td></tr>`;
    let h=`<div class="card"><h3>Your devices</h3><table>${D.mine.map(d=>devRow(d,true)).join('')}</table>
      <div class="sub">A lost or stolen phone or laptop: remove it here from any of your other devices (or ask an admin). Its changes made after that don't count anywhere.</div></div>
      <div class="card"><h3>Syncing</h3><div class="sub">This ${D.mode==='peer'?'computer':'server'}: <span class="mono">${esc((D.node||'').slice(0,12))}…</span> · sync port ${D.sync_port||'off'} · finding devices on this Wi-Fi: ${esc(S.discovery)}</div>
      <table><tr><th>Device</th><th>Address</th><th>Last sync</th><th></th></tr>${Object.values(S.syncs).map(s=>`<tr><td>${esc(s.name||(s.peer?s.peer.slice(0,12)+'…':'unknown device'))}</td><td class="mono sub">${esc(s.address||'')}</td>
        <td>${ago(s.at)} ${s.ok?`<span class="sub">received ${s.result.received}, sent ${s.result.sent}${s.result.they_denied?' · it does not know this device yet':''}${s.result.denied?' · not certified here: sent nothing':''}</span>`:`<span class="del">${esc(s.error||'failed')}</span>`}</td><td></td></tr>`).join('')||'<tr><td colspan="4" class="sub">No syncs yet.</td></tr>'}</table>
      ${S.found.length?`<div class="sub" style="margin-top:6px">Found on this Wi-Fi: ${S.found.map(f=>esc(f.name||f.host)).join(', ')}</div>`:''}
      <form class="inline" onsubmit="event.preventDefault();syncNow(this.address.value)"><button class="primary" type="button" onclick="syncNow('')">Sync now</button>
      <input name="address" placeholder="or an address, e.g. 192.168.1.20" style="min-width:220px"><button class="ghost">Sync with it</button></form></div>
      <div class="card"><h3>Bundle files</h3><div class="sub">A bundle carries the plant log (optionally with photos) by USB or messaging, where Wi-Fi sync can't reach. It is not encrypted: treat it like a copy of the database.</div>
      <div class="row" style="margin-top:8px">${isAdmin()?`<a class="ghost" href="/api/bundle" onclick="return exportBundle(0)" style="text-decoration:none;color:inherit">Export bundle</a><a class="ghost" href="/api/bundle?photos=1" onclick="return exportBundle(1)" style="text-decoration:none;color:inherit">Export with photos</a>`:''}
      <label class="ghost" style="cursor:pointer">Import a bundle<input type="file" accept=".kksbundle" hidden onchange="importBundle(this)"></label></div></div>`;
    if(isAdmin()) h+=`<div class="card"><h3>Add a device with a QR code</h3><div class="sub">For someone next to you on the same network: they choose "Join with a QR code" when they set up the app and scan this. You then see who asks and accept; their device syncs the plant from this ${K.cfg?.app?'phone':D.mode==='peer'?'computer':'server'}. No files needed. The code works once, for 15 minutes.</div>
      <div id="invite"><button class="primary" style="margin-top:8px" onclick="startInvite()">Show QR code</button></div></div>
      <div class="card"><h3>Waiting to join</h3><div class="sub">Devices on this Wi-Fi that asked without a code (“Ask an admin on this Wi-Fi”). Accept only if the code next to the name is the one on their screen.</div><div id="lobby"></div></div>
      <div class="card"><h3>Add a computer from a join request</h3><div class="sub">Someone set up the app on their laptop and gave you a <span class="mono">.kksjoin</span> file. Importing it certifies that laptop; then give them a bundle (export above) to import, or let it sync on the same Wi-Fi.</div>
      <label class="primary" style="display:inline-block;margin-top:8px;cursor:pointer">Import join request<input type="file" accept=".kksjoin,.json" hidden onchange="importJoin(this)"></label></div>
      <div class="card"><h3>All devices</h3><table>${D.all.map(d=>devRow(d,false)).join('')}</table></div>`;
    $('#main').innerHTML=h;
    if(isAdmin()) pollLobby();
  },
  async history(before){
    const R=(await K.api('/api/revisions'+(before?`?before=${before}`:''))).revisions;
    const summary=r=>{ const a=r.after?JSON.parse(r.after):null, b=r.before?JSON.parse(r.before):null;
      if(r.entity==='user') return esc(r.note);
      if(r.entity==='sheet') return `<span class="mono">${esc(r.key)}</span> ${esc(r.note)}`;
      if(r.entity==='link'){ const [p,s,k]=JSON.parse(r.key); return `${a?'<span class="add">linked</span>':'<span class="del">unlinked</span>'} ${esc(k)} · proc ${esc(p)} step ${s}` }
      if(r.entity==='added_tag'){ const t=a||b; return `${a?'<span class="add">tag marked</span>':'<span class="del">marked tag removed</span>'} ${esc(t.isa||'')} ${esc((t.kks||'(no code)')+(t.suffix||''))} on ${esc(t.sheet)}` }
      if(r.entity==='photo') return a?`<span class="add">photo added</span> ${esc(a.kks)}`:`<span class="del">photo removed</span> ${esc(b?.kks||'')}`;
      if(r.entity==='equipment'){ const keys=[...new Set([...Object.keys(a||{}),...Object.keys(b||{})])].filter(k=>JSON.stringify((a||{})[k])!==JSON.stringify((b||{})[k]));
        return `${esc(r.key)}: `+keys.map(k=>`${esc(k)} ${val((b||{})[k])} → ${val((a||{})[k])}`).join(' · ') }
      return `${esc(r.entity)} ${esc(r.key)}: ${val(b)} → ${val(a)}` };
    $('#main').innerHTML=`<p class="sub">Every applied change, newest first. <b>Revert</b> undoes one change. <b>Restore to here</b> puts all data (notes, locations, photos, links, reviews) back to how it was right after that change. Both are new entries themselves, so they can be undone too. Accounts are not affected.</p>
      <table><tr><th>Rev</th><th>When</th><th>By</th><th>Change</th><th></th></tr>${R.map(r=>`<tr><td class="mono">${r.rev}</td><td class="sub">${when(r.ts)}</td><td>${esc(r.full_name||r.username||'server console')}</td>
      <td>${summary(r)}${r.note&&!['user','sheet'].includes(r.entity)?` <span class="sub">(${esc(r.note)})</span>`:''}</td>
      <td class="row">${!['user','sheet'].includes(r.entity)?`<button class="ghost" onclick="revert('${r.hid}')">Revert</button><button class="ghost" onclick="restoreTo('${r.hid}',${r.rev})">Restore to here</button>`:''}</td></tr>`).join('')}</table>
      ${R.length?`<div class="row" style="margin-top:10px">${R.length===100?`<button class="ghost" onclick="VIEWS.history(${R[R.length-1].rev})">Older →</button>`:''}${isAdmin()?`<button class="danger" onclick="restoreTo(0)">Restore to before any logged change</button>`:''}</div>`:'<p class="sub">No changes yet.</p>'}`;
  },
  async drawings(){
    const D=await K.api('/api/sheets'), imp=D.importer, job=D.job;
    const busy=job?.state==='running', ids=new Set(D.sheets.map(s=>s.id));
    let h=`<div class="card"><h3>Add a drawing</h3>`;
    if(!imp.available) h+=`<div class="warn bad">The importer isn't set up on the server: ${esc(imp.error)}</div>
      <div class="sub">On the server, in the app folder: <span class="mono">python3 app.py setup-importer</span> (creates <span class="mono">.venv</span>; nothing is installed system-wide). Then reload this page.</div>`;
    else h+=`<form id="impForm" onsubmit="event.preventDefault();startImport(this)">
      <div class="row"><input type="file" name="pdf" accept="application/pdf,.pdf" required onchange="impFile(this)">
      <input name="name" placeholder="Name, e.g. Condensate System" required maxlength="80" style="flex:1;min-width:200px" oninput="impName(this)">
      <input name="id" placeholder="sheet id" required maxlength="24" style="width:150px" class="mono" oninput="impId(this)"></div>
      <div class="row" style="margin-top:8px"><label>Orientation <select name="rotate"><option value="auto">Auto</option><option value="0">0°</option><option value="90">90°</option><option value="180">180°</option><option value="270">270°</option></select></label>
      <label id="impReplace" style="display:none"><input type="checkbox" name="replace"> Replace the existing sheet with this id</label>
      <button class="primary" ${busy?'disabled':''}>Import</button></div>
      <div class="sub" style="margin-top:6px">Vector PDFs plotted from AutoCAD only (scans won't work); page 1 is read. Takes about a minute. The tag list is backed up first and put back if the import fails.</div></form>`;
    h+='</div><div id="job"></div>';
    h+=`<table><tr><th>Drawing</th><th>Id</th><th>Tags</th><th></th></tr>${D.sheets.map(s=>`<tr><td>${esc(s.name)}<div class="sub">${s.w}×${s.h} px${s.notes?.length?` · ${s.notes.length} markup note(s)`:''}</div></td>
      <td class="mono">${esc(s.id)}</td><td class="sub">${s.tags.auto||0} auto · ${s.tags.verified||0} verified · ${s.tags.review||0} to review</td>
      <td class="row"><a class="ghost" href="/?sheet=${encodeURIComponent(s.id)}" style="text-decoration:none;color:inherit">Open</a>
      ${s.has_source&&imp.available?`<select id="rot-${esc(s.id)}"><option value="auto">auto</option><option value="0">0°</option><option value="90">90°</option><option value="180">180°</option><option value="270">270°</option></select><button class="ghost" ${busy?'disabled':''} onclick="reimport('${esc(s.id)}',document.getElementById('rot-${esc(s.id)}').value)">Re-import</button>`:''}
      <button class="danger" ${busy?'disabled':''} onclick="removeSheet('${esc(s.id)}','${esc(s.name).replace(/'/g,'&#39;')}')">Remove</button></td></tr>`).join('')}</table>
      <p class="sub">Remove takes the sheet and its tags out of the app. The image, tag list and uploaded PDF stay in the server's backups folder. Notes, photos and procedure links are stored per KKS, so they come back if the sheet is imported again.</p>`;
    $('#main').innerHTML=h; window._sheetIds=ids; renderJob(job);
    if(busy) pollJob();
  },
  async account(){
    if(K.online){ try{ ME=await K.api('/api/me') }catch(e){} }
    const sw=!!navigator.serviceWorker?.controller, secure=window.isSecureContext;
    const lease=await K.idb.get('me');
    let h=`<div class="card"><h3>Your details</h3>${ME.user.full_name?'':'<div class="warn">Add your full name, so others can tell whose account this is.</div>'}
      <form class="inline" onsubmit="event.preventDefault();saveDetails(this)"><input name="full_name" placeholder="Full name" value="${esc(ME.user.full_name)}" required maxlength="80" style="min-width:220px">
      <input name="position" placeholder="Position (optional)" value="${esc(ME.user.position)}" maxlength="80"><button class="primary">Save</button></form>
      <div class="sub">Username <span class="mono">${esc(ME.user.username)}</span> · ${ME.user.role}</div></div>
      <div class="card server-only"><h3>Password</h3>
      <form class="inline" onsubmit="event.preventDefault();changePw(this)"><input type="password" name="old" placeholder="current password" autocomplete="current-password" required>
      <input type="password" name="new" placeholder="new password (10+)" autocomplete="new-password" required minlength="10"><button class="primary">Change password</button></form></div>`;
    if(ME.transfer_offer) h+=`<div class="card"><h3>The manager wants to hand the manager role to you</h3><div class="sub">You would become the single top account. The current manager becomes an admin.</div>
      <div class="row" style="margin-top:8px"><button class="primary" onclick="mgr('accept')">Accept</button><button class="ghost" onclick="mgr('decline')">Decline</button></div></div>`;
    if(isManager()){
      const t=ME.transfer_pending;
      h+=`<div class="card server-only"><h3>Hand over the manager role</h3>${t?`<div>Offered to <b>${esc(t.to_name)}</b>, waiting for them to accept (until ${when(t.expires)}). <button class="ghost" onclick="mgr('cancel')">Cancel offer</button></div>`:
        `<div class="sub">Only to an existing admin. They must accept; you then become an admin. If the manager account is ever lost, whoever runs the server can use <span class="mono">python3 app.py reset-manager --user NAME</span>.</div>
        <form class="inline" onsubmit="event.preventDefault();mgr('transfer',{username:this.username.value,password:this.password.value})"><input name="username" placeholder="admin username" required>
        <input type="password" name="password" placeholder="your password" autocomplete="current-password" required><button class="primary">Offer role</button></form>`}</div>`;
    }
    h+=`<div class="card server-only"><h3>This device</h3><table>
      <tr><td>Offline app</td><td>${sw?'installed: drawings and data you have opened work without the server':secure?'installing… reload once':'<span class="del">not available</span>: needs HTTPS (or localhost). Over plain http on the LAN the page works only while connected.'}</td></tr>
      <tr><td>Offline access until</td><td>${lease?new Date(lease.lease_until).toLocaleString():'-'} <span class="sub">(renewed each time you connect; ${ME.offline_days} days)</span></td></tr>
      <tr><td>Queued changes</td><td>${K.outbox.length}</td></tr></table>
      <div class="row" style="margin-top:8px"><button class="ghost" onclick="K.flush()">Sync now</button><button class="danger" onclick="K.logout()">Log out and remove plant data from this device</button></div></div>`;
    $('#main').innerHTML=h;
  },
};

// ---------- drawings ----------
const slug=v=>v.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,24);
let idTouched=false;
function impFile(inp){ const f=inp.files[0], F=inp.form; if(!f) return; if(!F.name.value) F.name.value=f.name.replace(/\.pdf$/i,'').replace(/[_]+/g,' ').trim(); if(!idTouched){ F.id.value=slug(F.name.value); impId(F.id,true) } }
function impName(inp){ if(!idTouched){ inp.form.id.value=slug(inp.value); impId(inp.form.id,true) } }
function impId(inp,auto){ if(!auto) idTouched=true; $('#impReplace').style.display=window._sheetIds?.has(inp.value)?'':'none' }
async function startImport(F){
  const f=F.pdf.files[0]; if(!f) return;
  const q=new URLSearchParams({id:F.id.value.trim(),name:F.name.value.trim(),rotate:F.rotate.value,replace:F.replace.checked?'1':'0'});
  if(F.replace.checked&&!confirm(`Replace sheet "${F.id.value}"? Its tags are re-read from this PDF (the current ones are backed up).`)) return;
  toast('Uploading…');
  try{
    const r=await fetch('/api/sheets/import?'+q,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/pdf'},body:f});
    const d=await r.json().catch(()=>({})); if(!r.ok) throw new Error(d.error||r.statusText);
    idTouched=false; await show('drawings');
  }catch(e){ toast(K.isNetErr(e)?'Offline: this needs the server.':e.message) }
}
async function reimport(id,rotate){
  if(!confirm(`Re-read sheet "${id}" from its stored PDF (orientation: ${rotate})? The current tags are backed up.`)) return;
  await act(()=>K.api('/api/sheets/reimport',{id,rotate}),'Import started');
}
function removeSheet(id,name){ confirm(`Remove "${name}" (${id}) from the app?`)&&act(()=>K.api(`/api/sheets/${id}/remove`,{}),'Sheet removed') }
function renderJob(job){
  const el=$('#job'); if(!el||!job) return;
  const r=job.result, head={running:'Importing…',done:'Import finished',failed:'Import failed'}[job.state];
  let h=`<div class="card"><h3>${head} · ${esc(job.name)} (${esc(job.sheet)})</h3><div class="sub">by ${esc(job.by)} · orientation ${esc(job.rotate)}${job.state==='running'?' · this page updates by itself':''}</div>
    <pre class="linkbox" style="max-height:220px;overflow:auto;white-space:pre-wrap">${esc(job.log.join('\n'))}</pre>`;
  if(job.state==='done'&&r){
    const back=(r.rotation+180)%360;
    h+=`<div><b>${r.auto}</b> tags read automatically, <b>${r.review}</b> in the review queue${r.notes?`, ${r.notes} markup note(s)`:''}.</div>
      <div class="sub" style="margin:6px 0">Check the preview is upright. Auto orientation retries sheets that read badly, but it isn't guaranteed.</div>
      <img src="data/sheets/${esc(r.id)}.png?v=${job.finished}" alt="" style="width:100%;max-height:420px;object-fit:contain;background:#fff;border-radius:4px" onclick="lightbox(this.src)">
      <div class="row" style="margin-top:8px"><a class="primary" href="/?sheet=${encodeURIComponent(r.id)}" style="text-decoration:none">Open in viewer</a>
      <button class="ghost" onclick="reimport('${esc(r.id)}','${back}')">Upside down? Re-import rotated to ${back}°</button></div>`;
  }
  el.innerHTML=h+'</div>';
}
let pollT=null;
function pollJob(){ clearTimeout(pollT); pollT=setTimeout(async()=>{
  if(tab!=='drawings') return;
  try{ const {job}=await K.api('/api/sheets/job'); if(job?.state==='running'){ renderJob(job); pollJob() } else show('drawings') }catch(e){ pollJob() }
},1500) }

// ---------- actions ----------
async function decide(id,action,force){
  let note='';
  if(action==='reject'){ note=prompt('Reason (optional, shown to the submitter):',''); if(note===null) return }
  if(force&&!confirm('Overwrite the current value with this proposal?')) return;
  const ek=document.getElementById('ek-'+id), ei=document.getElementById('ei-'+id);   // hand-marked tag: approve with the edited code
  const edit=ek&&action==='approve'?{kks:ek.value.trim().toUpperCase(),isa:ei.value.trim().toUpperCase()}:undefined;
  await act(()=>K.api(`/api/submissions/${id}/${action}`,{force:!!force,note,edit}),{approve:'Approved',pick:'Photo chosen, others rejected',reject:'Rejected'}[action]);
}
const vote=id=>act(()=>K.api(`/api/submissions/${id}/vote`,{}));
const withdraw=id=>confirm('Withdraw this submission?')&&act(()=>K.api(`/api/submissions/${id}/withdraw`,{}),'Withdrawn');
async function createUser(f){
  const r=await act(()=>K.api('/api/users',{username:f.username.value.trim(),role:f.role.value,full_name:f.full_name.value,position:f.position.value}),'Account created');
  if(r) $('#newlink').innerHTML=`<div class="warn">Give this link to <b>${esc(f.username.value)}</b> (valid ${r.expires_days} days, works once):<div class="linkbox">${esc(r.link)}</div></div>`;
}
const setUser=(id,d)=>act(()=>K.api(`/api/users/${id}`,d),'Updated');
const exportBundle=photos=>{ if(!K.native) return true; K.native.saveApi('plant.kksbundle','/api/bundle'+(photos?'?photos=1':'')); return false };
const setPerson=(pid,d)=>act(()=>K.api(`/api/persons/${pid}`,d),'Updated');
const syncNow=address=>act(()=>K.api('/api/sync/now',{address}),'Synced');
async function importBundle(inp){ const f=inp.files[0]; if(!f) return; try{ const r=await K.importBundle(f); toast(`Imported ${r.entries} entries, ${r.photos} photos`); show('devices') }catch(e){ toast(e.message) } }
// ---------- join by invite (QR code, or asked on the Wi-Fi without one): PROTOCOL.md §16 ----------
let lobbyTimer=null, lobbySeen='';
async function pollLobby(){
  clearTimeout(lobbyTimer);
  const el=$('#lobby'); if(!el) return;          // left the Devices page
  let r; try{ r=await K.api('/api/join-requests') }catch(e){ el.innerHTML=`<div class="sub">${esc(e.message)}</div>`; return }
  const key=JSON.stringify(r.requests.map(q=>[q.device,q.existing?.username]));
  if(key!==lobbySeen||!el.firstChild){ lobbySeen=key;
    el.innerHTML=r.requests.length?r.requests.map(q=>{const x=q.request;return `<div class="row" style="margin-top:8px;align-items:center">
      <span style="font-family:var(--mono);font-size:18px;letter-spacing:2px">${q.code.slice(0,3)} ${q.code.slice(3)}</span>
      <span><b>${esc(x.full_name)}</b> (${esc(x.username)}${x.position?', '+esc(x.position):''}) · “${esc(x.label||'?')}”${q.existing?`<br><span class="sub">${esc(q.existing.full_name)} (${esc(q.existing.username)}, ${esc(q.existing.role)}) already exists: accepting adds this device as theirs.</span>`:''}</span>
      <button class="primary" onclick="decideLobby('${q.device}','accept',${!!q.existing})">Accept</button><button class="ghost" onclick="decideLobby('${q.device}','refuse')">Refuse</button></div>`}).join('')
      :'<div class="sub" style="margin-top:6px">Nobody is waiting.</div>' }
  lobbyTimer=setTimeout(pollLobby,2000);
}
async function decideLobby(device,action,existing){
  try{ const r=await K.api(`/api/join-requests/${device}`,{action,existing_ok:!!existing}); toast(action==='accept'?`Accepted ${r.username}: their device gets the plant over the Wi-Fi now`:'Refused'); lobbySeen=''; pollLobby() }catch(e){ toast(e.message) }
}
function qrSvg(text){
  const q=qrcodegen.QrCode.encodeText(text,qrcodegen.QrCode.Ecc.MEDIUM), b=4, n=q.size+2*b; let d='';
  for(let y=0;y<q.size;y++) for(let x=0;x<q.size;x++) if(q.getModule(x,y)) d+=`M${x+b},${y+b}h1v1h-1z`;
  return `<svg viewBox="0 0 ${n} ${n}" width="280" height="280" shape-rendering="crispEdges" style="background:#fff;border-radius:6px;display:block;max-width:100%;height:auto"><path d="${d}" fill="#000"/></svg>`;
}
let inviteTimer=null;
async function startInvite(){
  clearTimeout(inviteTimer);
  let r; try{ r=await K.api('/api/invites',{}) }catch(e){ return toast(e.message) }
  const tok=r.invite.token, box=$('#invite');
  box.innerHTML=`<div class="row" style="align-items:flex-start;margin-top:8px"><div>${qrSvg(r.code)}</div>
    <div style="flex:1;min-width:220px"><div class="sub">Plant ${esc(r.invite.plant||'')} · reachable at ${r.invite.addrs.map(esc).join(', ')}</div>
    <div id="invstate" style="margin:8px 0">Waiting for a device to scan it…</div>
    <details><summary class="sub" style="cursor:pointer">No camera? Copy the code instead</summary>
    <textarea readonly rows="4" style="width:100%;font-family:var(--mono);font-size:11px" onclick="this.select()">${esc(r.code)}</textarea>
    <button class="ghost" onclick="navigator.clipboard.writeText(${esc(JSON.stringify(r.code))}).then(()=>toast('Copied'))">Copy</button></details>
    <button class="ghost" style="margin-top:8px" onclick="cancelInvite('${tok}')">Cancel</button></div></div>`;
  pollInvite(tok);
}
async function pollInvite(tok){
  const el=$('#invstate'); if(!el) return;            // left the Devices page
  let st; try{ st=await K.api(`/api/invites/${tok}`) }catch(e){ el.textContent=e.message; return }
  const who=q=>`<b>${esc(q.full_name)}</b> (${esc(q.username)}${q.position?', '+esc(q.position):''}) · device “${esc(q.label||'?')}”`;
  if(st.state==='open') el.innerHTML='Waiting for a device to scan it…';
  else if(st.state==='asked'){ if(el.dataset.asked!==st.request.device){ el.dataset.asked=st.request.device;
      el.innerHTML=`${who(st.request)} wants to join.${st.existing?`<div class="sub">${esc(st.existing.full_name)} (${esc(st.existing.username)}, ${esc(st.existing.role)}) already exists: accepting adds this device as theirs. Only if you know it is them.</div>`:'<div class="sub">A new person (role: user).</div>'}
        <div class="row" style="margin-top:6px"><button class="primary" onclick="decideInvite('${tok}','accept',${!!st.existing})">Accept</button><button class="ghost" onclick="decideInvite('${tok}','refuse')">Refuse</button></div>` } }
  else { el.innerHTML={accepted:`Accepted ${who(st.request)}. Their device is syncing the plant now.`,refused:'Refused.',cancelled:'Cancelled.',expired:'Expired. Show a new code if they still need one.'}[st.state]||esc(st.state); return }
  inviteTimer=setTimeout(()=>pollInvite(tok),1500);
}
async function decideInvite(tok,action,existing){
  try{ await K.api(`/api/invites/${tok}`,{action,existing_ok:!!existing}); clearTimeout(inviteTimer); pollInvite(tok) }catch(e){ toast(e.message) }
}
async function cancelInvite(tok){ clearTimeout(inviteTimer); try{ await K.api(`/api/invites/${tok}`,{action:'cancel'}) }catch(e){} $('#invite').innerHTML='<button class="primary" style="margin-top:8px" onclick="startInvite()">Show QR code</button>' }
async function importJoin(inp,existing_ok){
  const f=inp.files?inp.files[0]:null, request=inp.request||JSON.parse(await f.text());
  try{ const r=await K.api('/api/devices/import-request',{request,existing_ok:!!existing_ok}); toast(`Certified a device for ${r.username}. Now give them a bundle.`); show('devices') }
  catch(e){ if(e.status===409&&e.data?.existing){ const x=e.data.existing;
      if(confirm(`${x.full_name} (${x.username}, ${x.role}) already exists. Add this computer as another device of theirs? Only if you know it is them.`)) return importJoin({request},true) }
    else toast(e.message) }
}
async function resetLink(id,name){
  if(!confirm(`Create a new password link for ${name}? Their current password keeps working until they use it.`)) return;
  const r=await act(()=>K.api(`/api/users/${id}/reset`,{}));
  if(r) $('#main').insertAdjacentHTML('afterbegin',`<div class="warn">Password link for <b>${esc(name)}</b> (valid ${r.expires_days} days, works once):<div class="linkbox">${esc(r.link)}</div></div>`);
}
async function revert(rev,force){
  try{ await K.api(`/api/revisions/${rev}/revert`,{force:!!force}); toast('Reverted'); show('history') }
  catch(e){ if(e.status===409&&confirm('This item was changed again after that revision. Revert anyway (discarding the later change)?')) return revert(rev,true); if(e.status!==409) toast(e.message) }
}
const restoreTo=(hid,rev)=>confirm(hid?`Put all plant data back to how it was right after revision ${rev}? Later changes stay in History and can be re-applied.`:'Put all plant data back to how it was before the first logged change?')&&act(()=>K.api('/api/restore',hid?{hid}:{rev:0}),'Restored');
async function saveDetails(f){ if(await act(()=>K.api('/api/profile',{full_name:f.full_name.value,position:f.position.value}),'Saved')){ ME=await K.api('/api/me'); $('#who').textContent=`${ME.user.full_name||ME.user.username} · ${ME.user.role}`; show('account') } }
async function editDetails(id,name,pos){
  const n=prompt('Full name:',name); if(n===null) return; const p=prompt('Position (optional):',pos); if(p===null) return;
  await act(()=>K.api(`/api/users/${id}`,{full_name:n,position:p}),'Details updated');
}
async function changePw(f){ if(await act(()=>K.api('/api/password',{old:f.old.value,new:f.new.value}),'Password changed. Other devices are signed out.')) f.reset() }
const mgr=(a,d={})=>(a!=='accept'||confirm('Become the manager?'))&&act(()=>K.api('/api/manager/'+a,d),{transfer:'Offer sent',accept:'You are now the manager',decline:'Declined',cancel:'Offer cancelled'}[a]).then(r=>{ if(r&&a==='accept') location.reload() });
init();
</script>
