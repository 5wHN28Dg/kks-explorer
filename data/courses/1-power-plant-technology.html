  ['Separate water from the steam-water mixture coming up from the evaporator.',true,'Correct.'],
  ['Mix chemicals.',false,'No.'],
  ['Heat the water.',false,'No.']
 ],''),
 Q('c10d','In a 2+1 layout:',[
  ['Two GTs with their own HRSGs feed one steam turbine.',true,'Correct.'],
  ['One GT feeds two steam turbines.',false,'Reversed.'],
  ['Two generators share one shaft.',false,'No.']
 ],''),
 Q('c10e','Why do HRSG modules expand downwards?',[
  ['They hang from supports at the top.',true,'Right.'],

M.push({id:'chem', n:'11', title:'Water chemistry', short:'Chemistry',
goal:['State what power plant chemistry is for and the damage it prevents.','Explain the four pillars: demineralised water, alkalisation, deaeration, monitoring.','Explain protective oxide layers, the pH–corrosion link, AVT and FAC.'],
body:()=>`
<h3>What chemistry is for</h3>
<ul>
<li>Minimise metal loss and corrosion.</li>
<li>Minimise deposits on heat-transfer surfaces.</li>
<li>Build and keep protective oxide layers in pipes and vessels.</li>
<li>Monitor all of this by analysis and online measurement.</li>
<li>Comply with environmental law.</li>
</ul>
<h3>The damage it prevents</h3>
${table(['Damage','Cause','Consequence'],[
 ['Deposits in boiler tubes','dissolved salts and corrosion products left behind as water boils','insulates the tube, metal overheats and fails'],
 ['Local overheating failure','deposits or poor circulation','tube bulges and bursts'],
 ['External corrosion','wet insulation on hot pipes and hangers','hidden wall loss'],
 ['Pump damage','deposits and wear','loss of performance, failures'],
 ['Turbine deposits','salts and silica carried with steam','lost output, blade damage']
])}
<h3>How corrosion is avoided: four pillars</h3>
${table(['Pillar','System (KKS)','What it does'],[
 ['Salt-free water','demin plant (GC)','removes dissolved salts'],
 ['Alkalisation','dosing systems (QCC, QCD)','raises pH with ammonia, and phosphate in drums'],
 ['Deaeration','deaerator (LAA), dosing','removes oxygen; oxygen scavenger if used'],
 ['Monitoring','sampling system (QU)','continuous analysis of water and steam']
])}
${flag('One slide lists the dosing systems as "QCC, QCC"; the next names them QCC and QCD.')}
<h3>pH and corrosion</h3>
<p>Carbon steel corrodes fast in acidic water and much more slowly in mildly alkaline water. The deck's chart shows relative corrosion against pH at 25 °C: high at low pH, lowest in the alkaline range (around pH 9–10), rising again in strongly alkaline water. Power plant water is kept just alkaline, in that low-corrosion window.</p>
<h3>Protective layers</h3>
<p>Steel in hot, clean, alkaline, oxygen-poor water grows a thin, tight black layer of <b>magnetite (Fe₃O₄)</b> that protects the metal underneath. Other iron oxides matter too: <b>hematite (Fe₂O₃)</b>, red, forms with oxygen (rust); <b>wüstite (FeO)</b>, black, is stable only above about 560 °C, in superheater tubes. Good chemistry keeps the magnetite layer intact.</p>
<h3>Two terms from the deck</h3>
<ul>
<li><b>AVT (all-volatile treatment):</b> alkalising only with volatile chemicals (ammonia) that travel with the steam and leave no solids behind. Phosphate, by contrast, is a solid that stays in the drum water.</li>
<li><b>FAC (flow-accelerated corrosion):</b> fast-flowing water, especially at bends and where water and steam mix, dissolves the magnetite layer faster than it can re-form, and the pipe wall thins. Worst at around 150 °C in carbon steel. A classic cause of feedwater and economizer pipe failures.</li>
</ul>
<h3>Rules and guidelines</h3>
<p>Limits come from standards (VGB R-513, EN 12952) and the turbine maker's steam purity rules (Siemens STIM 11.002, with separate values for normal operation and start-up). Each plant gets a chemistry report covering dosing, lab analysis scope and frequency, circulating water treatment (biocide, chlorine), auxiliary systems and troubleshooting. Ask for your plant's.</p>`,
warm: Q('h11w','Guess: why is a thin black oxide layer inside boiler tubes a good thing?',[
 ['It is magnetite, which protects the steel from further corrosion.',true,'Right.'],
 ['It improves heat transfer.',false,'Oxides don\'t help heat transfer; this one is thin enough not to hurt it.'],
 ['It is paint.',false,'It grows naturally in the water.']
],''),
worked:{case:'An inspection finds a feedwater pipe elbow thinned to half its wall. Chemistry was "in spec". What mechanism fits?',steps:[
 ['Location','An elbow: high local velocity and turbulence.'],
 ['Service','Feedwater at moderate temperature (around 150 °C).'],
 ['Mechanism','Flow-accelerated corrosion: the flow strips the magnetite layer faster than it can re-form.'],
 ['Response','Wall-thickness monitoring at FAC-prone points; review pH and oxygen regime; consider alloy material at the worst spots.']
]},
practice:[
 Q('h11a','What does the QU system do?',[
  ['Samples and analyses water and steam.',true,'Correct.'],
  ['Doses ammonia.',false,'That is QCC/QCD.'],
  ['Removes oxygen.',false,'That is the deaerator.']
 ],''),
 Q('h11b','Why keep feedwater slightly alkaline?',[
  ['Steel corrodes least in mildly alkaline water.',true,'Right.'],
  ['To raise conductivity.',false,'Not the goal.'],
  ['To make it boil faster.',false,'No.']
 ],''),
 Q('h11c','What is AVT?',[
  ['Alkalising only with volatile chemicals such as ammonia.',true,'Correct.'],
  ['Adding phosphate to drums.',false,'Phosphate is non-volatile.'],
  ['A turbine vibration test.',false,'No.']
 ],''),
 Q('h11d','Where would you look first for FAC?',[
  ['Bends and fittings in feedwater and economizer piping.',true,'Right.'],
  ['Superheater outlets.',false,'Dry steam at high temperature isn\'t typical FAC territory.'],
  ['Cooling tower basin.',false,'No.']

]});

M.push({id:'docs', n:'12', title:'P&IDs and KKS', short:'P&ID & KKS',
goal:['Read a P&ID cover sheet and process sheet.','Break a KKS code into plant, unit, system, equipment and signal parts.','Use KKS number ranges to tell what kind of valve or measurement a code is.'],
body:()=>`
<h3>The P&amp;ID cover page</h3>
<p>Before any process drawing, the cover page tells you: client, vendor, drawing and revision number, system name and its KKS, building KKS, project, revision history and change list, supply responsibility (who provides what), and the design pressure and temperature of each section.</p>
<h3>The process page</h3>
<ul>
<li><b>Clouds</b> mark changes; a <b>triangle</b> gives the change number from the change list.</li>
<li>Each pipe shows its <b>KKS and insulation</b>, <b>slope</b> and <b>flow direction</b>.</li>
<li><b>Connectors</b> at the edge name the next P&amp;ID the line continues on.</li>
<li>Orifices, <b>locked valves</b> (for example a manual globe valve locked open) and notes are marked.</li>
<li>Instruments carry their KKS (system, component, building) and letters for function: <b>L</b> level, <b>I</b> indicator, <b>S</b> switching, <b>A</b> alarm, <b>Z</b> protection.</li>
</ul>
<p>The pictogram overview (legend) at the start of the set defines every symbol. Always check it; symbols differ between suppliers.</p>
<h3>KKS: three kinds of identification</h3>
${table(['Kind','Answers','Identifies'],[
 ['Process-related','what is its purpose?','systems and equipment by function, in mechanical, civil, electrical and I&C'],
 ['Point of installation','where is it mounted (and fed from)?','electrical and I&C equipment in cabinets, panels, consoles'],
 ['Location','where do I find it on site?','buildings, floors, rooms']
])}
<h3>Anatomy of a process-related code</h3>
${kksAnatomy('12 MBP 13 AA 001 XB01',[['1','plant','--muted'],['2','unit','--muted'],['MBP','system','--accent'],['13','system number','--accent'],['AA','equipment type','--act'],['001','equipment number','--act'],['XB01','signal','--ok']])}
${table(['Part','Format','Example','Meaning'],[
 ['Plant and unit','N N','1 2','which plant and which generating unit'],
 ['System code','A A A','MBP','M = main machine set; MB = gas turbine; MBP = a GT subsystem (fuel supply)'],
 ['System number','N N','13','which section of that system'],
 ['Equipment unit code','A A','AA','valve (AP pump, CP pressure measurement...)'],
 ['Equipment number','N N N','001','which one; the range tells the kind (below)'],
 ['Signal code','A A N N','XB01','which signal from that equipment']
])}
<p>Function codes can also be written like <span class="num">11MBY10CS901.XQ01</span>: plant/unit 11, system MBY10, equipment CS901 (a speed measurement), signal XQ01 (an analog value).</p>
${flag('The deck\'s plant/unit slide labels "12" as plant 1, block 2, but its own table right below says code 12 = generating unit 1, gas turbine 2. The meaning of the two digits is set per project. Check Rumaila\'s KKS key.')}
<h3>System letters</h3>
${table(['First letter','Main group','Examples'],[
 ['E','fuel supply and handling',''],
 ['H','steam generation (boiler, HRSG)','HAD evaporator'],
 ['L','steam, water, gas cycles','LAA feedwater tank / deaerator, LAB feedwater piping, LBG auxiliary steam'],
 ['M','main machine sets','MA steam turbine (MAA HP turbine), MB gas turbine (MBD bearings, MBV lube oil), MK generator'],
 ['G','water supply and treatment','GC demineralisation'],
 ['Q','auxiliary systems','QCC/QCD chemical dosing, QU sampling']
])}
<h3>Equipment codes and number ranges</h3>
${table(['Code','Is'],[['AA','valve, damper'],['AP','pump'],['BR','pipe'],['CE','electrical measurement'],['CF','flow measurement'],['CL','level measurement'],['CP','pressure measurement'],['CT','temperature measurement'],['EC','sub-group control (SGC)'],['EE','sub-loop control (SLC)']])}
${table(['AA valve number','Kind'],[['001–100','valves in main pipes'],['101–190','control valves'],['191–199','safety valves'],['301–399','shut-off valves for measurements'],['401–499','drain valves'],['501–599','vent valves'],['601–699','dosing and sampling valves']],[0])}
${table(['C measurement number','Kind'],[['001–199','binary and analog measurements'],['201–299','for testing automatics'],['401–499','performance test measurements'],['501–599','local measurements'],['901–999','combined (calculated) measurements']],[0])}
<h3>Signal codes</h3>
<p>First letter: <b>X</b> origin of the signal, <b>Y</b> use of a signal, <b>Z</b> linked (processed) signal. Examples: <b>XQ</b> analog value; <b>ZQ</b> linked analog; <b>XS</b> functional group step signal; <b>XH</b> binary limit derived from an analog; <b>ZV</b> linked protection or alarm signal; <b>YP</b> supervisory control signal.</p>
<p>Try the <b>KKS decoder</b> page to take codes apart.</p>`,
warm: Q('d12w','Guess: a valve is tagged ...LAB20AA402. Before you look it up, what kind of valve is it probably?',[
 ['A drain valve.',true,'Right: AA 401–499 are drain valves. LAB is feedwater piping.'],
 ['A control valve.',false,'Control valves are 101–190.'],
 ['A safety valve.',false,'Safety valves are 191–199.']
],''),

 ['Plant/unit','11: per the deck\'s table, unit 1, gas turbine 1 train (check the project key).'],

 ['So','A local pressure gauge on an evaporator/drum system of train 1. On site, the building and room codes would tell you where to walk.']
]},

  ['Pump.',true,'Correct.'],
  ['Pressure measurement.',false,'That is CP.'],
  ['Valve.',false,'That is AA.']

  ['Control valves.',false,'Those are 101–190.']

  ['A change, numbered in the change list.',true,'Right.'],
  ['A steam cloud hazard.',false,'No.'],
  ['A vent to atmosphere.',false,'No.']

  ['A valve command.',false,'No.']

function actHTML(q, label){
  const src = q.src ? `<span class="src">${q.src}</span>` : '';
  if(q.type==='order'){
    return `<div class="act" data-qid="${q.id}"><div class="kind"><span>${label||'Put in order'}</span>${src}</div><div class="q">${q.q}</div><div class="seq"></div><div class="pool"></div><div class="row"><button class="btn" data-check>Check order</button><button class="btn ghost" data-reset>Start again</button></div><div class="fbwrap"></div></div>`;
  }
  const panel = q.type==='scn' ? `<div class="panel">${q.panel.map(([t,v,c])=>`<div class="tag-r"><span>${t}</span><span class="val ${c||''}">${v}</span></div>`).join('')}</div>` : '';
  return `<div class="act" data-qid="${q.id}"><div class="kind"><span>${label|| (q.type==='scn'?'Scenario':'Practice')}</span>${src}</div>${panel}<div class="q">${q.q}</div><div class="opts"></div><div class="fbwrap"></div></div>`;
}
function wire(root, q, opts={}){
  const el = root.querySelector(`[data-qid="${q.id}"]`); if(!el) return;
  const fbw = el.querySelector('.fbwrap');
  if(q.type==='order'){
    const seq = el.querySelector('.seq'), pool = el.querySelector('.pool');
    let chosen = [];
    const order = shuffle(q.steps.map((s,i)=>i));
    function draw(){
      seq.innerHTML = chosen.map((i,k)=>`<button class="step" data-i="${i}"><span class="i">${k+1}</span><span>${q.steps[i]}</span></button>`).join('');
      pool.innerHTML = order.filter(i=>!chosen.includes(i)).map(i=>`<button class="step" data-i="${i}"><span class="i">·</span><span>${q.steps[i]}</span></button>`).join('');
    }
    pool.addEventListener('click', e=>{ const b=e.target.closest('.step'); if(!b) return; chosen.push(+b.dataset.i); fbw.innerHTML=''; draw(); });
    seq.addEventListener('click', e=>{ const b=e.target.closest('.step'); if(!b) return; chosen = chosen.filter(i=>i!==+b.dataset.i); fbw.innerHTML=''; draw(); });
    el.querySelector('[data-reset]').addEventListener('click', ()=>{ chosen=[]; fbw.innerHTML=''; draw(); });
    el.querySelector('[data-check]').addEventListener('click', ()=>{
      if(chosen.length < q.steps.length){ fbw.innerHTML = `<div class="fb wrong"><b>Not finished.</b>Place all ${q.steps.length} steps first.</div>`; return; }
      const good = chosen.map((i,k)=>i===k);
      [...seq.children].forEach((b,k)=>b.classList.add(good[k]?'right':'wrong'));
      const n = good.filter(Boolean).length;
      if(n===q.steps.length){ fbw.innerHTML = `<div class="fb right"><b>All in the right order.</b></div>`; markSolved(q.id); }
      else { fbw.innerHTML = `<div class="fb wrong"><b>${n} of ${q.steps.length} in the right place.</b>Red steps are out of position. Tap a step to take it back, or start again.</div>`; }
    });
    draw(); return;
  }
  const box = el.querySelector('.opts');
  const idx = shuffle(q.o.map((o,i)=>i));
  box.innerHTML = idx.map(i=>`<button class="opt" data-i="${i}">${q.o[i][0]}</button>`).join('');
  let first = true;
  box.addEventListener('click', e=>{
    const b = e.target.closest('.opt'); if(!b) return;
    if(opts.lockAfterFirst && !first) return;
    const [t,ok,fb] = q.o[+b.dataset.i];
    box.querySelectorAll('.opt').forEach(x=>x.classList.remove('wrong'));
    b.classList.add(ok?'right':'wrong');
    fbw.innerHTML = `<div class="fb ${ok?'right':'wrong'}"><b>${ok?'Right.':'Not quite.'}</b>${fb||''}</div>`;
    if(opts.lockAfterFirst){
      if(!ok){ const ri = q.o.findIndex(o=>o[1]); box.querySelector(`[data-i="${ri}"]`).classList.add('right'); fbw.innerHTML += `<div class="fb right"><b>Correct answer:</b>${q.o[ri][0]} ${q.o[ri][2]||''}</div>`; }
      box.querySelectorAll('.opt').forEach(x=>x.style.cursor='default');
    }
    if(first){ opts.onAnswer && opts.onAnswer(ok); first=false; }
    if(ok) markSolved(q.id);
  });
}

  const items = shuffle(FINAL.map(it=>({m:it.m,q:Object.assign({},it.q,{id:it.q.id+'_f'})})));
  let score=0, answered=0; const missed=[];
  mainEl.innerHTML = `<div class="eyebrow">Test</div><h1>Final check</h1>
  <p>${items.length} mixed questions from every module, one attempt each. Experienced staff can also take it first: the modules it sends you to are the ones worth your time. Score ${Math.ceil(items.length*0.85)} or more and go on to <a href="${FND_URL}" target="_blank" rel="noopener">Rumaila Plant Foundations</a>.</p>

  items.forEach(it=>wire(mainEl,it.q,{lockAfterFirst:true,onAnswer:ok=>{
    answered++; if(ok) score++; else missed.push(it.m);
    document.getElementById('fscore').textContent = `${score} / ${answered} right${answered===items.length?' · finished':''}`;
    if(answered===items.length){
      const mods=[...new Set(missed)];
      document.getElementById('fmiss').innerHTML = (score>=Math.ceil(items.length*0.85)?`<p style="color:var(--ok)"><b>Done.</b> Go on to <a href="${FND_URL}" target="_blank" rel="noopener">Rumaila Plant Foundations</a>.</p>`:`<p style="color:var(--act)"><b>Not yet.</b> Revisit the modules below, then try again.</p>`) + (mods.length?'Revisit: '+mods.map(id=>`<button class="chip gochip" data-go="${id}">${modName(id)}</button>`).join(' '):'');
    }
  }}));
}

function renderKKS(){
  mainEl.innerHTML = `<div class="eyebrow">Tool</div><h1>KKS decoder</h1>
  <p>Type or paste a process-related KKS code. The decoder splits it into its parts and explains each one using the tables from Module 12 and the standard VGB KKS letters. System names outside those tables are shown as unknown. Always confirm against Rumaila's own KKS key.</p>
  <div class="act"><label for="kksin" class="kind"><span>KKS code</span></label>
  <input id="kksin" class="kksin" value="12 MBP 13 AA 001 XB01" autocomplete="off" spellcheck="false">
  <div class="chips" style="margin-top:8px">${['11HAD10CP501','10LAB20AA402','11MBY10CS901.XQ01','20LAC10AP001','11HAD80AA191','10QUA10CQ001'].map(c=>`<button class="chip" data-ex="${c}">${c}</button>`).join('')}</div>
  <div id="kksout"></div></div>`;
  const inp=document.getElementById('kksin'), out=document.getElementById('kksout');
  function decode(){
    const raw=inp.value.toUpperCase().replace(/[\s_.\-]/g,'');
    const m=raw.match(/^(\d)(\d)?([A-Z])([A-Z])([A-Z])(\d{2})([A-Z]{2})(\d{3})(?:([A-Z])([A-Z])(\d{2}))?$/);
    if(!m){ out.innerHTML=`<div class="fb wrong"><b>Can't read that code.</b>Expected something like 12 MBP 13 AA 001 (plant/unit digits, three system letters, two digits, two equipment letters, three digits), optionally followed by a signal code like XQ01.</div>`; return; }
    const [,p1,p2,a,b,c,sn,eq,en,s1,s2,sno]=m;
    const sys3=a+b+c, sys2=a+b, n=+en;
    const sysName = KKS_SYS[sys3] || (KKS_SYS[sys2] ? KKS_SYS[sys2]+' (subsystem '+sys3+' not in the course tables)' : 'not in the course tables: check the plant KKS key');
    const rows=[
     [p1+(p2||''),'Plant / unit', p2?`plant or unit digits. In the deck's table, ${p1}${p2} = generating unit ${p1}${p2==='0'?', common systems':', gas turbine '+p2}. The meaning is fixed per project: check Rumaila's key.`:'single plant/unit digit'],
     [a,'Main group',KKS_F1[a]||'unknown main group'],
     [sys3,'System',sysName],
     [sn,'System number','section '+sn+' of that system (e.g. which train, pump set or pressure level)'],
     [eq,'Equipment type',KKS_EQ[eq]||'not in the course tables'],
     [en,'Equipment number',(kksRange(eq,n)?kksRange(eq,n)+' ('+en+')':'item '+en)]
    ];
    if(s1){ rows.push([s1+s2+sno,'Signal',(KKS_SIG[s1+s2]||'signal type '+s1+s2)+'; '+(KKS_SIG1[s1]||'')+'; number '+sno]); }
    out.innerHTML = `<div class="kks" style="margin-top:14px">${rows.map((r,i)=>`<span class="seg" style="--c:var(${i<2?'--muted':i<4?'--accent':i<6?'--act':'--ok'})"><b>${r[0]}</b><small>${r[1]}</small></span>`).join('')}</div>` + table(['Part','Is','Meaning'],rows.map(r=>[`<span class="num">${r[0]}</span>`,r[1],r[2]]));
  }
  inp.addEventListener('input',decode);
  mainEl.querySelector('.chips').addEventListener('click',e=>{ const b=e.target.closest('[data-ex]'); if(!b) return; inp.value=b.dataset.ex; decode(); });
  decode();
}

function renderRef(){
  const groups = M.filter(m=>m.id!=='start').map(m=>({m, rows:GLOSS.filter(g=>g[2]===m.id)})).filter(g=>g.rows.length);
  mainEl.innerHTML = `<div class="eyebrow">Reference</div><h1>Glossary</h1>
  <p>Every term from the vocabulary drill, grouped by module. For the manual's translated English, see the table in Module 10.</p>
  ${groups.map(g=>`<h2>${g.m.n} · ${g.m.title}</h2>`+table(['Term','Meaning'],g.rows.map(r=>[`<b>${r[0]}</b>`,r[1]]))).join('')}`;
}

function renderIssues(){
  const items=[
   ['Medium','Compressor heating','The deck says compressor air heats up "by friction". It heats mainly because work is done compressing it; friction adds little. (Module 9)'],
   ['Medium','Gas turbine speed','The deck says first-stage blades turn "up to 3600 rpm". That is for 60 Hz machines. Rumaila\'s SGT5-4000F runs at 3000 rpm. (Module 9)'],
   ['Medium','KKS plant and unit digits','One slide says "12" means plant 1, block 2; the table on the same slide says 12 = generating unit 1, gas turbine 2. The meaning is project-specific: use Rumaila\'s KKS key. (Module 12)'],
   ['Medium','Steam visibility','The deck says saturated steam is "well visible". At the leak point all steam is clear gas; the visible fog forms after it condenses. Treat every steam leak as invisible near the source. (Module 2)'],
   ['Low','Bernoulli equation','Written without density and gravity terms, so the units don\'t add up. Correct form: p + ½ρc² + ρgh = constant. (Module 2)'],
   ['Low','Dosing system codes','Listed as "QCC, QCC" on one slide and QCC, QCD on the next. (Module 11)'],
   ['Low','Example numbers','Pressures and temperatures in the deck (125 bar/565 °C steam, 270 bar/600 °C, 1500 °C vs 1550 °C combustion, 350 t generator) come from other plants or are rounded. Use Rumaila\'s own data for anything operational.'],
   ['Low','Protective oxide','The chemistry slide names hematite and wüstite but its text doesn\'t name magnetite, the layer that actually protects boiler steel. (Module 11)']
  ];
  mainEl.innerHTML = `<div class="eyebrow">Reference</div><h1>Deck issues</h1>
  <p>Places where the Siemens Energy familiarization deck (2020) is wrong, unclear or inconsistent, and what the course teaches instead.</p>
  <ul class="issues">${items.map(([s,t,d])=>`<li><span class="pill ${s==='High'?'act':s==='Medium'?'alarm':'ok'}">${s}</span> <b>${t}.</b> ${d}</li>`).join('')}</ul>
  <h2>What the deck leaves out</h2>
  <ul>
   <li><b>Explanations.</b> About 60 slides are photos or cutaways with only a title. The course writes out what each was meant to teach.</li>
   <li><b>Anything about Rumaila.</b> The deck is generic; its photos are from German, Spanish, Turkish and other plants. Rumaila details come from the HRSG manual.</li>
   <li><b>Electrical auxiliaries and protection:</b> switchgear, motors, DC systems, generator protection. These need their own course.</li>
   <li><b>Operation.</b> The deck explains what equipment is, not how to operate it. That starts in the <a href="${HRSG_URL}" target="_blank" rel="noopener">HRSG course</a>.</li>
  </ul>`;
}

function render(){
  const id = currentId();
  renderRail();
  const idx = M.findIndex(m=>m.id===id);
  if(idx>=0) renderModule(M[idx], idx);
  else if(id==='kks') renderKKS();
  else if(id==='drill') renderDrill();
  else if(id==='final') renderFinal();
  else if(id==='ref') renderRef();
  else if(id==='issues') renderIssues();
  else renderModule(M[0],0);
  document.title = 'Rumaila Power Plant Technology';
}
render();

</script>
