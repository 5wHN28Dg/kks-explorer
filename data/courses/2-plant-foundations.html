 ['metal','thermal expansion and expansion indicators; hangers and supports; thermal stress in thick walls; drum top-bottom ΔT and bowing; fatigue; creep; alloy vs carbon steels (P91, T22, SA-106C); brittle behaviour when cold; thermal shock'],
 ['boiler','economizer, evaporator, superheater stages, reheater, condensate heater, fin tubes; drum and internals; downcomers, risers, headers; deaerator; continuous vs periodic blowdown; flash tanks; EDV; vents, drains, air valves; desuperheaters; casing, insulation, guard sheath; manholes; stack'],
 ['mech','gate, globe, check, butterfly, control, motor-operated, safety and relief valves; bypass valves; primary and secondary valves; packing and glands; gags; centrifugal pumps; cavitation and NPSH; minimum flow and recirculation; venting pumps; hydraulic coupling and scoop tube; sliding vs rolling bearings; oil cups; mechanical seals; vibration; listening rod; megger; rotation check; standby auto-start'],
 ['ic','4–20 mA; transmitters; orifice flow and its low-flow weakness; DP level with balance vessel and density correction; bi-colour, electric-contact, magnetic flap gauges; DCS, EWS, forcing and simulation; local/remote; auto/manual; feedback; PID; single- vs three-element ("impulse") control; alarm vs interlock vs trip vs permissive'],
 ['chem','demineralised water; concentration in drums; blowdown; pH, conductivity, oxygen, silica, sodium, iron, copper, hardness; hydrazine, phosphate, ammonia dosing; foaming and carry-over; sample coolers and analysers; why chemistry stops a startup; lay-up principles'],
 ['safe','work permits and their closure; isolation and test position; steam, hot water, stored pressure, gauge glass, confined space, noise and chemical hazards; shift leader, main operator, vice operator, walk inspector; repeat-back and report-back; logbook; handover during faults'],
 ['docs','P&ID symbols and instrument letters; general arrangement drawings; KKS codes; the manual\'s translated terms: door/gate, air door, furnace, pot, vaporizer, MP/medium-voltage, impulse, fixed value, rolling, combining steam, attemperating water, thimble/card, listening stick, sundries, walk inspector, starter, latch off, coasting, reignite, chromatic cycle']
];


/* ---------- rendering ---------- */
const railEl = document.getElementById('rail'), mainEl = document.getElementById('main'), mnav = document.getElementById('mnav');
const EXTRA = [{id:'place',title:'Placement test'},{id:'drill',title:'Vocabulary drill'},{id:'final',title:'Readiness check'},{id:'ref',title:'Glossary'},{id:'audit',title:'What the HRSG course assumes'}];
function modQs(m){ return (m.practice||[]).concat(m.bridge||[]); }
function modDone(m){ const q=modQs(m).length?modQs(m):(m.warm?[m.warm]:[]); return q.length>0 && q.every(x=>solved[x.id]); }
function renderRail(){
  const cur = currentId();
  const total = M.reduce((a,m)=>a+modQs(m).length,0), done = M.reduce((a,m)=>a+modQs(m).filter(x=>solved[x.id]).length,0);
  const skip = store.get('skip',{});
  let h = `<h4>Modules</h4>`;
  M.forEach(m=>{ h += `<button data-go="${m.id}" aria-current="${cur===m.id}"><span class="n">${m.n}</span><span>${m.short}${skip[m.id]?' <span class="stat">· can skip</span>':''}</span><span class="tick${modDone(m)?' done':''}" aria-label="${modDone(m)?'complete':'not complete'}"></span></button>`; });
  h += `<div class="progress" title="${done} of ${total} items solved"><i style="width:${total?Math.round(done/total*100):0}%"></i></div><div class="stat" style="margin:4px 8px 0">${done}/${total} practice and bridge solved</div>`;
  h += `<h4>Tests & reference</h4>`;
  EXTRA.forEach(e=>{ h += `<button data-go="${e.id}" aria-current="${cur===e.id}"><span class="n">·</span><span>${e.title}</span><span></span></button>`; });
  h += `<h4>Before this course</h4><a class="railink" href="${PT_URL}" target="_blank" rel="noopener">1 · Rumaila Power Plant Technology ↗</a><h4>Next course</h4><a class="railink" href="${HRSG_URL}" target="_blank" rel="noopener">Rumaila HRSG Course ↗</a>`;
  railEl.innerHTML = h;
  mnav.innerHTML = M.map(m=>`<option value="${m.id}"${cur===m.id?' selected':''}>${m.n} · ${m.title}${modDone(m)?' ✓':''}</option>`).join('') + EXTRA.map(e=>`<option value="${e.id}"${cur===e.id?' selected':''}>${e.title}</option>`).join('');
}
railEl.addEventListener('click', e=>{ const b=e.target.closest('[data-go]'); if(b) go(b.dataset.go); });
mnav.addEventListener('change', ()=>go(mnav.value));
function currentId(){ const h=(location.hash||'').replace('#',''); return h || store.get('last','start'); }
function go(id){ if(location.hash !== '#'+id){ history.replaceState(null,'','#'+id); } store.set('last',id); render(); window.scrollTo(0,0); }
window.addEventListener('hashchange', render);
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function actHTML(q, label){
  const src = q.src ? `<span class="src">${q.src}</span>` : '';
  if(q.type==='order'){
    return `<div class="act" data-qid="${q.id}"><div class="kind"><span>${label||'Put in order'}</span>${src}</div><div class="q">${q.q}</div><div class="seq"></div><div class="pool"></div><div class="row"><button class="btn" data-check>Check order</button><button class="btn ghost" data-reset>Start again</button></div><div class="fbwrap"></div></div>`;
  }
  const panel = q.type==='scn' ? `<div class="panel">${q.panel.map(([t,v,c])=>`<div class="tag-r"><span>${t}</span><span class="val ${c||''}">${v}</span></div>`).join('')}</div>` : '';
  return `<div class="act" data-qid="${q.id}"><div class="kind"><span>${label|| (q.type==='scn'?'Scenario':'Practice')}</span>${src}</div>${panel}<div class="q">${q.q}</div><div class="opts"></div><div class="fbwrap"></div></div>`;
}
function wire(root, q, opts={}){
  const el = root.querySelector(`[data-qid="${q.id}"]`); if(!el) return;
  const fbw = el.querySelector('.fbwrap');
  if(q.type==='order'){
    const seq = el.querySelector('.seq'), pool = el.querySelector('.pool');
    let chosen = [];
    const order = shuffle(q.steps.map((s,i)=>i));
    function draw(){
      seq.innerHTML = chosen.map((i,k)=>`<button class="step" data-i="${i}"><span class="i">${k+1}</span><span>${q.steps[i]}</span></button>`).join('');
      pool.innerHTML = order.filter(i=>!chosen.includes(i)).map(i=>`<button class="step" data-i="${i}"><span class="i">·</span><span>${q.steps[i]}</span></button>`).join('');
    }
    pool.addEventListener('click', e=>{ const b=e.target.closest('.step'); if(!b) return; chosen.push(+b.dataset.i); fbw.innerHTML=''; draw(); });
    seq.addEventListener('click', e=>{ const b=e.target.closest('.step'); if(!b) return; chosen = chosen.filter(i=>i!==+b.dataset.i); fbw.innerHTML=''; draw(); });
    el.querySelector('[data-reset]').addEventListener('click', ()=>{ chosen=[]; fbw.innerHTML=''; draw(); });
    el.querySelector('[data-check]').addEventListener('click', ()=>{
      if(chosen.length < q.steps.length){ fbw.innerHTML = `<div class="fb wrong"><b>Not finished.</b>Place all ${q.steps.length} steps first.</div>`; return; }
      const good = chosen.map((i,k)=>i===k);
      [...seq.children].forEach((b,k)=>b.classList.add(good[k]?'right':'wrong'));
      const n = good.filter(Boolean).length;
      if(n===q.steps.length){ fbw.innerHTML = `<div class="fb right"><b>All in the right order.</b></div>`; markSolved(q.id); }
      else { fbw.innerHTML = `<div class="fb wrong"><b>${n} of ${q.steps.length} in the right place.</b>Red steps are out of position. Tap a step to take it back, or start again.</div>`; }
    });
    draw(); return;
  }
  const box = el.querySelector('.opts');
  const idx = shuffle(q.o.map((o,i)=>i));
  box.innerHTML = idx.map(i=>`<button class="opt" data-i="${i}">${q.o[i][0]}</button>`).join('');
  let first = true;
  box.addEventListener('click', e=>{
    const b = e.target.closest('.opt'); if(!b) return;
    if(opts.lockAfterFirst && !first) return;
    const [t,ok,fb] = q.o[+b.dataset.i];
    box.querySelectorAll('.opt').forEach(x=>x.classList.remove('wrong'));
    b.classList.add(ok?'right':'wrong');
    fbw.innerHTML = `<div class="fb ${ok?'right':'wrong'}"><b>${ok?'Right.':'Not quite.'}</b>${fb||''}</div>`;
    if(opts.lockAfterFirst){
      if(!ok){ const ri = q.o.findIndex(o=>o[1]); box.querySelector(`[data-i="${ri}"]`).classList.add('right'); fbw.innerHTML += `<div class="fb right"><b>Correct answer:</b>${q.o[ri][0]} ${q.o[ri][2]||''}</div>`; }
      box.querySelectorAll('.opt').forEach(x=>x.style.cursor='default');
    }
    if(first){ opts.onAnswer && opts.onAnswer(ok); first=false; }
    if(ok) markSolved(q.id);
  });
}
function workedHTML(w){ return `<div class="worked" id="worked"><div class="kind">Worked example</div><div class="case">${w.case}</div><div class="wsteps"></div><div class="row"><button class="btn ghost" data-next>Predict the next step, then reveal it</button></div></div>`; }
function wireWorked(root, w){
  const el = root.querySelector('#worked'); if(!el) return;
  const box = el.querySelector('.wsteps'), btn = el.querySelector('[data-next]'); let k=0;
  btn.addEventListener('click', ()=>{
    if(k<w.steps.length){ const [l,t]=w.steps[k]; box.insertAdjacentHTML('beforeend', `<div class="wstep"><span class="lbl">Step ${k+1} · ${l}</span>${t}</div>`); k++; }
    if(k>=w.steps.length){ btn.textContent='All steps shown'; btn.disabled=true; }
  });
}
function recallPool(upto){ const pool=[]; for(const m of M){ if(m.id===upto) break; (m.practice||[]).forEach(q=>{ if(q.type!=='order') pool.push(q); }); } return pool; }

function renderModule(m, idx){
  const recallQs = shuffle(recallPool(m.id)).slice(0,2).map(q=>Object.assign({},q,{id:q.id+'_r'}));
  let h = `<div class="eyebrow">Module ${m.n}</div><h1>${m.title}</h1>`;
  h += `<div class="goal"><b>After this module you can</b><ul>${m.goal.map(g=>`<li>${g}</li>`).join('')}</ul></div>`;
  if(recallQs.length){ h += `<h2>From earlier modules</h2><p>Two questions from what you have already covered. Answer from memory.</p>` + recallQs.map(q=>actHTML(q,'Recall')).join(''); }
  if(m.warm){ h += `<h2>Guess first</h2>` + actHTML(m.warm,'Before the lesson'); }
  h += `<h2>${m.id==='start'?'About this course':'The lesson'}</h2>` + m.body();
  if(m.worked){ h += `<h2>Worked example</h2>` + workedHTML(m.worked); }
  if(m.practice && m.practice.length){ h += `<h2>Practice</h2><p>Every wrong answer tells you why. Retry until each is right.</p>` + m.practice.map(q=>actHTML(q)).join(''); }
  if(m.bridge && m.bridge.length){ h += `<h2>Bridge to the HRSG course</h2><p>These come straight from the HRSG course and manual. If you can answer them, you are ready for the parts of that course that rely on this module.</p>` + m.bridge.map(q=>actHTML(q,'Bridge')).join(''); }
  const nxt = M[idx+1], prv = M[idx-1];
  h += `<div class="foot">${prv?`<button class="btn ghost" data-go="${prv.id}">← ${prv.short}</button>`:'<span></span>'}${nxt?`<button class="btn" data-go="${nxt.id}">${nxt.short} →</button>`:`<button class="btn" data-go="final">Readiness check →</button>`}</div>`;
  mainEl.innerHTML = h;
  recallQs.forEach(q=>wire(mainEl,q));
  if(m.warm) wire(mainEl, m.warm);
  if(m.worked) wireWorked(mainEl, m.worked);
  modQs(m).forEach(q=>wire(mainEl,q));
}
mainEl.addEventListener('click', e=>{ const b=e.target.closest('.foot [data-go], .gochip[data-go]'); if(b) go(b.dataset.go); });

function modName(id){ const m=M.find(x=>x.id===id); return m ? `${m.n} · ${m.short}` : id; }

function renderPlacement(){
  const items = PLACE.map(([m,q])=>({m,q:Object.assign({},q,{id:q.id+'_p'})}));
  const res = {}; let answered=0;
  mainEl.innerHTML = `<div class="eyebrow">Test</div><h1>Placement test</h1>
  <p>Twenty quick questions, two per module, in module order. One attempt each. Where you get both of a module's questions right, you can skip that module. Guessing defeats the purpose, so if you don't know, pick the answer you think is least wrong and let the test send you to the module.</p>
  ${items.map((it,i)=>actHTML(it.q,`Q${i+1} · ${modName(it.m)}`)).join('')}
  <div class="act"><div class="kind"><span>Your plan</span></div><div id="pres" class="stat">Answer all twenty to see which modules to take.</div></div>`;
  items.forEach(it=>wire(mainEl,it.q,{lockAfterFirst:true,onAnswer:ok=>{
    res[it.m]=res[it.m]||{n:0,ok:0}; res[it.m].n++; if(ok) res[it.m].ok++; answered++;
    if(answered===items.length){
      const take=[], skipM={};
      M.filter(m=>m.id!=='start').forEach(m=>{ const r=res[m.id]; if(r && r.ok===r.n) skipM[m.id]=true; else take.push(m); });
      if(!skipM.docs && !take.find(m=>m.id==='docs')) take.push(M.find(m=>m.id==='docs'));
      store.set('skip',skipM); renderRail();
      document.getElementById('pres').innerHTML = `<p style="color:var(--ink)"><b>Take:</b> ${take.length?take.map(m=>`<button class="chip gochip" data-go="${m.id}">${m.n} · ${m.short}</button>`).join(' '):'none, go straight to the readiness check.'}</p><p style="color:var(--ink)"><b>Can skip:</b> ${Object.keys(skipM).length?Object.keys(skipM).map(modName).join(', '):'none'}. Module 10 is worth reading anyway for the manual\'s translated English.</p>`;
    }
  }}));
}

function renderDrill(){
  mainEl.innerHTML = `<div class="eyebrow">Practice</div><h1>Vocabulary drill</h1>
  <p>A term appears; pick what it does. Sixty terms from every module, drawn at random. Five minutes a day until you get them all without thinking.</p>
  <div class="act"><div class="kind"><span>What does it do?</span><span class="stat" id="vstat"></span></div>
  <div class="drill-card"><div class="p" id="vmod"></div><div class="reading" id="vterm" style="font-family:var(--display);font-size:32px"></div></div>
  <div class="opts" id="vopts"></div><div class="fbwrap" id="vfb"></div>
  <div class="row"><button class="btn" id="vnext">Next term</button></div></div>`;
  let st={n:0,ok:0,streak:0}, cur=null, done=false;
  function pick(){
    cur = GLOSS[Math.floor(Math.random()*GLOSS.length)]; done=false;
    const others = shuffle(GLOSS.filter(g=>g!==cur)).slice(0,3);
    const opts = shuffle([cur,...others]);
    document.getElementById('vmod').textContent = 'Module ' + modName(cur[2]);
    document.getElementById('vterm').textContent = cur[0];
    document.getElementById('vopts').innerHTML = opts.map(o=>`<button class="opt" data-t="${o[0]}">${o[1]}</button>`).join('');
    document.getElementById('vfb').innerHTML='';
  }
  document.getElementById('vopts').addEventListener('click', e=>{
    const b=e.target.closest('.opt'); if(!b||done) return; done=true;
    const ok = b.dataset.t===cur[0]; st.n++; if(ok){st.ok++;st.streak++;} else st.streak=0;
    b.classList.add(ok?'right':'wrong'); if(!ok) document.querySelector(`#vopts [data-t="${cur[0]}"]`).classList.add('right');
    document.getElementById('vfb').innerHTML = ok ? `<div class="fb right"><b>Right.</b></div>` : `<div class="fb wrong"><b>Not quite.</b>You picked the description of <b>${b.dataset.t}</b>.</div>`;
    document.getElementById('vstat').textContent = `${st.ok}/${st.n} right · streak ${st.streak}`;
  });
  document.getElementById('vnext').addEventListener('click', pick);
  pick();
}

function renderFinal(){
  const items = shuffle(M.flatMap(m=>(m.bridge||[]).map(q=>({m:m.id,q:Object.assign({},q,{id:q.id+'_f'})}))));
  let score=0, answered=0; const missed=[];
  mainEl.innerHTML = `<div class="eyebrow">Test</div><h1>Readiness check</h1>
  <p>All twenty bridge questions, shuffled, one attempt each. They are written in the HRSG course's language. Score 17 or more and you are ready to start the <a href="${HRSG_URL}" target="_blank" rel="noopener">HRSG course</a>.</p>
  ${items.map((it,i)=>actHTML(it.q,`Question ${i+1} of ${items.length}`)).join('')}
  <div class="act"><div class="kind"><span>Result</span></div><div class="score" id="fscore">0 / ${items.length} answered</div><div id="fmiss" class="stat" style="margin-top:6px"></div></div>`;
  items.forEach(it=>wire(mainEl,it.q,{lockAfterFirst:true,onAnswer:ok=>{
    answered++; if(ok) score++; else missed.push(it.m);
    document.getElementById('fscore').textContent = `${score} / ${answered} right${answered===items.length?' · finished':''}`;
    if(answered===items.length){
      const mods=[...new Set(missed)];
      document.getElementById('fmiss').innerHTML = (score>=17?`<p style="color:var(--ok)"><b>Ready.</b> Go on to the <a href="${HRSG_URL}" target="_blank" rel="noopener">HRSG course</a>.</p>`:`<p style="color:var(--act)"><b>Not yet.</b> Revisit the modules below, then try again.</p>`) + (mods.length?'Revisit: '+mods.map(id=>`<button class="chip gochip" data-go="${id}">${modName(id)}</button>`).join(' '):'');
    }
  }}));
}

function renderRef(){
  const groups = M.filter(m=>m.id!=='start').map(m=>({m, rows:GLOSS.filter(g=>g[2]===m.id)})).filter(g=>g.rows.length);
  mainEl.innerHTML = `<div class="eyebrow">Reference</div><h1>Glossary</h1>
  <p>Every term from the vocabulary drill, grouped by module. For the manual's translated English, see the table in Module 10.</p>
  ${groups.map(g=>`<h2>${g.m.n} · ${g.m.title}</h2>`+table(['Term','Meaning'],g.rows.map(r=>[`<b>${r[0]}</b>`,r[1]]))).join('')}`;
}

function renderAudit(){
  mainEl.innerHTML = `<div class="eyebrow">For trainers</div><h1>What the HRSG course assumes</h1>
  <p>This is the checklist this course was built from. I went through the HRSG course and the manual line by line and listed every term and idea they use without explaining. Each item is taught in the module shown. If a trainee is stuck on something in the HRSG course that is not on this list, it belongs here too.</p>
  ${table(['Module','Assumed knowledge taught there'],AUDIT.map(([id,t])=>[`<button class="chip gochip" data-go="${id}">${modName(id)}</button>`,t]))}
  <h2>Deliberately left out</h2>
  <p>Thermodynamic cycle calculations, detailed turbine and generator theory, electrical protection, and gas turbine operation. The HRSG course doesn't need them. They belong in the prerequisites for a gas turbine or steam turbine course, which could reuse Modules 1–4 and 6–10 of this one unchanged.</p>`;
}

function render(){
  const id = currentId();
  renderRail();
  const idx = M.findIndex(m=>m.id===id);
  if(idx>=0) renderModule(M[idx], idx);
  else if(id==='place') renderPlacement();
  else if(id==='drill') renderDrill();
  else if(id==='final') renderFinal();
  else if(id==='ref') renderRef();
  else if(id==='audit') renderAudit();
  else renderModule(M[0],0);
  document.title = 'Rumaila Plant Foundations';
}
render();

</script>
