M.push({id:'normal', n:'8', title:'Normal operation', short:'Normal operation',
goal:['Explain three-impulse level control and when to leave it.','Control steam temperature and know what upsets it.','Run blowdown and the routine checks on schedule.'],
body:()=>`
<h3>What operation is for</h3>
<p>Stable HRSG conditions and efficiency; rated evaporation to meet load; normal steam temperature and pressure; even feeding and a normal level; steam quality within specification (§4.2.1).</p>
<h3>Drum level control</h3>
<p>The LP drum level is held by its own control valve. HP and IP feed use <b>three-impulse</b> control: drum level, steam flow and feedwater flow. If three-impulse becomes unstable during load swings, extraction changes or blowdown, drop to single-impulse (level only) or manual.</p>
${whyGen('When load rises, drum pressure dips, water flashes and the level briefly swells up even though water is actually being used faster. A level-only controller would cut feed at exactly the wrong moment. Three-impulse control feeds to match steam flow and uses level only as a trim, so it rides through swell and shrink.')}
<p>Things that make the level move: fast load changes, blowdown, startup and shutdown, emergency shutdown, a safety valve or exhaust valve opening or closing, feed system faults, and heating-surface leaks. When correcting manually, change feed in small steps.</p>
<p>If the level rises fast in manual mode, close the feed electric valve and look for the cause. If a gauge seems stuck, flush it.</p>
<h3>Steam temperature</h3>
<p>Controlled by the desuperheating spray valve. If automatic control can't keep up, go manual at once and report to the shift leader. Temperature is upset by GT load and exhaust temperature changes, big feedwater pressure changes, and large load and level changes.</p>
<h3>Blowdown</h3>
<p>Blowdown keeps heating surfaces clean and stops foaming and poor steam quality. Chemistry decides the continuous blowdown rate. While blowing down, watch feed flow and drum level.</p>
<p>Putting continuous blowdown in service: gauges, level and controls of the flash tank in service; warm the line about 2 minutes with the drain open; close the drain and raise pressure slowly; when flash tank pressure equals LP drum pressure, open its steam outlet; when it has a level, open the drain isolation fully and put level control on auto; close the crossover to periodic blowdown; check the whole system once. After an overhaul or a repair to its safety valve, the flash tank safety valve must be calibrated first.</p>
<h3>Walkdown</h3>
<p>Every round: local level, pressure and temperature against DCS; valve positions and leaks; hangers, insulation, pipe vibration; safety valves and exhaust valves for passing; continuous blowdown and emergency discharge for passing (close by hand if badly passing); drum and header expansion; manholes, test points and plugs on the gas duct; periodic blowdown tank valves; running pumps (current, pressures, bearing temperatures, seals, vibration, cooling water); standby pump in hot standby.</p>
<h3>Routine tasks</h3>
${table(['Task','When','Who'],[
 ['Safety valve trial lift','before shutting down for a major or minor overhaul','main operator, shift leader in charge'],
 ['HRSG interlock test','after a major or minor overhaul','main operator'],
 ['Emergency acoustic (horn) test','every shift','main operator'],
 ['Level meter calibration against local','every shift','vice operator'],
 ['Local drum gauge flushing','every Monday, day shift','vice operator and walk-round inspector'],
 ['Compressed air tank drain','every Monday, day shift','vice operator'],
 ['Air compressor changeover','last day shift of the month','vice operator'],
 ['Air dryer changeover','last day shift of the month','vice operator']
])}
${flag('§4.2.2 says to calibrate the electric-contact level meter against local "two times" every shift; the table in §4.3 says once per shift.')}`,
warm: Q('m8w','Guess: load jumps from 70% to 90%. For about a minute the HP drum level rises even though the unit is now using more water. Why?',[
 ['The feed valve opened too far.',false,'That would be a real rise from extra feed. This one happens with no extra feed.'],
 ['Swell: the pressure dip makes water flash to steam, and the bubbles push the level up briefly.',true,'Right. That is why feed is controlled on steam flow as well as level.'],
 ['A tube leak.',false,'A leak drops the level.']
],'§4.2.2'),
worked:{case:'Chemistry asks you to increase HP continuous blowdown. Three-impulse is on auto. What do you watch, and when would you take manual control?',steps:[
 ['Effect of blowdown','More water leaves the drum without passing the steam flowmeter. Feed will now exceed steam flow by the blowdown amount.'],
 ['Why that matters for control','Three-impulse compares feed and steam flow. A steady blowdown offset can unsettle it.'],
 ['Watch','Drum level, feed flow and the difference between feed and steam flow as you open the blowdown in small steps.'],
 ['Decide','If the level hunts or the controller becomes unstable, switch to single-impulse or manual (§4.2.2), finish the change, then return to three-impulse.']
]},
practice:[
 Q('m8a','Which three signals does three-impulse control use?',[
  ['Drum level, drum pressure, steam temperature.',false,'Pressure and temperature are not the three impulses.'],
  ['Drum level, steam flow, feedwater flow.',true,'Correct.'],
  ['Feedwater flow, feed pressure, pump speed.',false,'These are feed-side measurements only.']
 ],'§4.2.2'),
 Q('m8b','Automatic steam temperature control is lagging behind a fast GT load change. What does the manual require?',[
  ['Wait for auto to catch up.',false,'The manual says switch immediately.'],
  ['Switch to manual at once and report to the shift leader for maintenance to check it.',true,'Right.'],
  ['Reduce GT load.',false,'Not the first step for a lagging controller.']
 ],'§4.2.2'),
 Q('m8c','When is the local drum gauge flushing routine done?',[
  ['Every shift.',false,'Every shift is the level meter calibration and the horn test.'],
  ['Every Monday on day shift.',true,'Correct: vice operator with the walk-round inspector.'],
  ['At month end.',false,'Month end is air compressor and dryer changeover.']
 ],'§4.3'),
 Q('m8d','You find the HP continuous blowdown electric valve passing badly during a walkdown. What do you do?',[
  ['Log it for the next outage.',false,'The manual says to act if it is serious.'],
  ['Close the manual valve by hand.',true,'Yes (§4.1.1 item 5) and report it.'],
  ['Increase feed to compensate.',false,'That hides the loss rather than stopping it.']
 ],'§4.1.1')
]});

M.push({id:'shutdown', n:'9', title:'Shutdown and preservation', short:'Shutdown',
goal:['Run a normal shutdown in order.','Cool and drain within the limits.','Choose and run the right preservation method for the length of the outage.'],
body:()=>`
<h3>Principles</h3>
<p>Shut down only on the shift leader's order. Don't open the steam exhaust valves. The turbine bypass may be used only if the vacuum pump is running and condenser vacuum is above ${N('80 kPa')}. A planned shutdown means reducing GT load until the steam turbine trips.</p>
${flag('§5.1 says "the steam turbine must be synchronized before the gas turbine". In context this probably means the steam turbine comes off first. Confirm with the plant.')}
<h3>Before</h3>
<p>Check everything runs normally; get tools ready; know the purpose and method; record all defects and abnormal trends so maintenance can act; put HP/IP three-impulse and steam temperature controls on auto. If the GT will be washed afterwards, keep the LP drum level high and water above ${N('100 °C')}.</p>
<h3>Sequence</h3>
<ol>
<li>Open HP, IP and LP turbine bypass valves.</li>
<li>Close HP, IP and LP main steam valves.</li>
<li>Stop the gas turbine or close the bypass damper.</li>
<li>Watch drum pressures and temperatures; keep the cooling rate within limits.</li>
<li>Close the HRSG outlet gas damper.</li>
<li>Set drum levels to shutdown level; after 30 minutes, bring all three to NWL+100.</li>
<li>Open the feed control valves to prevent economizer overpressure.</li>
<li>Close the IP superheater outlet shut-off; open the reheat drain.</li>
<li>Stop the HP and IP feed pumps, then the recirculation pump.</li>
<li>Close the superheater outlet shut-offs; open the superheater drains.</li>
</ol>
${whyGen('Step 7: with feed stopped and the economizer valves shut, the trapped water in the economizer keeps absorbing heat from the warm casing. Water hardly compresses, so pressure climbs quickly. Leaving the feed control valves open gives it a way out to the drum.')}
<h3>Hot standby</h3>
<p>Close all steam, feed, blowdown and discharge valves tightly and keep a high drum level. Keep checking running instruments and rotating equipment, watch gas duct temperatures, look for leaks, and keep drum top-bottom difference within ${N('0–40 °C')}.</p>
<h3>Cooling and draining</h3>
<ul>
<li>For the first ${N('2 h')}, keep steam and water valves tightly closed.</li>
<li>After 2 h, open the steam vent partly to release pressure, keeping drum difference under ${N('40 °C')}.</li>
<li>Drain when drum pressure is ${N('0 MPa')} and water is below ${N('80 °C')}, opening drains and air vents everywhere.</li>
<li>If you must drain under pressure: at ${N('0.3–0.5 MPa')}, with controlled rate.</li>
</ul>
<h3>Preservation</h3>
${table(['Outage','Method','Key numbers'],[
 ['15–30 days','Residual heat drying','depressurise < 0.3 MPa/min, drum ΔT < 40 °C; drain at 0.3–0.5 MPa and 80 °C; open vents; check dryness with a glass plate, then close'],
 ['15–30 days','Ammonia solution (wet)','ammonia 500–600 mg/L (condensate or demin water) or 800–1000 mg/L (softened water); salt < 150 mg/L; chloride < 45 mg/L; keep full; keep ammonia out of the turbine'],
 ['over 30 days','Nitrogen blanket','drain fully, clean, seal; N₂ in through the drum at 0.02–0.05 MPa, purity > 98%'],
 ['over 30 days','Desiccant (dry)','drain, clean; open trays in drums and headers; CaCl₂ 1–2 kg/m³ or quicklime 2–3 kg/m³; check several times a month, replace spent desiccant']
],[])}
${whyGen('All four methods stop the same thing: oxygen plus water on bare steel. Drying removes the water, ammonia raises pH so steel does not corrode, nitrogen at slight positive pressure keeps air out, and desiccant keeps the air inside dry.')}`,
warm: Q('m9w','Guess: why open the feed control valves after the feed pumps are about to stop at shutdown?',[
 ['To keep drum level up.',false,'The pumps are stopping, so no water is added this way.'],
 ['To stop trapped water in the economizer from overpressurising as it keeps absorbing heat.',true,'Right; §5.2.2 item 8 says it is to prevent economizer overpressure.'],
 ['To cool the economizer faster.',false,'Cooling is not the purpose.']
],'§5.2.2'),
worked:{case:'Planned 3-week outage for GT work. Which preservation, and what are the numbers?',steps:[
 ['Length','Three weeks = 21 days, in the 15–30 day short-term range.'],
 ['Choose','Residual heat drying suits an outage where nobody needs the HRSG full of water. The ammonia wet method suits a quick return to service.'],
 ['Residual heat drying numbers','Close air valves and dampers to keep heat in. Depressurise through superheater drains at < 0.3 MPa/min with drum ΔT < 40 °C. At 0.3–0.5 MPa and 80 °C, drain everything. Open vents; when a glass plate held at a vent stays clear, close them.'],
 ['If it extends past 30 days','Move to nitrogen (0.02–0.05 MPa, > 98%) or desiccant.']
]},
practice:[
 Q('m9a','Condenser vacuum is 72 kPa. Can you use the turbine bypass for the shutdown?',[
  ['Yes.',false,'Bypass needs the vacuum pump running and vacuum above 80 kPa.'],
  ['No.',true,'Correct.'],
  ['Yes, at reduced flow.',false,'The condition is absolute.']
 ],'§5.1'),
 Q('m9b','Two hours after shutdown, drum pressure is 0 MPa and water is 92 °C. Can you drain?',[
  ['Yes, pressure is zero.',false,'Both conditions: 0 MPa and water below 80 °C.'],
  ['No, wait until the water is below 80 °C.',true,'Right.'],
  ['Yes, if drum ΔT is below 40 °C.',false,'ΔT is not the condition for draining here.']
 ],'§5.2.4'),
 Q('m9c','Outage of 6 weeks. Which preservation methods are right?',[
  ['Residual heat drying.',false,'That is for 15–30 days.'],
  ['Nitrogen at 0.02–0.05 MPa and > 98% purity, or desiccant.',true,'Correct: long-term methods for over 30 days.'],
  ['Ammonia wet method.',false,'Listed under short-term (15–30 days).']
 ],'§6.2'),
 Q('m9d','Using quicklime for dry preservation of the HP drum (45 m³). How much?',[
  ['45–90 kg.',false,'That\'s the calcium chloride range (1–2 kg/m³).'],
  ['90–135 kg.',true,'Quicklime is 2–3 kg/m³: 2 × 45 = 90, 3 × 45 = 135.'],
  ['4.5–9 kg.',false,'Off by a factor of ten.']
 ],'§6.2.2'),
 O('m9e','Order the first steps of a normal shutdown.',[
  'Open HP, IP, LP turbine bypass valves',
  'Close HP, IP, LP main steam valves',
  'Stop the gas turbine or close the bypass damper',
  'Close the HRSG outlet gas damper',
  'Set drum levels; after 30 min bring them to NWL+100',
  'Stop HP and IP feed pumps, then the recirculation pump'
 ],'§5.2.2')
]});

M.push({id:'faults', n:'10', title:'HRSG faults: diagnose from the readings', short:'HRSG faults',
goal:['Recognise each HRSG fault from its pattern of readings.','Tell the look-alike pairs apart.','Choose between carrying on, a controlled shutdown and an emergency shutdown.'],
body:()=>`
<h3>Principles</h3>
<p>Protect people and equipment first. Find the cause, isolate the fault, and keep healthy equipment running. For a fault not in the manual, act to limit it and report; <b>no hasty, blind operation</b> that widens the problem. Anyone not needed leaves the area. Record parameters during the event and write it up afterwards (§7.1).</p>
<h3>Three levels of response</h3>
${table(['Response','When (examples)'],[
 ['<b>Emergency shutdown</b> (§7.2): cut the gas now','serious water shortage or full water; all level gauges or safety valves disabled; a pipe rupture endangering people or plant; all condensate circulating pumps lost; protection fails to act when trip conditions are met (e.g. overpressure); turbine trip endangering safety'],
 ['<b>Fault shutdown</b> (§7.3): reduce turbine load first, then shut down normally','a leak you can still keep the level up against; water or steam quality that can\'t be recovered; all level transmitters damaged so only local gauges work; serious leaks on main steam or feed lines; superheater safety valve won\'t reseat or leaks badly'],
 ['<b>Carry on with close monitoring</b>','a small leak where level holds; record the trend and be ready to escalate']
])}
<p><b>Emergency shutdown actions (§7.2.2):</b> tell the GT and HRSG staff; press the emergency button, close the HRSG gas damper; close HP, IP and LP main steam and control valves and open the turbine bypasses; take controls off auto and watch temperature, pressure and level; reset the emergency switch; stop temperatures from dropping too fast; keep the level from running dry or overfilling as load collapses; watch pressure so safety valves don't lift; drain once water is at 80 °C.</p>
${flag('The emergency shutdown list in §5.3.1 includes "feed water quality deteriorates", while §7.3 puts unrecoverable water quality under the controlled fault shutdown. The lists in §5.3.1 and §7.2.1 also differ in other items. Ask which list the plant uses.')}
<h3>The fault signatures</h3>
<p>Most HRSG faults are recognised from six readings: drum level, feedwater flow vs steam flow, drum pressure, superheated steam temperature, gas temperature after the evaporator, and what you see and hear at the casing.</p>
${table(['Fault','Level','Feed vs steam','Other signs'],[
 ['Full water','↑ high alarm','feed > steam','SH steam temp drops suddenly; water hammer in steam lines'],
 ['Water shortage','↓ low alarm','feed < steam','serious: gas temp after evaporator ↑, SH steam flow drops, SH temp ↑'],
 ['Economizer / evaporator tube leak','↓','feed > steam, rising','circulating flow ↑ (pump current ↑); gas temp after evaporator ↓; white plume in stack gas; hissing; water dripping from duct bottom; drum pressure may fall'],
 ['Superheater tube leak','','steam < feed','drum pressure ↓ if serious; SH temp ↑; noise near superheater'],
 ['Foaming','wild swings, may be unreadable','','main steam temp drops suddenly; steam salt content ↑; water hammer if serious'],
 ['Level gauge fault','reads high, low or frozen','balanced','gauges disagree; pressures steady'],
 ['Safety valve won\'t reseat','↓','','pressure below reseat value yet valve still blowing']
])}
<p class="src">§7.4.1–7.4.9</p>
<h3>Look-alike pairs</h3>
<ul>
<li><b>Water shortage vs tube leak:</b> both drop the level. In a shortage, feed is <i>less</i> than steam (not enough is going in). In a leak, feed is <i>more</i> than steam (plenty goes in but some never becomes steam).</li>
<li><b>Full water vs foaming:</b> both can cause a sudden drop in steam temperature and water hammer. Full water has a <i>high</i> level with feed exceeding steam. Foaming has a <i>wildly swinging</i> level and rising salt content in steam.</li>
</ul>
<h3>What to do, fault by fault</h3>
<p><b>Full water:</b> confirm pressures and compare with local gauges; confirm emergency discharge and continuous blowdown opened (or open them); feed control to manual; if the valve doesn't respond, close the manual valve before it locally and feed via the bypass; call maintenance; watch SH outlet temperature and listen for water hammer; prepare to shut down if temperature keeps falling.</p>
<p><b>Water shortage:</b> increase feed and reduce load; close any open blowdown; if the level reaches the limit or you can't feed, shut down immediately. <b>After a serious shortage, do not feed water</b> until the heating surfaces have cooled completely and been inspected, or are confirmed undamaged and cooled to feedwater temperature.</p>
${whyGen('Cold feedwater on dry, overheated tubes causes thermal shock and can split them.')}
<p><b>Foaming:</b> tell the shift leader; close down the gas damper to cut load; open continuous blowdown fully; open main steam drains and ask the turbine side to open theirs; have chemistry sample; raise load once water quality improves; record everything. Causes: poor boiler water quality, continuous blowdown too small.</p>
<p><b>Water hammer:</b> signs are a sudden main steam temperature drop, white steam at valve stems, flanges and glands, rising vibration, thrust bearing and return oil temperature up, axial shift up, knocking, load down, and a growing top-bottom casing temperature difference. Once confirmed: break vacuum, trip the turbine, close drains in the casing and main steam line, record coast-down time and vacuum; restart only if coast-down, thrust bearing and axial position are normal and drainage is complete. Prevent it with thorough drainage and warm-up, careful spray control, and good level control.</p>
<p><b>Economizer or evaporator tube leak:</b> if small and the level holds with careful feeding, carry on under close watch and record the trend. If the level can't be held, shut down.</p>
<p><b>Superheater leak:</b> serious and endangering equipment, shut down at once before escaping steam cuts neighbouring tubes. Minor: run short-term, watch its development, and shut down once permission is given.</p>
<p><b>Steam or feed pipe damage:</b> slight leak, run short-term. Getting worse or endangering people, or a rupture: shut down at once.</p>
<p><b>Safety valve won't lift</b> at its setting after a load drop: emergency shutdown, open the atmospheric relief. <b>Won't reseat:</b> reduce load and close down the gas damper to lower pressure until it seats; keep level and steam temperature steady; ask for permission to shut down; if pressure and temperature keep falling, emergency shutdown.</p>`,
warm: S('m10w',[['HP drum level','−310 mm ↓','alarm'],['Feedwater flow','296 t/h ↑',''],['HP steam flow','270 t/h',''],['Gas temp after HP evap.','↓ 9 °C',''],['Circ. pump current','↑','']],'Guess: what is happening?',[
 ['Water shortage from low feed.',false,'In a shortage, feed is less than steam. Here feed is 26 t/h more than steam.'],
 ['A tube leak in the economizer or evaporator.',true,'Yes. Feed goes in, less comes out as steam, the level falls, and the leaking water cools the gas.'],
 ['Level gauge fault.',false,'The flows are unbalanced and the gas temperature changed, so this is a real process event.']
],'§7.4.6'),
worked:{case:'Readings over 15 minutes at steady GT load: HP drum level swinging ±180 mm and hard to read on the local gauge; HP main steam temperature fell from 560 to 541 °C; sodium in steam rising on the analyser; feed and steam flows roughly equal.',steps:[
 ['What the level is doing','Swinging, not rising steadily. That is not the signature of full water.'],
 ['Flows','Feed and steam roughly equal, so no leak and no feed-control fault.'],
 ['Temperature and chemistry','Falling steam temperature plus rising salt in steam means water is being carried over with the steam.'],
 ['Diagnosis','Foaming (§7.4.3): poor boiler water or continuous blowdown too small.'],
 ['Action','Tell the shift leader; close down the gas damper to cut load; open continuous blowdown fully; open main steam drains and ask the turbine side to drain; chemistry samples; bring load back as water improves; record it.']
]},
practice:[
 S('m10a',[['HP drum level','+470 mm ↑','alarm'],['Feedwater flow','305 t/h',''],['HP steam flow','276 t/h',''],['HP SH outlet temp','548 °C ↓ fast','alarm'],['Main steam line','knocking','']],'Diagnosis?',[
  ['Foaming.',false,'Foaming shows a swinging level. Here the level is steadily high with feed well above steam.'],
  ['Full water.',true,'High level, feed > steam, sudden SH temperature drop and water hammer: full water (§7.4.1).'],
  ['Superheater leak.',false,'A superheater leak raises SH temperature and doesn\'t push the level up.']
 ],'§7.4.1'),
 S('m10b',[['HP drum level','−470 mm ↓','alarm'],['Feedwater flow','221 t/h ↓',''],['HP steam flow','274 t/h',''],['HP FWP A','tripped','act'],['HP FWP B','not running','act']],'Diagnosis and first action?',[
  ['Tube leak; shut down.',false,'In a leak, feed exceeds steam. Here feed is well below steam.'],
  ['Water shortage from a feed pump trip with no standby auto-start; start pump B by hand, raise feed, cut load, close any blowdown.',true,'Right. §7.4.2 reason: pump trip with standby not interlocked. §8.1: start the standby manually. If the level reaches the limit, shut down.'],
  ['Instrument fault; flush the gauge.',false,'The flows prove water is really short.']
 ],'§7.4.2, §8.1'),
 S('m10c',[['HP steam flow','252 t/h ↓',''],['Feedwater flow','279 t/h',''],['HP drum pressure','11.6 MPa ↓','alarm'],['HP SH outlet temp','571 °C ↑','alarm'],['Local','loud hiss near SH bundle','']],'Diagnosis?',[
  ['Superheater tube rupture.',true,'Steam flow below feed, pressure falling, SH temperature up, noise at the superheater (§7.4.7). This is serious: shut down.'],
  ['Economizer leak.',false,'An economizer leak drops the drum level and cools the gas. The noise is at the superheater and SH temperature is up.'],
  ['Safety valve not reseating.',false,'A passing safety valve would be at a valve, not inside the bundle, and there was no overpressure event.']
 ],'§7.4.7'),
 S('m10d',[['HP drum level (DCS)','−50 mm, flat for 45 min',''],['Load','60% → 85%',''],['Feed vs steam','equal, both rising',''],['Local gauge A','−20 mm',''],['Local gauge B','−130 mm','alarm']],'What is the problem?',[
  ['Water shortage.',false,'Feed equals steam; the drum is not losing water.'],
  ['Level measurement fault: a frozen DCS signal and two local gauges that disagree.',true,'Right (§7.4.5). Flush the gauges, check the transmitter, keep load steady, no blowdown.'],
  ['Foaming.',false,'Foaming would show swinging readings and falling steam temperature.']
 ],'§7.4.5'),
 S('m10e',[['HP drum pressure','12.1 MPa (after trip at 13.3)',''],['HP SH safety valve','still blowing','act'],['HP drum level','↓ −220 mm',''],['HP steam temp','steady','']],'What does the manual require?',[
  ['Emergency shutdown immediately.',false,'Only if pressure and temperature keep falling and you can\'t hold normal operation.'],
  ['Reduce load and close down the gas damper to lower pressure until the valve reseats; keep level and temperature steady; get permission to shut down.',true,'Correct (§7.4.9). If pressure and temperature keep falling, then emergency shutdown.'],
  ['Increase load to push the valve closed.',false,'Raising pressure keeps the valve open.']
 ],'§7.4.9'),
 Q('m10f','After a serious HP water shortage, the unit has tripped. The drum is empty and tubes are hot. When may you feed water?',[
  ['Right away, slowly.',false,'Feeding hot, dry tubes causes thermal shock.'],
  ['Only when the heating surfaces are fully cooled and inspected, or confirmed undamaged and cooled to feedwater temperature.',true,'Correct (§7.4.2).'],
  ['When the drum pressure reaches zero.',false,'Pressure is not the condition; tube temperature and integrity are.']
 ],'§7.4.2'),
 Q('m10g','A small economizer leak: level can be held with careful feeding. What is allowed?',[
  ['Emergency shutdown.',false,'Not required while the level holds.'],
  ['Continue under close watch, recording the fault parameters, ready to shut down.',true,'Correct (§7.4.6).'],
  ['Continue normally.',false,'You must strengthen monitoring and record the trend.']
 ],'§7.4.6')
]});

M.push({id:'aux', n:'11', title:'Auxiliaries: air, dryer, three-way damper', short:'Auxiliaries',
goal:['Know normal and alarm values for instrument air and the dryer.','Read a dryer or compressor fault from its symptom.','Operate the three-way damper and its hydraulics, including on loss of power.'],
body:()=>`
<h3>Instrument air</h3>
<p>Normal header pressure ${N('0.80 MPa')}; low alarm ${N('0.40 MPa')}. The compressor delivers ${N('18.6 Nm³/min')} at ${N('0.8 MPa(g)')}, water cooled, ${N('110 kW')}.</p>
<ul>
<li><b>First start:</b> check wiring and oil (visible in the sight glass), open cooling water and the vent; bump the motor to check rotation matches the arrow. At full load the oil should sit at ${N('2/3–3/4')} of the sight glass.</li>
<li><b>High head outlet temperature:</b> not enough cooling air or water, cooling water too hot, low oil, blocked cooler or scaled water side.</li>
<li><b>Low output or pressure:</b> consumption higher than capacity, blocked air filter, leaks.</li>
<li><b>No condensate from the separator while loading:</b> blocked drain line or a stuck float valve.</li>
</ul>
<h3>Dryer</h3>
<p>Outlet dew point ${N('≤ −40 °C')}. Regeneration tower pressure must stay ${N('≤ 0.2 bar')}; higher means the silencer is blocked (if the valves are fine). Regeneration heater limits: lower ${N('80 °C')}, upper ${N('120 °C')}.</p>
${table(['Symptom','Likely causes'],[
 ['High dew point','air flow above capacity; desiccant worn out or contaminated; inlet pressure low or temperature high; tower changeover cycle too long; regeneration flow too small or too cold'],
 ['Regeneration tower above 0.2 bar','blocked silencer; regeneration valve not fully open; poor non-return valve seal'],

<h3>Three-way damper (T-joint gate valve)</h3>
<p>Sends GT exhaust to the HRSG or the bypass stack. It is <b>fully open or fully closed only</b>; it does not modulate (Rev C). Normal stroke ${N('60 s')}; emergency close ${N('≤ 30 s')} by hydraulics. Passage ${N('6800 × 6800 mm')}, design ${N('641 °C')}.</p>
<p><b>Seal air:</b> two fans, one running and one standby. Seal air goes to the side that is shut: damper fully open to the HRSG → bypass-side seal air valve open, boiler-side closed; damper fully closed → boiler-side open, bypass-side closed; damper anywhere in between → both butterfly valves closed and the seal fan stops. The seal fan must be running when the GT starts.</p>
<p><b>Hydraulics:</b> the accumulator holds ${N('16–20 MPa')}. Below 16 the oil pump starts; at 20 it stops. The emergency button opens a separate circuit that closes the damper fast. On power loss, operate the three-position valve by hand using oil stored in the accumulator. If a solenoid fails, push the manual rod on the directional valve.</p>
<p><b>Oil:</b> L-HM46 anti-wear hydraulic oil, viscosity ${N('41.4–50.6 mm²/s')} at 40 °C, flash point above 170 °C, pour point below −25 °C. Fill only through the inlet strainer; level between the two marks; change after about 12 months if analysis says so.</p>
${table(['Symptom','Check'],[

 ['Cylinder won\'t hold position','stuck solenoid valve spool (push manually); stuck hydraulic check valve']
])}`,

function currentId(){ const h=(location.hash||'').replace('#',''); return h || store.get('last','start'); }

function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function actHTML(q, label){
  const src = q.src ? `<span class="src">${q.src}</span>` : '';
  if(q.type==='order'){
    return `<div class="act" data-qid="${q.id}"><div class="kind"><span>${label||'Put in order'}</span>${src}</div><div class="q">${q.q}</div><div class="seq"></div><div class="pool"></div><div class="row"><button class="btn" data-check>Check order</button><button class="btn ghost" data-reset>Start again</button></div><div class="fbwrap"></div></div>`;
  }
  const panel = q.type==='scn' ? `<div class="panel">${q.panel.map(([t,v,c])=>`<div class="tag-r"><span>${t}</span><span class="val ${c||''}">${v}</span></div>`).join('')}</div>` : '';
  return `<div class="act" data-qid="${q.id}"><div class="kind"><span>${label|| (q.type==='scn'?'Scenario':'Practice')}</span>${src}</div>${panel}<div class="q">${q.q}</div><div class="opts"></div><div class="fbwrap"></div></div>`;
}
function wire(root, q, opts={}){
  const el = root.querySelector(`[data-qid="${q.id}"]`); if(!el) return;
  const fbw = el.querySelector('.fbwrap');
  if(q.type==='order'){
    const seq = el.querySelector('.seq'), pool = el.querySelector('.pool');
    let chosen = [];
    const order = shuffle(q.steps.map((s,i)=>i));
    function draw(){
      seq.innerHTML = chosen.map((i,k)=>`<button class="step" data-i="${i}"><span class="i">${k+1}</span><span>${q.steps[i]}</span></button>`).join('');
      pool.innerHTML = order.filter(i=>!chosen.includes(i)).map(i=>`<button class="step" data-i="${i}"><span class="i">·</span><span>${q.steps[i]}</span></button>`).join('');
    }
    pool.addEventListener('click', e=>{ const b=e.target.closest('.step'); if(!b) return; chosen.push(+b.dataset.i); fbw.innerHTML=''; draw(); });
    seq.addEventListener('click', e=>{ const b=e.target.closest('.step'); if(!b) return; chosen = chosen.filter(i=>i!==+b.dataset.i); fbw.innerHTML=''; draw(); });
    el.querySelector('[data-reset]').addEventListener('click', ()=>{ chosen=[]; fbw.innerHTML=''; draw(); });
    el.querySelector('[data-check]').addEventListener('click', ()=>{
      if(chosen.length < q.steps.length){ fbw.innerHTML = `<div class="fb wrong"><b>Not finished.</b>Place all ${q.steps.length} steps first.</div>`; return; }
      const good = chosen.map((i,k)=>i===k);
      [...seq.children].forEach((b,k)=>b.classList.add(good[k]?'right':'wrong'));
      const n = good.filter(Boolean).length;
      if(n===q.steps.length){ fbw.innerHTML = `<div class="fb right"><b>All in the right order.</b></div>`; markSolved(q.id); opts.onAnswer && opts.onAnswer(true); }
      else { fbw.innerHTML = `<div class="fb wrong"><b>${n} of ${q.steps.length} in the right place.</b>Red steps are out of position. Tap a step to take it back, or start again.</div>`; opts.onAnswer && opts.onAnswer(false); }
    });
    draw(); return;
  }
  const box = el.querySelector('.opts');
  const idx = shuffle(q.o.map((o,i)=>i));
  box.innerHTML = idx.map(i=>`<button class="opt" data-i="${i}">${q.o[i][0]}</button>`).join('');
  let first = true;
  box.addEventListener('click', e=>{
    const b = e.target.closest('.opt'); if(!b) return;
    if(opts.lockAfterFirst && !first) return;
    const [t,ok,fb] = q.o[+b.dataset.i];
    box.querySelectorAll('.opt').forEach(x=>x.classList.remove('wrong'));
    b.classList.add(ok?'right':'wrong');
    fbw.innerHTML = `<div class="fb ${ok?'right':'wrong'}"><b>${ok?'Right.':'Not quite.'}</b>${fb}</div>`;
    if(opts.lockAfterFirst){
      if(!ok){ const ri = q.o.findIndex(o=>o[1]); box.querySelector(`[data-i="${ri}"]`).classList.add('right'); fbw.innerHTML += `<div class="fb right"><b>Correct answer:</b>${q.o[ri][0]} ${q.o[ri][2]}</div>`; }
      box.querySelectorAll('.opt').forEach(x=>x.style.cursor='default');
    }
    if(first){ opts.onAnswer && opts.onAnswer(ok); first=false; }
    if(ok) markSolved(q.id);
  });
}

function workedHTML(w){
  return `<div class="worked" id="worked"><div class="kind">Worked example</div><div class="case">${w.case}</div><div class="wsteps"></div><div class="row"><button class="btn ghost" data-next>Predict the next step, then reveal it</button></div></div>`;
}
function wireWorked(root, w){
  const el = root.querySelector('#worked'); if(!el) return;
  const box = el.querySelector('.wsteps'), btn = el.querySelector('[data-next]');
  let k=0;
  btn.addEventListener('click', ()=>{
    if(k<w.steps.length){ const [l,t]=w.steps[k]; box.insertAdjacentHTML('beforeend', `<div class="wstep"><span class="lbl">Step ${k+1} · ${l}</span>${t}</div>`); k++; }
    if(k>=w.steps.length){ btn.textContent='All steps shown'; btn.disabled=true; }
  });
}

function recallPool(upto){
  const pool=[]; for(const m of M){ if(m.id===upto) break; (m.practice||[]).forEach(q=>{ if(q.type!=='order') pool.push(q); }); }
  return pool;
}

function renderModule(m, idx){
  const recall = recallPool(m.id);
  const recallQs = shuffle(recall).slice(0,2).map(q=>Object.assign({},q,{id:q.id+'_r'}));
  let h = `<div class="eyebrow">Module ${m.n}</div><h1>${m.title}</h1>`;
  h += `<div class="goal"><b>After this module you can</b><ul>${m.goal.map(g=>`<li>${g}</li>`).join('')}</ul></div>`;
  if(recallQs.length){ h += `<h2>From earlier modules</h2><p>Two questions from what you have already covered. Answer from memory before you scroll up.</p>` + recallQs.map(q=>actHTML(q,'Recall')).join(''); }
  if(m.warm){ h += `<h2>Guess first</h2>` + actHTML(m.warm,'Before the lesson'); }
  h += `<h2>${m.id==='start'?'About this course':'The lesson'}</h2>` + m.body();
  if(m.worked){ h += `<h2>Worked example</h2>` + workedHTML(m.worked); }
  if(m.practice && m.practice.length){ h += `<h2>Practice</h2><p>Every wrong answer tells you why. Retry until each is right; the module's dot turns green when all are solved.</p>` + m.practice.map(q=>actHTML(q)).join(''); }
  const nxt = M[idx+1], prv = M[idx-1];
  h += `<div class="foot">${prv?`<button class="btn ghost" data-go="${prv.id}">← ${prv.short}</button>`:'<span></span>'}${nxt?`<button class="btn" data-go="${nxt.id}">${nxt.short} →</button>`:`<button class="btn" data-go="final">Final check →</button>`}</div>`;
  mainEl.innerHTML = h;
  recallQs.forEach(q=>wire(mainEl,q));
  if(m.warm) wire(mainEl, m.warm);
  if(m.worked) wireWorked(mainEl, m.worked);
  (m.practice||[]).forEach(q=>wire(mainEl,q));
}
mainEl.addEventListener('click', e=>{ const b=e.target.closest('.foot [data-go]'); if(b) go(b.dataset.go); });

let drillCats = new Set(DRILL.map(d=>d.cat));
let drillStats = {n:0, ok:0, streak:0};
function renderDrill(){
  const cats = [...new Set(DRILL.map(d=>d.cat))];
  mainEl.innerHTML = `<div class="eyebrow">Practice</div><h1>Reading drill</h1>
  <p>A reading appears. Decide, then check. This drill mixes every module, which is the point: in the plant, readings don't arrive sorted by chapter. Five minutes a day is enough.</p>
  <div class="chips" role="group" aria-label="Topics">${cats.map(c=>`<button class="chip" data-cat="${c}" aria-pressed="${drillCats.has(c)}">${c}</button>`).join('')}</div>
  <div class="act"><div class="kind"><span>Is this reading OK?</span><span class="stat" id="dstat"></span></div>
  <div class="drill-card" id="dcard"></div>
  <div class="judge" id="djudge">
   <button class="opt" data-a="ok">Within limits<small>no alarm</small></button>
   <button class="opt" data-a="alarm">Alarm<small>investigate, correct</small></button>
   <button class="opt" data-a="act">Beyond limit<small>stop, hold, trip, don't start</small></button>
  </div><div class="fbwrap" id="dfb"></div>
  <div class="row"><button class="btn" id="dnext">Next reading</button></div></div>`;
  let cur=null, answered=false;
  function pick(){
    const pool = DRILL.filter(d=>drillCats.has(d.cat)); if(!pool.length){ document.getElementById('dcard').innerHTML='<div class="p">Pick at least one topic.</div>'; return; }
    const d = pool[Math.floor(Math.random()*pool.length)], v = d.vals[Math.floor(Math.random()*d.vals.length)];
    cur = {d,v,a:d.j(v)}; answered=false;
    const vs = (v>0 && d.u==='mm' ? '+' : '') + (String(v).replace('-','−'));
    document.getElementById('dcard').innerHTML = `<div class="p">${d.p}</div><div class="reading">${vs} <span style="font-size:18px">${d.u}</span></div><div class="ctx">${d.ctx}</div>`;
    document.getElementById('dfb').innerHTML='';
    document.querySelectorAll('#djudge .opt').forEach(b=>b.classList.remove('right','wrong'));
    document.getElementById('dstat').textContent = drillStats.n ? `${drillStats.ok}/${drillStats.n} right · streak ${drillStats.streak}` : '';
  }
  document.getElementById('djudge').addEventListener('click', e=>{
    const b=e.target.closest('.opt'); if(!b||!cur||answered) return; answered=true;
    const ok = b.dataset.a===cur.a; drillStats.n++; if(ok){drillStats.ok++; drillStats.streak++;} else drillStats.streak=0;
    b.classList.add(ok?'right':'wrong'); if(!ok) document.querySelector(`#djudge [data-a="${cur.a}"]`).classList.add('right');
    const lbl = {ok:'within limits',alarm:'in alarm',act:'beyond the action limit'}[cur.a];
    document.getElementById('dfb').innerHTML = `<div class="fb ${ok?'right':'wrong'}"><b>${ok?'Right':'Not quite'}: ${lbl}.</b>${cur.d.note}</div>`;
    document.getElementById('dstat').textContent = `${drillStats.ok}/${drillStats.n} right · streak ${drillStats.streak}`;
  });
  document.getElementById('dnext').addEventListener('click', pick);
  mainEl.querySelector('.chips').addEventListener('click', e=>{ const c=e.target.closest('.chip'); if(!c) return; const k=c.dataset.cat; drillCats.has(k)?drillCats.delete(k):drillCats.add(k); c.setAttribute('aria-pressed', drillCats.has(k)); pick(); });
  pick();
}

function renderFinal(){
  const items = shuffle(FINAL);
  let score=0, answered=0; const missed=[];
  mainEl.innerHTML = `<div class="eyebrow">Assessment</div><h1>Final check</h1>
  <p>Sixteen mixed questions covering the end task from Module 0. One attempt per question; the correct answer shows after you choose. At the end you get a list of modules to revisit.</p>
  <div id="fq">${items.map((it,i)=>actHTML(Object.assign({},it.q,{id:it.q.id+'_f'}), `Question ${i+1} of ${items.length}`)).join('')}</div>
  <div class="act" id="fres"><div class="kind"><span>Result</span></div><div class="score" id="fscore">0 / ${items.length} answered</div><div id="fmiss" class="stat" style="margin-top:6px"></div></div>`;
  items.forEach(it=>{
    const q = Object.assign({},it.q,{id:it.q.id+'_f'});
    wire(mainEl,q,{lockAfterFirst:true,onAnswer:ok=>{
      answered++; if(ok) score++; else missed.push(it.m);
      document.getElementById('fscore').textContent = `${score} / ${answered} right${answered===items.length?' · finished':''}`;
      if(answered===items.length){
        const mods = [...new Set(missed)].map(id=>M.find(m=>m.id===id)).filter(Boolean);
        document.getElementById('fmiss').innerHTML = mods.length ? 'Revisit: ' + mods.map(m=>`<button class="chip" data-go="${m.id}">${m.n} · ${m.short}</button>`).join(' ') : 'Nothing to revisit. Keep the Reading drill going to hold on to it.';
        const best = store.get('finalBest',0); if(score>best) store.set('finalBest',score);
      }
    }});
  });
  document.getElementById('fmiss').addEventListener('click', e=>{ const b=e.target.closest('[data-go]'); if(b) go(b.dataset.go); });
}

function renderIssues(){
  const items = [
   ['High','Steam temperature setpoint','§4.2.2 says superheated steam is controlled to no more than 510 °C; §1.1.3 and §1.2.2 give 560.7 °C normal and a 567.5 °C alarm.'],
   ['High','Pressure alarms vs rated pressures','HP high alarm 12.3 MPa is below the 12.44 MPa.a drum working pressure. IP alarm 3.7 and RH alarm 3.4 MPa are below the 3×1 rated outlet pressures 3.98 and 3.85 MPa.a. The manual mixes absolute and gauge without saying which alarms use. Take the real setpoints from the DCS.'],
   ['High','Emergency vs fault shutdown lists','§5.3.1 makes "feed water quality deteriorates" an immediate shutdown; §7.3 treats unrecoverable water quality as a controlled fault shutdown. §5.3.1 and §7.2.1 also list different conditions.'],
   ['High','Water and steam quality tables','§1.1.4: units garbled (iron and copper in µmol/L for condensate, "us/℃m"), more columns than values in the drum-water and steam tables, drum-water SiO₂ "≤ 2.0 ppb" is implausible. Get the chemistry lab\'s limits.'],
   ['Medium','Drum level during filling','§3.3.2 says keep levels "around +50 mm"; normal is −50 mm and the startup fill levels are lower still.'],
   ['Medium','HP drum temperature','§1.1.6 gives the HP drum a highest temperature of 567.5 °C. A drum runs near saturation (about 327 °C at 12.4 MPa); the figure looks copied from the steam alarm.'],
   ['Medium','Circulating pump bearing limits','§1.2.2 alarm 100 °C / stop 120 °C vs Table 2-1 rolling bearing 80 °C and "normal under 85 °C" in the same section.'],
   ['Medium','Pump vibration limit','0.05 mm in §2.2.4 vs 0.06 mm above 1500 r/min in Table 2-2.'],
   ['Medium','Shutdown order','§5.1 "steam turbine must be synchronized before the gas turbine" probably means the steam turbine is taken off first.'],
   ['Medium','Hot start text','§3.3.5 item 1 is garbled and unreadable.'],
   ['Low','Level meter calibration frequency','Twice per shift (§4.2.2) vs once per shift (§4.3).'],
   ['Low','Compressed air before startup','Tank above 0.8 MPa (§2.1.9) vs above 0.6 MPa (§3.2.1).'],
   ['Low','Valve line-up','§2.1.13 lists the superheater outlet drain valve under both "open" and "close".'],
   ['Low','Dryer filter regulator','0.2 / 0.5 MPa (§3.7.1) vs 0.4 MPa (§3.7.3).'],
   ['Low','Wording','§2.4.4 says drum "differential pressure … no more than 40 °C"; it means temperature difference. §1.1.13–1.1.14 flash tank thickness and weight are blank.'],
   ['Low','Level datum','Only the IP drum datum is given (180 mm below centreline). HP and LP datums are not stated.']
  ];
  mainEl.innerHTML = `<div class="eyebrow">Reference</div><h1>Manual issues</h1>
  <p>Places where the Rev C manual contradicts itself, is garbled, or leaves something out. None of these are guesses about the plant; each is a disagreement inside the document. Confirm them with the shift leader, the DCS setpoint list or the OEM before relying on either value. "High" means the difference could change an operating decision.</p>
  <ul class="issues">${items.map(([s,t,d])=>`<li><span class="pill ${s==='High'?'act':s==='Medium'?'alarm':'ok'}">${s}</span> <b>${t}.</b> ${d}</li>`).join('')}</ul>
  <h2>What the manual doesn't cover</h2>
  <ul>
   <li>How the HRSG works: flow paths, why each limit exists, what each alarm protects. Module 1 and the "Why" notes fill part of this.</li>
   <li>The P&amp;IDs and general arrangement drawings in §10 are images. This course was built from the manual's text, so it does not teach from the drawings. Pair Module 1 with the drawings on pages 127–140.</li>
   <li>No trip values for HP, IP or LP pressure or for steam temperature, only alarms.</li>
  </ul>`;
}

function render(){
  const id = currentId();
  renderRail();
  const idx = M.findIndex(m=>m.id===id);
  if(idx>=0) renderModule(M[idx], idx);
  else if(id==='drill') renderDrill();
  else if(id==='final') renderFinal();
  else if(id==='ref') renderRef();
  else if(id==='issues') renderIssues();
  else renderModule(M[0],0);
  document.title = 'Rumaila HRSG Course';
}
render();
