# The Ubuntu archives .github/scripts/apt-install.sh downloads, kept across runs with actions/cache, so that a slow
# or failing mirror (2026-10-26: Azure's at 10 to 60 kB/s) is met only when packages change. Used twice in a job:
# `mode: restore` before its first apt-install.sh (sets APT_DEB_CACHE for the job's later steps), `mode: save` after
# its last, with `if: always() && steps.<restore step>.outcome == 'success'`, so that a failed or cancelled run still
# keeps what it got. Nothing from the cache is trusted: apt-install.sh copies a cached archive in only when its SHA-256
# is the one the signed package lists give (and deletes it otherwise), and only archives it checked are saved
# (.github/scripts/apt-cache-key.sh). The key is the cache's name, the Ubuntu release, the machine and the hash of
# the archives' names and SHA-256: saved again only when they change; restored by the newest with the same name.
name: apt archive cache
description: Restore (mode restore) or save (mode save) the job's apt archives for apt-install.sh
inputs:
  name:
    description: the cache's name, one per set of packages (a job, or a job and its matrix value)
    required: true
  mode:
    description: restore or save
    required: true
runs:
  using: composite
  steps:
    - id: where
      shell: bash
      env:
        CACHE_NAME: ${{ inputs.name }}
        MODE: ${{ inputs.mode }}
      run: |
        case "$MODE" in restore|save) ;; *) echo "::error::apt-cache: mode is restore or save, not '$MODE'"; exit 1 ;; esac
        # (os-release read in a subshell: it sets NAME and others, which must not reach this step's variables)
        release=$(. /etc/os-release && echo "$ID-$VERSION_ID")
        echo "dir=$HOME/.cache/apt-debs" >> "$GITHUB_OUTPUT"
        echo "prefix=apt-debs-$release-$(uname -m)-$CACHE_NAME-" >> "$GITHUB_OUTPUT"
    - if: inputs.mode == 'restore'
      id: restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.where.outputs.dir }}
        key: ${{ steps.where.outputs.prefix }}restore
        restore-keys: ${{ steps.where.outputs.prefix }}
    - if: inputs.mode == 'restore'
      shell: bash
      env:
        DIR: ${{ steps.where.outputs.dir }}
        MATCHED: ${{ steps.restore.outputs.cache-matched-key }}
      run: |
        mkdir -p "$DIR"
        rm -f "$DIR/.used"
        echo "APT_DEB_CACHE=$DIR" >> "$GITHUB_ENV"
        echo "APT_DEB_CACHE_RESTORED=$MATCHED" >> "$GITHUB_ENV"
        n=$(find "$DIR" -maxdepth 1 -name '*.deb' | wc -l)
        echo "apt cache: ${MATCHED:-nothing restored (no cache under this name yet)}: $n archive(s), $(du -sh "$DIR" | cut -f1)"
    - if: inputs.mode == 'save'
      id: key
      shell: bash
      env:
        DIR: ${{ steps.where.outputs.dir }}
        PREFIX: ${{ steps.where.outputs.prefix }}
      run: |
        h=$("$GITHUB_ACTION_PATH/../../scripts/apt-cache-key.sh" "$DIR")
        if [ -z "$h" ]; then
          echo "apt cache: nothing checked to save"
        elif [ "$PREFIX$h" = "${APT_DEB_CACHE_RESTORED:-}" ]; then
          echo "apt cache: unchanged ($PREFIX$h), not saved again"
        else
          echo "apt cache: saving $(find "$DIR" -maxdepth 1 -name '*.deb' | wc -l) archive(s), $(du -sh "$DIR" | cut -f1), as $PREFIX$h"
          echo "key=$PREFIX$h" >> "$GITHUB_OUTPUT"
        fi
    - if: inputs.mode == 'save' && steps.key.outputs.key != ''
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.where.outputs.dir }}
        key: ${{ steps.key.outputs.key }}
