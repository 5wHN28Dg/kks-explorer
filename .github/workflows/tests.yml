# The project's test suites on x86-64 (issue #6): one job per suite, so
# branch protection can require each. Linux jobs run on ubuntu-26.04, the maintainer's OS: its GTK 4.22,
# libadwaita 1.9, libjxl 0.11 and zxing-cpp are the versions the apps are built against (apps/gnome/README,
# importer/README). Windows is cross-built with llvm-mingw like on the maintainer's machine (apps/windows/README) and
# tested on a windows-2022 runner. What is not covered here (the full Windows UIA e2e, real phones) is listed in the
# PR that added this file and in the wiki's Development page.
name: Tests

on:
  pull_request:
    # prose-only changes (CLAUDE.md, READMEs, docs/) don't build or test anything; the two READMEs tests read do
    paths: ['**', '!*.md', '!**/*.md', '!docs/**', 'relay/README.md', 'vendor/fonts/README.md']
  push:
    branches: [main]
    # prose-only changes (CLAUDE.md, READMEs, docs/) don't build or test anything; the two READMEs tests read do
    paths: ['**', '!*.md', '!**/*.md', '!docs/**', 'relay/README.md', 'vendor/fonts/README.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}   # every main commit keeps its result

env:
  NIM_VERSION: 2.2.12
  NIM_SHA256: 2639a06a5ea7a7fcf57df1e7e1ef4d1b2bee58c7ac9bd00dbd2aa5bea1e5a56a
  IMAGE: ubuntu-26.04
  # the libraries the Nim core, platform layer, server and importer link (GnuTLS, zlib, OpenSSL's Argon2id, SQLite,
  # GIO for Avahi's D-Bus, libjxl 0.11)
  APT_NIM: libgnutls28-dev zlib1g-dev libssl-dev libsqlite3-dev libglib2.0-dev libjxl-dev

jobs:
  core:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-nim
        with: {version: '${{ env.NIM_VERSION }}', sha256: '${{ env.NIM_SHA256 }}', image: '${{ env.IMAGE }}'}
      - name: Libraries
        run: sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends libgnutls28-dev zlib1g-dev >/dev/null
      - name: The Nim core's tests (no platform)
        working-directory: core
        run: nim test
      - name: The dark-drawings colour vectors still match apps/common/darkcolor.nim (dark.js and DarkColor.kt are checked against them)
        run: nim r --hints:off --path:apps/common tests/web/make_dark_vectors.nim | diff -u tests/web/dark-vectors.json -
      - name: The valve-type vectors still match core views.tagView (systems.js KSys.valveType is checked against them)
        working-directory: core
        run: nim r --hints:off --path:src ../tests/web/make_valve_vectors.nim | diff -u ../tests/web/valve-vectors.json -
      - name: The links vectors still match core views.linksView (systems.js KSys.linksView is checked against them)
        working-directory: core
        run: nim r --hints:off --path:src ../tests/web/make_links_vectors.nim | diff -u ../tests/web/links-vectors.json -

  platform-linux:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-nim
        with: {version: '${{ env.NIM_VERSION }}', sha256: '${{ env.NIM_SHA256 }}', image: '${{ env.IMAGE }}'}
      - name: Libraries, and Avahi on the system bus (test_mdns announces and browses through it)
        run: |
          sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends $APT_NIM avahi-daemon >/dev/null
          sudo systemctl start avahi-daemon
          systemctl is-active avahi-daemon
      - name: The relay twin's Python (test_internet starts relay/twin.py from .venv)
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q -c requirements-dev.txt cryptography
      - name: The platform layer's tests (store, TLS, sync over TCP, Argon2id, mDNS, the relay pipe and direct UDP)
        working-directory: platform/linux
        run: nim test

  importer:
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-nim
        with: {version: '${{ env.NIM_VERSION }}', sha256: '${{ env.NIM_SHA256 }}', image: '${{ env.IMAGE }}'}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0; MuPDF 1.28.5 built (pinned by SHA-256 in the script)
        with:
          path: |
            ~/.local/kksdev/src/mupdf-1.28.5-source/include
            ~/.local/kksdev/src/mupdf-1.28.5-source/build/release/libmupdf.a
            ~/.local/kksdev/src/mupdf-1.28.5-source/build/release/libmupdf-third.a
          key: mupdf-${{ env.IMAGE }}-${{ hashFiles('importer/fetch_mupdf.sh') }}
      - name: Libraries, MuPDF
        run: |
          sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends $APT_NIM >/dev/null
          [ -f ~/.local/kksdev/src/mupdf-1.28.5-source/build/release/libmupdf.a ] || sh importer/fetch_mupdf.sh >/dev/null
      - name: The importer's tests
        working-directory: importer
        run: |
          nim test

  # the server and the importer, built once for the jobs that drive them (server-http, web, gnome-e2e)
  linux-build:
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-nim
        with: {version: '${{ env.NIM_VERSION }}', sha256: '${{ env.NIM_SHA256 }}', image: '${{ env.IMAGE }}'}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0; MuPDF 1.28.5 built (pinned by SHA-256 in the script)
        with:
          path: |
            ~/.local/kksdev/src/mupdf-1.28.5-source/include
            ~/.local/kksdev/src/mupdf-1.28.5-source/build/release/libmupdf.a
            ~/.local/kksdev/src/mupdf-1.28.5-source/build/release/libmupdf-third.a
          key: mupdf-${{ env.IMAGE }}-${{ hashFiles('importer/fetch_mupdf.sh') }}
      - name: Libraries, MuPDF
        run: |
          sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends $APT_NIM >/dev/null
          [ -f ~/.local/kksdev/src/mupdf-1.28.5-source/build/release/libmupdf.a ] || sh importer/fetch_mupdf.sh >/dev/null
      - name: kks_server and kks_import
        run: |
          (cd platform/linux && nim c -d:release -o:/tmp/kkslinux/kks_server kks_server.nim)
          (cd importer && nim c -d:release -o:/tmp/kksimp/kks_import kks_import.nim)
          tar cf linux-bin.tar -C /tmp kkslinux/kks_server kksimp/kks_import
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-bin
          path: linux-bin.tar
          retention-days: 3

  server-http:
    needs: linux-build
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-bin
      - name: Binaries and their libraries
        run: |
          tar xf linux-bin.tar -C /tmp
          sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends $APT_NIM >/dev/null
          test -x /tmp/kkslinux/kks_server && test -x /tmp/kksimp/kks_import   # else the Drawings tests would skip
      - name: The server over HTTP (flow, login throttling, sign-up, Drawings through the importer)
        env:
          KKS_IMPORT: /tmp/kksimp/kks_import
        run: python3 platform/linux/e2e/test_server_http.py /tmp/kkslinux/kks_server -v

  python:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: pip-${{ env.IMAGE }}-${{ hashFiles('requirements-dev.txt') }}
      - name: .venv from requirements-dev.txt (pinned)
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q -r requirements-dev.txt
      - name: The protocol, strict JSON, path store and course vectors (the Python reference)
        run: .venv/bin/python -m unittest discover -s tests -v

  # the web client's download size against web-size.json (tools/web_size.py): any change needs the baseline updated in
  # the same PR, and the PR says why growth is worth it
  web-size:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Sizes against the baseline
        run: |
          set +e
          python3 tools/web_size.py > "$RUNNER_TEMP/size.txt"; code=$?
          cat "$RUNNER_TEMP/size.txt"
          { echo '### Web client size'; echo '```'; cat "$RUNNER_TEMP/size.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $code

  web:
    needs: linux-build
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    name: web (${{ matrix.engine }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-bin
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: pip-${{ env.IMAGE }}-${{ hashFiles('requirements-dev.txt') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0; the browser builds of the pinned Playwright
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ env.IMAGE }}-${{ matrix.engine }}-${{ hashFiles('requirements-dev.txt') }}
      - name: Binaries, their libraries, djxl (test_web_wasm checks the stored photo)
        run: |
          tar xf linux-bin.tar -C /tmp
          sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends $APT_NIM libjxl-tools >/dev/null
      - name: .venv with Playwright, and its ${{ matrix.engine }} build with the system packages it needs
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q -r requirements-dev.txt
          .venv/bin/playwright install --with-deps ${{ matrix.engine }}
      - name: The browser client on v2 plant data (test_web_v2)
        env: {KKS_SERVER: /tmp/kkslinux/kks_server, KKS_IMPORTER: /tmp/kksimp/kks_import}
        run: .venv/bin/python platform/linux/e2e/test_web_v2.py -v -k ${{ matrix.engine }}
      - name: Several tags at once in index.html (test_web_multi; /api/submit-many)
        env: {KKS_SERVER: /tmp/kkslinux/kks_server}
        run: .venv/bin/python platform/linux/e2e/test_web_multi.py -v -k ${{ matrix.engine }}
      - name: Equipment by system in index.html (test_web_systems)
        env: {KKS_SERVER: /tmp/kkslinux/kks_server}
        run: .venv/bin/python platform/linux/e2e/test_web_systems.py -v -k ${{ matrix.engine }}
      - name: The Coverage drawer in index.html (test_web_coverage)
        env: {KKS_SERVER: /tmp/kkslinux/kks_server}
        run: .venv/bin/python platform/linux/e2e/test_web_coverage.py -v -k ${{ matrix.engine }}
      - name: The valve type in index.html's panel (test_web_valve)
        env: {KKS_SERVER: /tmp/kkslinux/kks_server}
        run: .venv/bin/python platform/linux/e2e/test_web_valve.py -v -k ${{ matrix.engine }}
      - name: Links between drawings in index.html (test_web_links)
        env: {KKS_SERVER: /tmp/kkslinux/kks_server}
        run: .venv/bin/python platform/linux/e2e/test_web_links.py -v -k ${{ matrix.engine }}
      - name: The 2026-10-08 requests on the web (test_web_requests)
        env: {KKS_SERVER: /tmp/kkslinux/kks_server, KKS_IMPORTER: /tmp/kksimp/kks_import}
        run: .venv/bin/python platform/linux/e2e/test_web_requests.py -v -k ${{ matrix.engine }}
      - name: The Manage page (test_admin_web)
        env: {KKS_SERVER: /tmp/kkslinux/kks_server, KKS_IMPORTER: /tmp/kksimp/kks_import}
        run: .venv/bin/python platform/linux/e2e/test_admin_web.py -v -k ${{ matrix.engine }}
      - name: The whole plant offline, the lease, back online (test_web_offline)
        env: {KKS_SERVER: /tmp/kkslinux/kks_server, KKS_IMPORTER: /tmp/kksimp/kks_import}
        run: .venv/bin/python platform/linux/e2e/test_web_offline.py -v -k ${{ matrix.engine }}
      - name: Sign-up with the plant's code, then the manager's approval (test_web_signup)
        env: {KKS_SERVER: /tmp/kkslinux/kks_server}
        run: .venv/bin/python platform/linux/e2e/test_web_signup.py -v -k ${{ matrix.engine }}
      - name: Signing in on this machine (test_web_local_login)
        env: {KKS_SERVER: /tmp/kkslinux/kks_server}
        run: .venv/bin/python platform/linux/e2e/test_web_local_login.py -v -k ${{ matrix.engine }}
      - name: Stale caches and service workers (test_web_stale; the upgrade cases need an old build and skip here)
        env: {KKS_SERVER: /tmp/kkslinux/kks_server}
        run: .venv/bin/python platform/linux/e2e/test_web_stale.py -v -k ${{ matrix.engine }} -k test_logout
      - name: Views built as elements, never markup (test_common_sinks)
        env: {KKS_ENGINE: '${{ matrix.engine }}'}
        run: .venv/bin/python tests/web/test_common_sinks.py -v
      - name: Our libjxl and zxing-cpp WebAssembly build (test_web_wasm)
        env: {KKS_SERVER: /tmp/kkslinux/kks_server}
        run: .venv/bin/python platform/linux/e2e/test_web_wasm.py -v -k ${{ matrix.engine }}
      - name: The JSON courses (test_course_web; the engine's pages and keyboard, plus the course list API)
        env: {KKS_SERVER: /tmp/kkslinux/kks_server}
        run: .venv/bin/python platform/linux/e2e/test_course_web.py -v -k ${{ matrix.engine }} -k list_api
      - name: course-figure.js against the course vectors (tests/web)
        run: .venv/bin/python tests/web/test_course_figure.py -v -k ${{ matrix.engine }}
      - name: dark.js against apps/common/darkcolor.nim's values (tests/web)
        run: .venv/bin/python tests/web/test_dark.py -v -k ${{ matrix.engine }} -k tag_colours
      - name: systems.js against core views.systemsView's cases (tests/web)
        run: .venv/bin/python tests/web/test_systems.py -v -k ${{ matrix.engine }}
      - name: systems.js KSys.linksView against core views.linksView's vectors (tests/web)
        run: .venv/bin/python tests/web/test_links.py -v -k ${{ matrix.engine }}
      - name: systems.js's coverageView against core views.coverageView (tests/web)
        run: .venv/bin/python tests/web/test_coverage.py -v -k ${{ matrix.engine }}
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-shots-${{ matrix.engine }}
          path: |
            /tmp/kks-web-shots
            /tmp/kks-course-shots
          retention-days: 7
          if-no-files-found: ignore

  gnome-e2e:
    needs: linux-build
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-nim
        with: {version: '${{ env.NIM_VERSION }}', sha256: '${{ env.NIM_SHA256 }}', image: '${{ env.IMAGE }}'}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-bin
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: pip-${{ env.IMAGE }}-${{ hashFiles('requirements-dev.txt') }}
      - name: GTK 4, libadwaita, libsecret, zxing-cpp, GStreamer; mutter, AT-SPI, python3-gi and Pillow for the test (system python3)
        run: |
          tar xf linux-bin.tar -C /tmp
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends $APT_NIM libgtk-4-dev libadwaita-1-dev libsecret-1-dev \
            libzxing-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good gstreamer1.0-libav mutter at-spi2-core python3-gi python3-pil gir1.2-atspi-2.0 \
            gir1.2-glib-2.0 dbus-daemon ffmpeg fuse3 mesa-vulkan-drivers libgl1-mesa-dri fonts-dejavu-core >/dev/null
          pkg-config --modversion gtk4 libadwaita-1
      - name: .venv with OpenCV (the QR video for the camera test)
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q -c requirements-dev.txt opencv-python-headless numpy
      - name: The GNOME app
        working-directory: apps/gnome
        run: nim c -d:release -o:/tmp/kksgnome/kks_explorer kks_explorer.nim
      - name: The GNOME app's unit tests (the dark-drawings colours and marker contrast)
        working-directory: apps/gnome
        run: nim test
      - name: The GNOME app through AT-SPI, in a private headless mutter (apps/gnome/e2e/headless.sh)
        run: |
          apps/gnome/e2e/headless.sh /usr/bin/python3 apps/gnome/e2e/test_gnome.py /tmp/kksgnome/kks_explorer \
            /tmp/kkslinux/kks_server /tmp/kksimp/kks_import
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gnome-shots
          path: |
            /tmp/kks-gnome-shots
            /tmp/kks-headless-mutter.log
          retention-days: 7
          if-no-files-found: ignore


  windows-build:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-nim
        with: {version: '${{ env.NIM_VERSION }}', sha256: '${{ env.NIM_SHA256 }}', image: '${{ env.IMAGE }}'}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0; llvm-mingw, zlib, libjxl, zxing-cpp (pinned by SHA-256 in the scripts), SQLite
        with:
          path: |
            ~/.local/kksdev/llvm-mingw
            ~/.local/kksdev/winx64
            ~/.local/kksdev/src/sqlite-amalgamation-3530400
          key: winx64-${{ env.IMAGE }}-${{ hashFiles('platform/windows/build-deps.sh', 'platform/windows/fetch-llvm-mingw.sh', 'android/nim/fetch_sqlite.sh') }}
      - name: llvm-mingw (pinned, decisions 0047 and 0053), the libraries
        run: |
          sh platform/windows/build-deps.sh
          ~/.local/kksdev/llvm-mingw/bin/x86_64-w64-mingw32-clang --version | head -1
      - name: The app, the UI Automation driver, the core and platform tests
        run: |
          mkdir -p out/core out/plat
          NIM=nim sh apps/windows/build.sh "$PWD/out/Walkdown.exe"
          (cd core && KKS_WIN_OUT=/tmp/kkswin-core nim wintests) && cp /tmp/kkswin-core/*.exe out/core/
          (cd platform/linux && KKS_WIN_OUT=/tmp/kkswin-plat nim wintests) && cp /tmp/kkswin-plat/*.exe out/plat/
          nim c --os:windows -d:mingw --cpu:amd64 --cc:clang -d:release --app:console --nimcache:/tmp/kkswin-jxl -o:out/plat/test_jxl_limit.exe apps/windows/tests/test_jxl_limit.nim
          nim c --os:windows -d:mingw --cpu:amd64 --cc:clang -d:release --app:console --nimcache:/tmp/kkswin-dark -o:out/plat/test_dark.exe apps/windows/tests/test_dark.nim
          nim c --os:windows -d:mingw --cpu:amd64 --cc:clang -d:release --app:console --nimcache:/tmp/kkswin-tiles -o:out/plat/test_tiles.exe apps/windows/tests/test_tiles.nim
          ls -l out out/core out/plat
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: walkdown-windows-x64
          path: out
          retention-days: 3

  windows-test:
    needs: windows-build
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: walkdown-windows-x64
          path: out
      - name: The core's tests with the CNG provider
        shell: pwsh
        run: |
          $env:KKS_VECTORS = "$PWD\ref\vectors"
          $failed = @()
          foreach ($t in Get-ChildItem out\core\*.exe) {
            Write-Host "== $($t.Name)"
            & $t.FullName
            if ($LASTEXITCODE -ne 0) { $failed += $t.Name }
          }
          if ($failed) { Write-Host "failed: $failed"; exit 1 }
      - name: The platform tests (SQLite store, Schannel TLS, sync over TCP, the relay pipe and direct UDP, CNG, DNS-SD, DPAPI)
        shell: pwsh
        run: |
          # test_internet against the relay twin (Python with cryptography), started here: one step, one process tree
          python -m venv venv
          venv\Scripts\pip install -q -c requirements-dev.txt cryptography
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $twin = Start-Process -FilePath venv\Scripts\python.exe -ArgumentList 'relay\twin.py', '18765' -PassThru -NoNewWindow `
            -RedirectStandardOutput twin.log -RedirectStandardError twin.err
          Start-Sleep -Seconds 2
          if ($twin.HasExited) { Get-Content twin.log, twin.err; exit 1 }
          $env:KKS_RELAY_URL = 'ws://127.0.0.1:18765'
          $failed = @()
          foreach ($t in Get-ChildItem out\plat\*.exe) {
            Write-Host "== $($t.Name)"
            & $t.FullName
            if ($LASTEXITCODE -ne 0) { $failed += $t.Name }
          }
          Stop-Process -Id $twin.Id -Force
          if ($failed) { Write-Host "failed: $failed"; Get-Content twin.log, twin.err -ErrorAction SilentlyContinue; exit 1 }
      - name: The app starts to its setup screen (UI Automation)
        shell: pwsh
        run: |
          $env:KKS_DATA_DIR = "$env:RUNNER_TEMP\walkdown"
          $app = Start-Process -FilePath out\Walkdown.exe -PassThru
          Set-Content -Path script.uia -Value "wait`tJoin through a server`t60" -Encoding ascii
          & out\uiadrive.exe Walkdown.exe "$PWD\script.uia" "$PWD\uia.log"
          $code = $LASTEXITCODE
          Get-Content uia.log
          Stop-Process -Id $app.Id -Force
          exit $code
