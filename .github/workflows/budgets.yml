# Budgets (NAT-7, WEB-15, OTH-5): measures what budgets.json sets, takes the median of the runs it states, keeps every
# result as an artifact and fails when a value passes its threshold. The scripts are in tools/budgets; the rules and
# baselines behind the numbers are in docs/m6/MEASUREMENTS.md. No plant data: every scenario uses the synthetic sample
# sheet (importer/tests/vectors/kkp-sample.pdf) on a fresh Nim server (tools/budgets/plant.py).
# - Linux: the GNOME app in a private headless mutter (apps/gnome/e2e/headless.sh); the Flatpak's installed files.
# - Windows: the exe cross-built here as apps/windows/README says, measured on a Windows runner; its server runs in
#   WSL 1 on the same runner (Ubuntu 26.04.1's WSL image, checked by SHA-256), the only way the app can reach one there.
# - Android: the release APK's size; startup and memory are measured on the phone before each release ("release-test").
# - Web: bundle sizes; lab LCP, CLS and TBT in Chromium (Playwright) with CPU and network throttled through CDP.
# - The server: its memory after a scripted workload.
# The `budgets` job compares everything; make it required for merge.
name: Budgets

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: budgets-${{ github.ref }}
  cancel-in-progress: true

env:
  NIM_VERSION: 2.2.12
  NIM_SHA256: 2639a06a5ea7a7fcf57df1e7e1ef4d1b2bee58c7ac9bd00dbd2aa5bea1e5a56a
  # the server's WSL distribution on the Windows runner: Ubuntu's own image, as listed in
  # https://github.com/microsoft/WSL/blob/master/distributions/DistributionInfo.json (checked 2026-10-06)
  WSL_IMAGE: https://releases.ubuntu.com/26.04.1/ubuntu-26.04.1-wsl-amd64.wsl
  WSL_SHA256: 48d56724b5c8e60f24893e83e73bbb58c60b3ca22fba3da977075420acd54104

jobs:
  linux-build:
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/nim
            ~/.local/kksdev/src/mupdf-1.28.2-source
          key: budgets-linux-${{ env.NIM_VERSION }}-${{ hashFiles('importer/fetch_mupdf.sh') }}
      - name: Headers
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends libgnutls28-dev libssl-dev zlib1g-dev libsqlite3-dev \
            libglib2.0-dev libjxl-dev libgtk-4-dev libadwaita-1-dev libsecret-1-dev libzxing-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libfontconfig-dev >/dev/null
      - name: Nim (pinned source, checked)
        run: |
          if [ ! -x ~/nim/bin/nim ]; then
            curl -sL -o /tmp/nim.tar.xz https://nim-lang.org/download/nim-$NIM_VERSION.tar.xz
            echo "$NIM_SHA256  /tmp/nim.tar.xz" | sha256sum -c
            mkdir -p ~/nim && tar xJf /tmp/nim.tar.xz -C ~/nim --strip-components=1
            (cd ~/nim && sh build.sh >/dev/null && bin/nim c --hints:off koch >/dev/null && ./koch boot -d:release --hints:off >/dev/null)
          fi
          echo "$HOME/nim/bin" >> "$GITHUB_PATH"
      - name: MuPDF (pinned source, checked)
        run: sh importer/fetch_mupdf.sh >/dev/null
      - name: The server, the importer, the GNOME app
        run: |
          mkdir -p out
          (cd platform/linux && nim c -d:release -o:../../out/kks_server kks_server.nim)
          (cd importer && nim c -d:release -o:../out/kks_import kks_import.nim)
          (cd apps/gnome && nim c -d:release -o:../../out/kks_explorer kks_explorer.nim)
          ls -la out
      - name: The measurement plant for the Windows job
        run: |
          python3 tools/budgets/plant.py prepare /tmp/plant out/kks_server out/kks_import
          tar czf out/plant.tgz -C /tmp plant
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: budgets-linux-build
          path: out
          retention-days: 7

  linux-app:
    needs: linux-build
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: budgets-linux-build
          path: out
      - name: Runtime (GTK, libadwaita, mutter, AT-SPI, Avahi)
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends libgtk-4-1 libadwaita-1-0 libsecret-1-0 libzxing3 \
            libjxl0.11 libgstreamer1.0-0 libgstreamer-plugins-base1.0-0 libsqlite3-0 mutter dbus-daemon at-spi2-core \
            python3-gi gir1.2-atspi-2.0 fuse3 avahi-daemon >/dev/null
          chmod +x out/kks_server out/kks_import out/kks_explorer
      - name: Startup and memory (headless mutter)
        run: apps/gnome/e2e/headless.sh python3 tools/budgets/linux_app.py out/kks_explorer out/kks_server out/kks_import results/linux.json
      - if: always()
        run: cp /tmp/kks-headless-mutter.log results/ 2>/dev/null || true
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: budget-results-linux-app
          path: results
          retention-days: 90

  linux-size:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50@sha256:1de59efef01a946d9f28f1ec3458bf6f61dcee3507d7fecdd473f8134da4ec77   # the multi-arch index (DEP-7), 2026-10-05
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          manifest-path: apps/gnome/flatpak/io.github._5wHN28Dg.walkdown.yml
          build-dir: flatpak_app
          build-bundle: false
          upload-artifact: false
          cache-key: budgets-flatpak-x86_64-${{ hashFiles('apps/gnome/flatpak/*.yml') }}
      - name: Installed size (the Flatpak's /app)
        run: python3 tools/budgets/sizes.py flatpak flatpak_app results/linux-size.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: budget-results-linux-size
          path: results
          retention-days: 90

  server:
    needs: linux-build
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: budgets-linux-build
          path: out
      - name: Runtime
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends libjxl0.11 libsqlite3-0 >/dev/null
          chmod +x out/kks_server out/kks_import
      - name: Memory after the workload
        run: python3 tools/budgets/server_mem.py out/kks_server out/kks_import results/server.json
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: budget-results-server
          path: results
          retention-days: 90

  web:
    needs: linux-build
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: budgets-linux-build
          path: out
      - name: Bundle sizes
        run: python3 tools/budgets/web.py bundles results/web-bundles.json
      - name: Runtime, Playwright (pinned) and its Chromium
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends libjxl0.11 libsqlite3-0 >/dev/null
          chmod +x out/kks_server out/kks_import
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install -q -r tools/budgets/requirements.txt
          /tmp/venv/bin/playwright install --with-deps chromium >/dev/null
      - name: Lab LCP, CLS, TBT
        run: /tmp/venv/bin/python tools/budgets/web.py lab out/kks_server out/kks_import results/web-lab.json
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: budget-results-web
          path: results
          retention-days: 90

  windows-build:
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/kksdev/win64
            ~/.local/kksdev/src/sqlite-amalgamation-3530400
            ~/nim
          key: budgets-win64-${{ env.NIM_VERSION }}-${{ hashFiles('platform/windows/build-deps.sh', 'android/nim/fetch_sqlite.sh') }}
      - name: mingw-w64 (Ubuntu's 13.0.0 headers, GCC 13.2: decision 0033)
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends gcc-mingw-w64-x86-64-posix g++-mingw-w64-x86-64-posix \
            mingw-w64-x86-64-dev binutils-mingw-w64-x86-64 cmake ninja-build >/dev/null
      - name: Nim (pinned source, checked)
        run: |
          if [ ! -x ~/nim/bin/nim ]; then
            curl -sL -o /tmp/nim.tar.xz https://nim-lang.org/download/nim-$NIM_VERSION.tar.xz
            echo "$NIM_SHA256  /tmp/nim.tar.xz" | sha256sum -c
            mkdir -p ~/nim && tar xJf /tmp/nim.tar.xz -C ~/nim --strip-components=1
            (cd ~/nim && sh build.sh >/dev/null && bin/nim c --hints:off koch >/dev/null && ./koch boot -d:release --hints:off >/dev/null)
          fi
          echo "$HOME/nim/bin" >> "$GITHUB_PATH"
      - name: Libraries (zlib, libjxl, zxing-cpp, SQLite)
        run: KKS_MINGW_BIN=/usr/bin sh platform/windows/build-deps.sh
      - name: The app and the UI Automation driver
        run: KKS_MINGW_BIN=/usr/bin NIM=nim sh apps/windows/build.sh "$PWD/out/Walkdown.exe"
      - name: Installed size (the MSIX layout)
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install -q Pillow==12.3.0
          /tmp/venv/bin/python tools/budgets/sizes.py windows out/Walkdown.exe results/windows-size.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: budgets-windows-build
          path: out/*.exe
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: budget-results-windows-size
          path: results
          retention-days: 90

  windows-app:
    needs: [linux-build, windows-build]
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: budgets-windows-build
          path: out
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: budgets-linux-build
          path: linux
      - name: The server in WSL 1 (Ubuntu 26.04.1, checked)
        shell: pwsh
        run: |
          $img = "$env:RUNNER_TEMP\ubuntu.wsl"
          Invoke-WebRequest -Uri $env:WSL_IMAGE -OutFile $img
          $got = (Get-FileHash $img -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $env:WSL_SHA256) { throw "WSL image: SHA-256 $got, expected $env:WSL_SHA256" }
          wsl --import walkdown C:\wsl\walkdown $img --version 1
          if ($LASTEXITCODE -ne 0) { throw "wsl --import failed" }
          wsl -d walkdown -u root -- sh -c "apt-get update -q >/dev/null && apt-get install -yq --no-install-recommends libsqlite3-0 libglib2.0-0t64 libgnutls30t64 python3 >/dev/null"
          if ($LASTEXITCODE -ne 0) { throw "packages in WSL failed" }
          wsl -d walkdown -u root -- sh -c "mkdir -p /root/b && cp linux/kks_server /root/b/ && chmod +x /root/b/kks_server && tar xzf linux/plant.tgz -C /root/b"
          if ($LASTEXITCODE -ne 0) { throw "copying the server into WSL failed" }
      - name: Startup and memory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force results | Out-Null
          $srv = Start-Process -FilePath wsl.exe -PassThru -NoNewWindow -RedirectStandardOutput results\server-out.log -RedirectStandardError results\server-err.log `
            -ArgumentList '-d','walkdown','-u','root','--','python3','tools/budgets/plant.py','serve','/root/b/plant','/root/b/kks_server','18080','18421'
          $up = $false
          for ($i = 0; $i -lt 120 -and -not $up; $i++) {
            Start-Sleep -Milliseconds 500
            try { $up = (Test-NetConnection 127.0.0.1 -Port 18421 -WarningAction SilentlyContinue).TcpTestSucceeded } catch { }
          }
          if (-not $up) { Get-Content results\server-out.log, results\server-err.log; throw "the server in WSL did not start" }
          python tools/budgets/windows_app.py out/Walkdown.exe out/uiadrive.exe 18421 results/windows.json
          $code = $LASTEXITCODE
          wsl -d walkdown -u root -- sh -c "cp /root/b/plant/server.log results/ 2>/dev/null; true"
          Stop-Process -Id $srv.Id -Force -ErrorAction SilentlyContinue
          exit $code
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: budget-results-windows-app
          path: results
          retention-days: 90

  android-size:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'            # Gradle 8.13 does not run on newer JDKs
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0; the pinned libjxl and zxing-cpp sources (checked by SHA-256 anyway)
        with:
          path: android/app2/build/third_party/download
          key: deps-${{ hashFiles('android/app2/build.gradle.kts') }}
      - name: The release APK (unsigned: signing stays on the maintainer's machine)
        working-directory: android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew --no-daemon :app2:assembleRelease
      - name: Installed size
        run: python3 tools/budgets/sizes.py android android/app2/build/outputs/apk/release/app2-release-unsigned.apk results/android-size.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: budget-results-android-size
          path: results
          retention-days: 90

  budgets:
    needs: [linux-app, linux-size, server, web, windows-build, windows-app, android-size]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: budget-results-*
          path: results
      - name: Compare with budgets.json
        run: python3 tools/budgets/check.py results
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: budgets-all-results
          path: results/all-results.json
          retention-days: 90
