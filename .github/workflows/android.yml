# Walkdown for Android: a debug APK and an UNSIGNED release APK, to check that the build works. Release signing stays
# on the maintainer's machine (https://github.com/5wHN28Dg/kks-explorer/wiki/Releasing): the key is never given to CI.
# The Nim core (libkks.so) is committed prebuilt (android/nim/build.sh); the emulator tests (android/app2/e2e) run
# on the maintainer's machine.
name: Android

on:
  push:
    branches: [main]
    # prose-only changes (CLAUDE.md, READMEs, docs/) don't build or test anything; the two READMEs tests read do
    paths: ['**', '!*.md', '!**/*.md', '!docs/**', 'relay/README.md', 'vendor/fonts/README.md']
  pull_request:
    # prose-only changes (CLAUDE.md, READMEs, docs/) don't build or test anything; the two READMEs tests read do
    paths: ['**', '!*.md', '!**/*.md', '!docs/**', 'relay/README.md', 'vendor/fonts/README.md']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'            # the JDK the Android build is tested with (JAVA_HOME on the maintainer's machine)
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0; the pinned libjxl and zxing-cpp sources (checked by SHA-256 anyway)
        with:
          path: android/app2/build/third_party/download
          key: deps-${{ hashFiles('android/app2/build.gradle.kts') }}
      - name: Build APKs
        working-directory: android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew --no-daemon :app2:assembleDebug :app2:assembleRelease
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: walkdown-android
          path: |
            android/app2/build/outputs/apk/debug/app2-debug.apk
            android/app2/build/outputs/apk/release/app2-release-unsigned.apk
          retention-days: 30
