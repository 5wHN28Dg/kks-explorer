# Walkdown Plant (decision 0054): on every change to the app, its content or the tools that make the content: the
# content through the reference validator (ref/plant3d.py, strict JSON), the content build (apps/plant3d/builder),
# the app's headless tests (walking up and down stairs and a ladder) and the exports (Android debug and unsigned
# release, Linux, Windows x86_64 and ARM64) made headless, unbaked and unsigned, to catch export errors; the Android ones are Gradle
# builds (the walkdown-plant:// intent filter, decision 0056) on a pinned JDK 17 (tools/plant3d/fetch_jdk.sh). The baked, signed release
# build is made on the maintainer's laptop (build.sh release): the shader baker needs a GPU (0041) and the key never
# comes to CI. Godot 4.7.2 and its export templates are fetched by tools/plant3d/bench/fetch_godot.sh (SHA-512).
name: Walkdown Plant app

on:
  pull_request:
    paths: ['apps/plant3d/**', 'data/plant3d/**', 'ref/plant3d.py', 'ref/plant3d_staff.py', 'ref/sjson.py', 'ref/courses.py',
            'ref/make_plant3d_vectors.py', 'ref/vectors/plant3d-v1.json', 'ref/vectors/plant3d-v2.json',
            'tests/test_plant3d.py', 'tests/test_plant3d_staff.py', 'tests/shards.py',
            'tests/test_plant3d_bench.py', 'docs/plant3d/FIRST-TRAIN.md', 'tools/plant3d/**',
            'platform/windows/fetch-llvm-mingw.sh', '.github/workflows/plant3d-app.yml', '.github/scripts/apt-install.sh',
            '.github/scripts/apt-cache-key.sh', '.github/actions/apt-cache/**', 'tools/download.sh']
  push:
    branches: [main]
    paths: ['apps/plant3d/**', 'data/plant3d/**', 'ref/plant3d.py', 'ref/plant3d_staff.py', 'ref/sjson.py', 'ref/courses.py',
            'ref/make_plant3d_vectors.py', 'ref/vectors/plant3d-v1.json', 'ref/vectors/plant3d-v2.json',
            'tests/test_plant3d.py', 'tests/test_plant3d_staff.py', 'tests/shards.py',
            'tests/test_plant3d_bench.py', 'docs/plant3d/FIRST-TRAIN.md', 'tools/plant3d/**',
            'platform/windows/fetch-llvm-mingw.sh', '.github/workflows/plant3d-app.yml', '.github/scripts/apt-install.sh',
            '.github/scripts/apt-cache-key.sh', '.github/actions/apt-cache/**', 'tools/download.sh']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plant3d-app-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # the content tests (the validator, the generator's output, the vectors) in a job of their own, in shards side by side
  # (tests/shards.py, `content`; tests/test_shards.py checks every test runs in one of them, once): in the app's job
  # they had grown to 30 of its 40 minutes (S1's staff, W3's runs), then test_plant3d alone to 27 of this job's 40 as
  # one part; each vector part is now made by a test of its own
  content:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0; Godot (the bench's tests), checked by SHA-512 when fetched
        with:
          path: ~/.local/kksdev/godot
          key: godot-editor-4.7.2-${{ hashFiles('tools/plant3d/bench/fetch_godot.sh') }}
      - name: Godot 4.7.2 (pinned)
        run: tools/plant3d/bench/fetch_godot.sh
      - name: The content tests (the validator, the generator's output, the vectors)
        run: python3 tests/shards.py content ${{ matrix.shard }}

  plant3d:
    runs-on: ubuntu-24.04            # its image has the Android SDK (apksigner) the Android export needs
    timeout-minutes: 40
    env:
      GODOT_TEMPLATES: android_debug.apk android_release.apk android_source.zip linux_release.x86_64 linux_debug.x86_64 windows_release_x86_64.exe windows_debug_x86_64.exe windows_release_arm64.exe windows_debug_arm64.exe icudt_godot.dat
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0; Godot and the templates (checked by SHA-512 when fetched)
        with:
          path: |
            ~/.local/kksdev/godot
            ~/.local/kksdev/jdk-17
            ~/.local/share/godot/export_templates
          key: godot-4.7.2-${{ hashFiles('tools/plant3d/bench/fetch_godot.sh', 'tools/plant3d/fetch_jdk.sh') }}-${{ hashFiles('.github/workflows/plant3d-app.yml') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0; the parts kit's CC0 textures (checked by SHA-256 when fetched and on every run)
        with:
          path: ~/.cache/walkdown-plant/textures
          key: kit-textures-${{ hashFiles('apps/plant3d/kit/fetch_textures.sh') }}
      - name: Godot 4.7.2 and the JDK 17 of its Android Gradle build (pinned)
        run: tools/plant3d/bench/fetch_godot.sh && tools/plant3d/fetch_jdk.sh
      # the voice codec's sources (godot-cpp, libopus, SpeexDSP), keyed on build.sh's pinned SHA-256 lines; build.sh
      # checks each file's SHA-256 on every run, cached or not, and fetches it again (with retries) when it differs
      - id: voice-src
        run: echo "key=voice-src-$(grep -E '^fetch ' apps/plant3d/voice/build.sh | sha256sum | cut -c1-32)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0; those sources (SHA-256 checked by build.sh)
        with:
          path: |
            ~/.local/kksdev/src/dl/godot-cpp-*.tar.gz
            ~/.local/kksdev/src/dl/opus-*.tar.gz
            ~/.local/kksdev/src/dl/speexdsp-*.tar.gz
          key: ${{ steps.voice-src.outputs.key }}
      # wdp_voice (decision 0069) for this machine, so that the app's tests run the voice codec (tests/test_voice.gd:
      # build.sh makes it required once the library is there) and the Linux export carries it. Built with the
      # runner's own GCC (WDP_LINUX_HOST): the release's, built in the Flatpak's SDK (the voice job below), needs that
      # runtime's glibc (2.43: sqrtf), newer than this runner's, so Godot here could not load it. CI's exports are
      # checks, never shipped.
      - name: wdp_voice for this runner (pinned sources, the host's GCC)
        run: WDP_JOBS=4 WDP_LINUX_HOST=1 apps/plant3d/voice/build.sh linux-x86_64 && cat apps/plant3d/voice/bin/BUILD-INFO.txt | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Content check, content build, the app's tests (shard 0; app-tests runs the others), headless exports
        run: PLANT_TEST_SHARD=0 apps/plant3d/build.sh export
      - name: Sizes
        run: ls -l apps/plant3d/export/check apps/plant3d/export/check/linux apps/plant3d/export/check/windows apps/plant3d/export/check/windows-arm64 | tee -a "$GITHUB_STEP_SUMMARY"

  # the app's other test shards (tests/shards.py app; tests/test_shards.py checks every test file runs in one of them,
  # once, shard 0 in the job above): all in one run, they had grown to the 600 s build.sh gives a Godot run (test_walk
  # alone ~170 s), and were cut off now and then. Each job makes the content (build.sh) and runs its shard.
  app-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app_shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0; Godot, checked by SHA-512 when fetched
        with:
          path: ~/.local/kksdev/godot
          key: godot-editor-4.7.2-${{ hashFiles('tools/plant3d/bench/fetch_godot.sh') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0; the parts kit's CC0 textures (checked by SHA-256 when fetched and on every run)
        with:
          path: ~/.cache/walkdown-plant/textures
          key: kit-textures-${{ hashFiles('apps/plant3d/kit/fetch_textures.sh') }}
      - name: Godot 4.7.2 (pinned)
        run: tools/plant3d/bench/fetch_godot.sh
      # the voice codec's sources (godot-cpp, libopus, SpeexDSP), keyed on build.sh's pinned SHA-256 lines; build.sh
      # checks each file's SHA-256 on every run, cached or not, and fetches it again (with retries) when it differs
      - id: voice-src
        run: echo "key=voice-src-$(grep -E '^fetch ' apps/plant3d/voice/build.sh | sha256sum | cut -c1-32)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0; those sources (SHA-256 checked by build.sh)
        with:
          path: |
            ~/.local/kksdev/src/dl/godot-cpp-*.tar.gz
            ~/.local/kksdev/src/dl/opus-*.tar.gz
            ~/.local/kksdev/src/dl/speexdsp-*.tar.gz
          key: ${{ steps.voice-src.outputs.key }}
      # as in the job above: tests/test_voice.gd runs the codec wherever its library is there (build.sh requires it then)
      - name: wdp_voice for this runner (pinned sources, the host's GCC)
        run: WDP_JOBS=4 WDP_LINUX_HOST=1 apps/plant3d/voice/build.sh linux-x86_64
      - name: Content check, content build, the app's tests (one shard)
        run: PLANT_TEST_SHARD=${{ matrix.app_shard }} apps/plant3d/build.sh tests

  # multiplayer's multi-instance harness (docs/plant3d/MULTIPLAYER.md §12, milestone MP2): headless Godot players of the
  # first train on the runner's loopback, some through the network simulator (apps/plant3d/net/tests/netsim.py), every
  # player's digests and events equal to each other's and to one engine fed the host's commits; 8 instances at once
  # take about 1.2 GB
  multiplayer:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0; Godot, checked by SHA-512 when fetched
        with:
          path: ~/.local/kksdev/godot
          key: godot-editor-4.7.2-${{ hashFiles('tools/plant3d/bench/fetch_godot.sh') }}
      - name: Godot 4.7.2 (pinned)
        run: tools/plant3d/bench/fetch_godot.sh
      - name: The harness's runs (2, 3 and 8 players, late join and rejoin, claims, desync and resync, fast-forward, floods, 150 ms and 400 ms with loss)
        run: python3 -m unittest discover -s apps/plant3d/net/tests -v

  # wdp_voice, the voice codec (decision 0069), for each platform the plant ships on, from its pinned sources, each
  # built twice in fresh folders and compared (apps/plant3d/voice/build.sh WDP_CHECK_REPRO=1): the libraries'
  # SHA-256 go to the summary (the same toolchains on the maintainer's laptop give the same bytes)
  voice:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [linux-x86_64, android-arm64, windows-x86_64, windows-arm64, native-test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # the voice codec's sources (godot-cpp, libopus, SpeexDSP), keyed on build.sh's pinned SHA-256 lines; build.sh
      # checks each file's SHA-256 on every run, cached or not, and fetches it again (with retries) when it differs
      - id: voice-src
        run: echo "key=voice-src-$(grep -E '^fetch ' apps/plant3d/voice/build.sh | sha256sum | cut -c1-32)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0; those sources (SHA-256 checked by build.sh)
        with:
          path: |
            ~/.local/kksdev/src/dl/godot-cpp-*.tar.gz
            ~/.local/kksdev/src/dl/opus-*.tar.gz
            ~/.local/kksdev/src/dl/speexdsp-*.tar.gz
          key: ${{ steps.voice-src.outputs.key }}
      # llvm-mingw's release tarball for the Windows targets, keyed on its fetcher (fetch-llvm-mingw.sh checks its SHA-256)
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0; checked by SHA-256 when used
        if: startsWith(matrix.target, 'windows')
        with:
          path: ~/.local/kksdev/src/dl/llvm-mingw-*.tar.xz
          key: llvm-mingw-tarball-${{ hashFiles('platform/windows/fetch-llvm-mingw.sh') }}
      - uses: ./.github/actions/apt-cache   # the job's Ubuntu archives from earlier runs (checked by SHA-256 when used)
        id: apt-cache
        if: startsWith(matrix.target, 'linux')
        with: {name: voice-linux, mode: restore}
      - name: The toolchain (the Flatpak SDK; the NDK the plant's voice library pins; llvm-mingw comes with build.sh)
        run: |
          case "${{ matrix.target }}" in
            linux-*)
              .github/scripts/apt-install.sh flatpak
              flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
              flatpak install --user -y --noninteractive flathub org.freedesktop.Sdk//26.08
              flatpak update --user -y --noninteractive --commit="$(sed -n 's/^SDK_PIN=//p' apps/plant3d/voice/build.sh)" org.freedesktop.Sdk//26.08 ;;
            android-*)
              yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018" >/dev/null ;;
          esac
      - uses: ./.github/actions/apt-cache   # what this run checked and used, for the next (also after a failure)
        if: always() && steps.apt-cache.outcome == 'success'
        with: {name: voice-linux, mode: save}
      - name: "wdp_voice ${{ matrix.target }}, built twice and compared (native-test: the sanitizer test)"
        run: WDP_JOBS=4 WDP_CHECK_REPRO=1 apps/plant3d/voice/build.sh ${{ matrix.target }} && cat apps/plant3d/voice/bin/BUILD-INFO.txt | tee -a "$GITHUB_STEP_SUMMARY"
