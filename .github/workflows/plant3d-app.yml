# Walkdown Plant (decision 0054): on every change to the app, its content or the tools that make the content: the
# content through the reference validator (ref/plant3d.py, strict JSON), the content build (apps/plant3d/builder),
# the app's headless tests (walking up and down stairs and a ladder) and the exports (Android debug and unsigned
# release, Linux, Windows x86_64 and ARM64) made headless, unbaked and unsigned, to catch export errors; the Android ones are Gradle
# builds (the walkdown-plant:// intent filter, decision 0056) on a pinned JDK 17 (tools/plant3d/fetch_jdk.sh). The baked, signed release
# build is made on the maintainer's laptop (build.sh release): the shader baker needs a GPU (0041) and the key never
# comes to CI. Godot 4.7.2 and its export templates are fetched by tools/plant3d/bench/fetch_godot.sh (SHA-512).
name: Walkdown Plant app

on:
  pull_request:
    paths: ['apps/plant3d/**', 'data/plant3d/**', 'ref/plant3d.py', 'ref/plant3d_staff.py', 'ref/sjson.py', 'ref/courses.py',
            'ref/make_plant3d_vectors.py', 'ref/vectors/plant3d-v1.json', 'ref/vectors/plant3d-v2.json',
            'tests/test_plant3d.py', 'tests/test_plant3d_staff.py', 'tests/shards.py',
            'tests/test_plant3d_bench.py', 'docs/plant3d/FIRST-TRAIN.md', 'tools/plant3d/**',
            '.github/workflows/plant3d-app.yml']
  push:
    branches: [main]
    paths: ['apps/plant3d/**', 'data/plant3d/**', 'ref/plant3d.py', 'ref/plant3d_staff.py', 'ref/sjson.py', 'ref/courses.py',
            'ref/make_plant3d_vectors.py', 'ref/vectors/plant3d-v1.json', 'ref/vectors/plant3d-v2.json',
            'tests/test_plant3d.py', 'tests/test_plant3d_staff.py', 'tests/shards.py',
            'tests/test_plant3d_bench.py', 'docs/plant3d/FIRST-TRAIN.md', 'tools/plant3d/**',
            '.github/workflows/plant3d-app.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plant3d-app-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # the content tests (the validator, the generator's output, the vectors) in a job of their own, in shards side by side
  # (tests/shards.py, `content`; tests/test_shards.py checks every test runs in one of them, once): in the app's job
  # they had grown to 30 of its 40 minutes (S1's staff, W3's runs), then test_plant3d alone to 27 of this job's 40 as
  # one part; each vector part is now made by a test of its own
  content:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0; Godot (the bench's tests), checked by SHA-512 when fetched
        with:
          path: ~/.local/kksdev/godot
          key: godot-editor-4.7.2-${{ hashFiles('tools/plant3d/bench/fetch_godot.sh') }}
      - name: Godot 4.7.2 (pinned)
        run: tools/plant3d/bench/fetch_godot.sh
      - name: The content tests (the validator, the generator's output, the vectors)
        run: python3 tests/shards.py content ${{ matrix.shard }}

  plant3d:
    runs-on: ubuntu-24.04            # its image has the Android SDK (apksigner) the Android export needs
    timeout-minutes: 40
    env:
      GODOT_TEMPLATES: android_debug.apk android_release.apk android_source.zip linux_release.x86_64 linux_debug.x86_64 windows_release_x86_64.exe windows_debug_x86_64.exe windows_release_arm64.exe windows_debug_arm64.exe icudt_godot.dat
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0; Godot and the templates (checked by SHA-512 when fetched)
        with:
          path: |
            ~/.local/kksdev/godot
            ~/.local/kksdev/jdk-17
            ~/.local/share/godot/export_templates
          key: godot-4.7.2-${{ hashFiles('tools/plant3d/bench/fetch_godot.sh', 'tools/plant3d/fetch_jdk.sh') }}-${{ hashFiles('.github/workflows/plant3d-app.yml') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0; the parts kit's CC0 textures (checked by SHA-256 when fetched and on every run)
        with:
          path: ~/.cache/walkdown-plant/textures
          key: kit-textures-${{ hashFiles('apps/plant3d/kit/fetch_textures.sh') }}
      - name: Godot 4.7.2 and the JDK 17 of its Android Gradle build (pinned)
        run: tools/plant3d/bench/fetch_godot.sh && tools/plant3d/fetch_jdk.sh
      - name: Content check, content build, the app's tests, headless exports
        run: apps/plant3d/build.sh export
      - name: Sizes
        run: ls -l apps/plant3d/export/check apps/plant3d/export/check/linux apps/plant3d/export/check/windows apps/plant3d/export/check/windows-arm64 | tee -a "$GITHUB_STEP_SUMMARY"
