; Release exports for the bench (build.sh). Shaders are baked at export (shader_baker/enabled), as a shipped app's
; would be. Android signing comes from the environment: GODOT_ANDROID_KEYSTORE_RELEASE_PATH / _USER / _PASSWORD
; (build.sh falls back to the Godot debug keystore: a bench, never published).
[preset.0]

name="Android"
platform="Android"
runnable=true
export_filter="all_resources"
include_filter=""
exclude_filter="*.sh,*.md,*.log"
export_path="export/bench.apk"

[preset.0.options]

shader_baker/enabled=true
gradle_build/use_gradle_build=false
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
keystore/release=""
keystore/release_user=""
keystore/release_password=""
package/unique_name="kks.plant3d.bench"
package/name="KKS plant3d bench"
version/code=5
version/name="0.5"
screen/immersive_mode=true
graphics/opengl_debug=false
permissions/internet=false

[preset.1]

name="Linux"
platform="Linux"
runnable=true
export_filter="all_resources"
include_filter=""
exclude_filter="*.sh,*.md,*.log"
export_path="export/bench.x86_64"

[preset.1.options]

shader_baker/enabled=true
binary_format/architecture="x86_64"
binary_format/embed_pck=false
